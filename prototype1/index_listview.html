<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Power Grid List View</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    svg {
      width: 100vw;
      height: 100vh;
      background: #f5f5f5;
      display: block;
    }

    .generator-on {
      fill: #90ee90;
    }

    .generator-off {
      fill: #f08080;
    }

    .selected-single {
      fill: orange;
    }

    .highlight-group {
      stroke: dodgerblue;
      stroke-width: 4px;
    }

    #info-panel {
      position: absolute;
      right: 0;
      top: 0;
      width: 250px;
      background: white;
      padding: 12px;
      border-left: 1px solid #ccc;
      box-shadow: -2px 0 6px rgba(0,0,0,0.1);
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
    }

    #status-panel {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 250px;
      background: #f9f9f9;
      border-top: 1px solid #ccc;
      padding: 8px;
      box-shadow: -2px -2px 4px rgba(0,0,0,0.05);
    }

    #filter-panel {
      position: absolute;
      top: 40px;
      left: 300px;
      width: 160px;
      background: #f0f0f0;
      border: 2px solid #888;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      padding: 8px;
      z-index: 1000;
    }

    #filter-header {
      font-weight: bold;
      background: #ccc;
      padding: 6px;
      cursor: move;
      user-select: none;
      margin: -8px -8px 8px -8px;
      border-radius: 6px 6px 0 0;
    }
  </style>
</head>
<body>

<svg id="topology"></svg>

<!-- Script load order matters -->
<script type="module" src="./js/main_combined.js"></script>

</body>
</html>
