<svg id="topology"></svg>

<!-- TEST: tool tip for buses & lines -->
<div id="tooltip" class="tooltip"></div>

<!-- Info Panel -->
<div id="info-panel" class="panel panel-info">
  <h2>Generator Info</h2>
  <div id="details">Select a generator</div>
</div>

<!-- Status Panel -->
<div id="status-panel" class="panel panel-status">
  <!-- Will be populated by renderStatusPanel() -->
</div>

<!-- Filter Panel -->
<div id="filter-panel" class="panel panel-filter">
  <div id="filter-header">Filters</div>
  <label><input type="checkbox" class="region-filter" value="north"> North</label><br>
  <label><input type="checkbox" class="region-filter" value="west"> West</label><br>
  <label><input type="checkbox" class="region-filter" value="south"> South</label><br>
</div>
