<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generator Object Grid</title>
  <style>
  body {
    margin: 0;
    font-family: sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #canvas {
    flex: 1;
    background: #f5f5f5;
  }

  #info-panel {
    width: 250px;
    background: #fff;
    border-left: 1px solid #ccc;
    padding: 16px;
    box-shadow: -2px 0 6px rgba(0, 0, 0, 0.1);
  }

  button {
    margin-bottom: 12px;
    padding: 6px 10px;
  }

  .generator-circle {
    cursor: pointer;
    stroke: #333;
    stroke-width: 1.5px;
    fill: gray;
  }

  .generator-on {
  fill: #90ee90 !important;
}

.generator-off {
  fill: #f08080 !important;
}

.selected-single {
  fill: orange !important;
}

.highlight-group {
  stroke: dodgerblue;
  stroke-width: 4px;
}

  .region-north {
    opacity: 1;
  }

  .region-south {
    opacity: 0.9;
  }

  .region-east {
    opacity: 0.85;
  }

  .region-west {
    opacity: 0.8;
  }

  #filter-panel {
  position: absolute;
  top: 40px;
  left: 320px;
  width: 160px;
  background: #f0f0f0;
  border: 2px solid #888;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  padding: 8px;
  cursor: default;
  z-index: 1000;
}

#filter-header {
  font-weight: bold;
  background: #ccc;
  padding: 6px;
  border-bottom: 1px solid #aaa;
  cursor: move;
  margin: -8px -8px 8px -8px;
  border-radius: 6px 6px 0 0;
}

</style>

</head>
<body>

  <svg id="canvas" width="100%" height="100%"></svg>

  <div id="info-panel">
  <h2>Generator Info</h2>
  <div id="details">Select a generator</div>
  <hr>
  <div id="status-panel"></div>
</div>

  <div id="filter-panel">
  <div id="filter-header">Filters</div>
  <label><input type="checkbox" class="region-filter" value="north"> North</label><br>
  <label><input type="checkbox" class="region-filter" value="west"> West</label><br>
  <label><input type="checkbox" class="region-filter" value="south"> South</label>
</div>


  <script type="module" src="object_view.js"></script>

</body>
</html>
