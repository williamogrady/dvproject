<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>dvproject</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="/prototype1/css/styles.css" />
</head>
<body>

  <div id="map-view-title">Map-Situated View</div>

  
  <div id="info-panel" style="position:absolute; top:80px; right:20px; width:200px; font-family:sans-serif;"></div>


  <div id="control-panel">
    <div id="control-header">Control Panel</div>
  
    <div id="control-content">
      <button id="toggle-topology">Show Full Topology</button>
    </div>
    </div>
  </div>

  <div id="legend-box">
    Legend
  </div>


  <div id="tooltip" style="
  position: absolute;
  padding: 6px 12px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-family: sans-serif;
  font-size: 14px;
  pointer-events: none;
  visibility: hidden;
  z-index: 10;
"></div>
  
  <svg id="topology"></svg>
  <script src="./js/map-situated-view.js"></script> 

</body>
</html>
