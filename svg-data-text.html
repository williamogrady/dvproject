<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Topology Switching (23/4)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="week15/css/styles.css" />
</head>
<body>

  
  <div id="info-panel" style="position:absolute; top:80px; right:20px; width:200px; font-family:sans-serif;"></div>


  <div id="mode-controls" style="position: absolute; top: 10px; left: 10px;">
    <button id="change-mode">Change Mode</button>
    <div id="mode-indicator">Current Mode: Full Topology</div>
  </div>

  <div id="tooltip" style="
  position: absolute;
  padding: 6px 12px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-family: sans-serif;
  font-size: 14px;
  pointer-events: none;
  visibility: hidden;
  z-index: 10;
"></div>
  
  <svg id="topology"></svg>
  <script src="week15/js/svg-map2.js"></script> 

</body>
</html>
