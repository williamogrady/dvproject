<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power Grid List View</title>
  <style>
    /* GLOBAL STYLES */
    body {
      margin: 0;
      font-family: sans-serif;
      background: #1e1e1e;
      color: #f0f0f0;
    }

    #main-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #listView-container {
      width: 65%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      padding: 0 20px;
      box-sizing: border-box;
      gap: 1rem;
    }

    .row {
      display: flex;
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem 0;
    }

    #map-panel {
      width: 35%;
      height: 100vh;
      background: #111;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-sizing: border-box;
    }

    /* ROW 1: OVERVIEW */
    .overview-card {
      width: 100%;
      height: 100%;
      background: #2f2f2f;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      box-sizing: border-box;
    }

    .overview-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .overview-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .power-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #4caf50;
    }

    .cost-value {
      font-size: 1.4rem;
      color: #ffc107;
    }

    .emissions-value {
      font-size: 1.2rem;
      color: #f44336;
      margin-top: 0.5rem;
    }

    .label {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 0.25rem;
    }

    /* ROW 2: LINES */
    #row-2 {
      height: 10%;
      gap: 1rem;
    }

    .lines-status-card {
      width: 180px;
      background: #2f2f2f;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
    }

    .status-number {
      font-size: 2rem;
      color: #f44336;
      font-weight: bold;
    }

    .status-label {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 0.25rem;
    }

    .lines-scroll-card {

       
  scrollbar-width: none;          /* Firefox */
  -ms-overflow-style: none;       /* IE 10+ */
  overflow-x: scroll;             /* keep scroll behavior */
    position: relative;
      flex: 1;
      background: #1c1c1c;
      border-radius: 12px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      padding: 0 1rem;
      gap: 0.5rem;
      box-sizing: border-box;
      cursor: grab;
      user-select: none;
    }

    .lines-scroll-card.active {
      cursor: grabbing;
    }

    .lines-scroll-card::-webkit-scrollbar {
  display: none;                  /* Chrome, Safari, Opera */
}

    .line-card {
      flex: 0 0 auto;
      background-color: hsl(0, 100%, calc(100% - (var(--load, 0) * 70%)));
      color: #111;
      font-weight: bold;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      min-width: 120px;
      text-align: center;
      cursor: grab;
      user-select: none;
      transition: background-color 0.3s ease;
    }

    .scroll-thumb {
    position: absolute;
    bottom: 4px;
    left: 0;
    height: 6px;
    border-radius: 3px;
    background: #aaa;
    width: 40px; /* will be updated via JS */
    transition: background 0.3s ease;
    pointer-events: none;
    opacity: 0.8;
    }

    /* While actively scrolling */
    .lines-scroll-card.active .scroll-thumb {
    background: #42a5f5; /* Blue: your control/user color */
    }

#row-3 {
  height: 70%;
  padding: 0;
}

#generators-container {
  display: flex;
  width: 100%;
  height: 100%;
  justify-content: space-between; /* ✅ pushes columns apart */
  gap: 2rem;                      /* ✅ adds physical space */
  padding: 0 1rem;                /* ✅ space from edge of row */
  box-sizing: border-box;
}

.generator-column {
  flex: 1;
  min-width: 0;
  background: #222;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER = Top 10% */
.generator-header {
  flex: 0 0 10%;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #333;
  box-sizing: border-box;
}

.column-label {
  font-size: 0.95rem;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.25rem;
}

.menu-placeholder {
  font-size: 0.85rem;
  color: #666;
}

/* BODY = Bottom 90% (scrollable list of generator blocks) */
.generator-body {
  flex: 1;
  padding: 1rem;
  overflow-y: auto;
  box-sizing: border-box;
}


#row-4 {
  height: 10%;
  display: flex;
  gap: 1rem;
  padding: 0 1rem;
  box-sizing: border-box;
  align-items: center;
}

.controls-left {
  flex: 1;
  background: #2a2a2a;
  border-radius: 10px;
  padding: 1rem;
  display: flex;
  align-items: center;
  color: #ccc;
  font-size: 0.9rem;
}

.controls-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex: 0 0 160px;
}

.submit-button {
  padding: 0.75rem 1.5rem;
  background-color: #42a5f5; /* blue: user/control color */
  border: none;
  border-radius: 6px;
  color: white;
  font-weight: bold;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.2s ease;
}

.submit-button:hover {
  background-color: #2196f3;
}

  </style>
</head>
<body>
  <div id="main-layout">
    <!-- LEFT PANEL -->
    <div id="listView-container">
      <!-- ROW 1: Overview -->
      <div class="row" id="row-1">
        <div class="overview-card">
          <div class="overview-left">
            <div class="power-value">1,230 MW</div>
            <div class="label">Total Power</div>
          </div>
          <div class="overview-right">
            <div class="cost-value">💲💲💲</div>
            <div class="label">Total Cost</div>
            <div class="emissions-value">CO₂ CO₂</div>
            <div class="label">Total Emissions</div>
          </div>
        </div>
      </div>

      <!-- ROW 2: Transmission Lines -->
      <div class="row" id="row-2">
        <div class="lines-status-card">
          <div class="status-number">3</div>
          <div class="status-label">Overloaded Lines</div>
        </div>
        <div class="lines-scroll-card">
          <div class="line-card" style="--load: 0.9">Line 12 → 18 • 90%</div>
          <div class="line-card" style="--load: 0.7">Line 44 → 23 • 70%</div>
          <div class="line-card" style="--load: 0.55">Line 32 → 14 • 55%</div>
          <div class="line-card" style="--load: 0.35">Line 19 → 7 • 35%</div>
          <div class="line-card" style="--load: 0.1">Line 5 → 11 • 10%</div>
          <div class="scroll-thumb"></div>
        </div>
      </div>

      <!-- ROWS 3 & 4: Reserved -->
      <div class="row" id="row-3">
  <div class="generator-column" id="active-container">
    <div class="generator-header">
      <div class="column-label">Active Generators</div>
      <div class="menu-placeholder">[Sort / Filter menu]</div>
    </div>
    <div class="generator-body"></div>
  </div>

  <div class="generator-column" id="inactive-container">
    <div class="generator-header">
      <div class="column-label">Inactive Generators</div>
      <div class="menu-placeholder">[Sort / Filter menu]</div>
    </div>
    <div class="generator-body"></div>
  </div>
</div>

      <div class="row" id="row-4">
  <div class="controls-left">
    <div class="admin-placeholder">[Admin Controls Here]</div>
  </div>
  <div class="controls-right">
    <button class="submit-button">Submit</button>
  </div>
</div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="map-panel">
      <h2>Map</h2>
    </div>
  </div>

  <!-- DRAG-TO-SCROLL SCRIPT -->
  <script>
  const scrollContainer = document.querySelector('.lines-scroll-card');
  const scrollThumb = scrollContainer.querySelector('.scroll-thumb');

  let isDown = false;
  let startX;
  let scrollLeft;

  // Update scroll thumb position
  function updateThumb() {
    const visibleRatio = scrollContainer.clientWidth / scrollContainer.scrollWidth;
    const thumbWidth = visibleRatio * scrollContainer.clientWidth;
    const scrollRatio = scrollContainer.scrollLeft / (scrollContainer.scrollWidth - scrollContainer.clientWidth);
    scrollThumb.style.width = `${thumbWidth}px`;
    scrollThumb.style.left = `${scrollRatio * (scrollContainer.clientWidth - thumbWidth)}px`;
  }

  scrollContainer.addEventListener('mousedown', (e) => {
    isDown = true;
    scrollContainer.classList.add('active');
    startX = e.pageX - scrollContainer.offsetLeft;
    scrollLeft = scrollContainer.scrollLeft;
  });

  ['mouseup', 'mouseleave'].forEach(event =>
    scrollContainer.addEventListener(event, () => {
      isDown = false;
      scrollContainer.classList.remove('active');
    })
  );

  scrollContainer.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - scrollContainer.offsetLeft;
    const walk = (x - startX) * 1.5;
    scrollContainer.scrollLeft = scrollLeft - walk;
    updateThumb();
  });

  scrollContainer.addEventListener('scroll', updateThumb);
  window.addEventListener('resize', updateThumb);
  updateThumb(); // Initial run
</script>

</body>
</html>
