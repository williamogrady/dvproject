<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DV Project</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #f5f5f5;
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: #333;
    }

    .button-container {
      display: flex;
      gap: 1.5rem;
    }

    .view-button1 {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background-color: #4fa552;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .view-button2 {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background-color: #4468b6;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .view-button:hover {
      background-color: #388e3c;
    }
  </style>
</head>
<body>
  <h1>DV Project</h1>
  <div class="button-container">
    <button class="view-button1" onclick="window.location.href='/list'">List View</button>
    <button class="view-button2" onclick="window.location.href='/map'"> Map View</button>
  </div>
</body>
</html>
