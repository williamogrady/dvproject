<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Case118 Grid Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* Basic Layout & Colors */
    html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: #1e1e1e;
    color: #f0f0f0;
    box-sizing: border-box;
    overflow: hidden;
    }

    #main-layout {
  display: flex;
  height: 100vh;
  width: 100vw;
}

#listView-container {
  width: 65%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 20px;
  box-sizing: border-box;
  gap: 1rem;
}


    #map-panel {
      width: 35%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #888;
    }

    .row {
    display: flex;
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem 0;
    }

    /* Overview */
    #row-1 {
      height: 15%;
    }

    .overview-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2f2f2f;
      border-radius: 20px;
      padding: 1rem 2rem;
      width: 100%;
    }

    .overview-scenario,
    .overview-emissions,
    .overview-cost,
    .overview-power {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .overview-power {
      align-items: flex-end;
    }

    .label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.25rem;
    }

    .power-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #4caf50;
    }

    .cost-value {
      font-size: 1.4rem;
      color: #ffc107;
    }

    .emissions-value {
      font-size: 1.2rem;
      color: #f44336;
    }

    .scenario-name {
      font-size: 1.1rem;
      color: #ddd;
      font-weight: 600;
    }


    /* Lines */
    #row-2 {
      height: 10%;
      gap: 1.0rem;
    }

    .lines-status-card {
      width: 200px;
      background: #2f2f2f;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lines-scroll-card {
      flex: 1;
      background: #1c1c1c;
      border-radius: 10px;
      overflow-x: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
      cursor: grab;
    }

  .line-card {
    font-size: 0.95rem;
    font-weight: bold;
    min-width: 120px;
    text-align: center;
    padding: 0.5rem 1rem;
    color: #111;
    border-radius: 8px;
    background-color: hsl(0, 100%, calc(100% - (var(--load, 0) * 70%)));
  }

 #row-3 {
  height: 60%;
  padding: 0;
}

#generators-container {
  display: flex;
  width: 100%;
  height: 100%;
  justify-content: space-between; /* ✅ pushes columns apart */
  gap: 2rem;                      /* ✅ adds physical space */
  padding: 0 1rem;                /* ✅ space from edge of row */
  box-sizing: border-box;
}

.generator-column {
  flex: 1;
  min-width: 0;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px #333;
}

/* Differentiated colors */
#inactive-container {
  background: #262626;
}

#active-container {
  background: #1f1f1f;
}


/* HEADER = Top 10% */
.generator-header {
  flex: 0 0 10%;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #333;
  box-sizing: border-box;
}

.column-label {
  font-size: 0.95rem;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.25rem;
}

.column-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sort-options {
  font-size: 0.75rem;
  color: #888;
}

.sort-options span {
  cursor: pointer;
  padding: 0 4px;
}

.sort-options span:hover {
  color: #42a5f5;
  text-decoration: underline;
}


/* BODY = Bottom 90% (scrollable list of generator blocks) */
.generator-body {
  flex: 1;
  padding: 1rem;
  overflow-y: auto;
  box-sizing: border-box;
}

.generator-card {
  display: flex;
  width: 100%;
  height: 90px;
  margin-bottom: 1rem;
  border-radius: 10px;
  background: #2c2c2c;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  font-size: 0.85rem;
}

/* LEFT = 20% */
.gen-section.left {
  width: 20%;
  background: #444;
  color: #fff;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.2rem;
}

.gen-name {
  font-weight: bold;
  font-size: 0.95rem;
}

.gen-number {
  font-size: 0.75rem;
  color: #aaa;
}

.gen-type {
  font-size: 0.7rem;
  background: #555;
  border-radius: 4px;
  padding: 2px 6px;
  text-transform: uppercase;
}

/* CENTER = 50% */
.gen-section.center {
  width: 50%;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 0.4rem;
}

.gen-power .power-label {
  font-size: 0.7rem;
  color: #aaa;
  margin-bottom: 0.2rem;
}

.power-bar {
  background: #444;
  height: 20px;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

.power-fill {
  background: #4caf50;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  border-radius: 6px;
}

.power-label-center {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  font-size: 0.75rem;
  color: white;
  text-align: center;
  line-height: 20px;
  pointer-events: none;
}

.gen-impact-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 0.85rem;
  margin-top: 0.4rem;
}

.gen-cost, .gen-emissions {
  display: flex;
  gap: 4px;
  white-space: nowrap;
}


.faded {
  opacity: 0.3;
}

/* RIGHT = 30% */
.gen-section.right {
  width: 30%;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}

.inactive .gen-section.right {
  background: #1a1a1a;
}

.plus-button {
  font-size: 1.5rem;
  border: 2px dashed #666;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #999;
  transition: all 0.2s ease;
}

.plus-button:hover {
  background: #42a5f5;
  border-color: #42a5f5;
  color: #fff;
}

.minus-button {
  font-size: 1.5rem;
  border: 2px dashed #666;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #999;
  transition: all 0.2s ease;
  cursor: pointer;
}

.minus-button:hover {
  background: #f44336;
  border-color: #f44336;
  color: white;
}


    /* Row 4: Controls */
    #row-4 {
      height: 10%;
      display: flex;
      gap: 1rem;
      padding: 0 1rem;
      box-sizing: border-box;
      align-items: center;
    }

    .controls-left {
      flex: 1;
      background: #2a2a2a;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      align-items: center;
      color: #ccc;
      font-size: 0.9rem;
    }

    .controls-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 160px;
    }

    .submit-button {
      padding: 0.75rem 1.5rem;
      background-color: #42a5f5; /* blue: user/control color */
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .submit-button:hover {
      background-color: #2196f3;
    }



  </style>
</head>
<body>
  <div id="main-layout">
    <div id="listView-container">
      <!-- Row 1: Overview -->
      <div class="row" id="row-1">
        <div class="overview-card">

          <div class="overview-power">
            <div class="label">Power</div>
            <div class="power-value" id="overview-power">–</div>
          </div>

          <div class="overview-emissions">
            <div class="label">Emissions</div>
            <div class="emissions-value" id="overview-emissions">–</div>
          </div>

          <div class="overview-cost">
            <div class="label">Cost</div>
            <div class="cost-value" id="overview-cost">–</div>
          </div>

          <div class="overview-scenario">
            <div class="label">Scenario</div>
            <div class="scenario-name">Clean North Power</div>
          </div>
        </div>
      </div>

      <!-- Row 2: Transmission Lines -->
      <div class="row" id="row-2">
        <div class="lines-status-card">
          <div class="status-number" id="line-status-count">–</div>
          <div class="status-label">Overloaded Lines</div>
        </div>
        <div class="lines-scroll-card" id="line-scroll"></div>
      </div>

      <!-- Row 3: Generators -->
          
      <div class="row" id="row-3">
      <div id="generators-container">
        <div class="generator-column" id="inactive-container">
          <div class="generator-header">
            <div class="column-label-row">
              <div class="column-label">Inactive Generators</div>
              <div class="sort-options" data-type="inactive">
                Sort by:
                <span data-sort="bus">Bus</span> |
                <span data-sort="pmax">Power</span> |
                <span data-sort="cost">Cost</span> |
                <span data-sort="emissions">Emissions</span>
              </div>
            </div>
          </div>
          <div class="generator-body">
            <!-- generator cards injected here -->
          </div>
        </div>

        <div class="generator-column" id="active-container">
          <div class="generator-header">
            <div class="column-label-row">
              <div class="column-label">Active Generators</div>
              <div class="sort-options" data-type="inactive">
                Sort by:
                <span data-sort="bus">Bus</span> |
                <span data-sort="pmax">Power</span> |
                <span data-sort="cost">Cost</span> |
                <span data-sort="emissions">Emissions</span>
              </div>
            </div>
          </div>
          <div class="generator-body">
            <!-- generator cards injected here -->
          </div>
        </div>
      </div>
    </div>


      <!-- Row 4: Submit -->
          <div class="row" id="row-4">
      <div class="controls-left">
        [Admin Controls Placeholder]
      </div>
      <div class="controls-right">
        <button class="submit-button">Submit</button>
      </div>
    </div>
    </div>
    <div id="map-panel">Map</div>
  </div>

  <script>

    let activeSort = {
        inactive: 'bus',
        active: 'bus'
      };



    async function loadData() {
      const res = await fetch('/api/scenario/clean_north_power');
      const data = await res.json();
      renderOverview(data.generators, data.lines);
      renderLines(data.lines);
      renderGenerators(data.generators);
      bindSortListeners();
    }

    function renderOverview(gens, lines) {
      const totalPower = gens.reduce((sum, g) => sum + g.pg, 0);
      const totalCost = gens.reduce((sum, g) => sum + g.pg * g.cost_per_mw, 0);
      const totalEmissions = gens.reduce((sum, g) => sum + g.pg * g.emissions_per_mw, 0);
      const overloaded = lines.filter(l => l.overloaded).length;

      document.getElementById("overview-power").textContent = `${totalPower.toFixed(1)} MW`;
      document.getElementById("overview-cost").textContent = `$${totalCost.toFixed(2)}`;
      document.getElementById("overview-emissions").textContent = `${totalEmissions.toFixed(0)} CO₂`;
      document.getElementById("line-status-count").textContent = overloaded;
    }

    function renderLines(lines) {
  const container = document.getElementById("line-scroll");
  container.innerHTML = "";

  // ✅ Sort lines by load percentage descending
  const sorted = [...lines].sort((a, b) => {
    const pctA = a.flow / a.rate_a;
    const pctB = b.flow / b.rate_a;
    return pctB - pctA;
  });

  sorted.forEach(line => {
    const pct = Math.round((line.flow / line.rate_a) * 100);
    const color = d3.interpolateReds(pct / 100);
    const textColor = pct > 60 ? "white" : "#111";

    const card = document.createElement("div");
    card.className = "line-card";
    card.style.background = color;
    card.style.color = textColor;
    card.style.setProperty('--load', pct / 100);
    card.innerHTML = `Line ${line.from_bus} → ${line.to_bus}<br>${pct}%`;

    container.appendChild(card);
  });
}


function renderGenerators(gens) {
  const inactiveContainer = document.querySelector("#inactive-container .generator-body");
  const activeContainer = document.querySelector("#active-container .generator-body");
  inactiveContainer.innerHTML = "";
  activeContainer.innerHTML = "";

  const maxPmax = Math.max(...gens.map(g => g.pmax));

  // 🔁 Separate and sort
  const sortKey = key => (a, b) => {
    if (key === 'cost') return b.cost_per_mw - a.cost_per_mw;
    if (key === 'emissions') return b.emissions_per_mw - a.emissions_per_mw;
    if (key === 'pmax') return b.pmax - a.pmax;
    return a.bus - b.bus;
  };

  const inactiveGens = gens.filter(g => g.pg === 0).sort(sortKey(activeSort.inactive));
  const activeGens = gens.filter(g => g.pg > 0).sort(sortKey(activeSort.active));

  // 🔁 Render Inactive Generators
  inactiveGens.forEach(gen => {
    const card = createGeneratorCard(gen, maxPmax, true);
    inactiveContainer.appendChild(card);
  });

  // 🔁 Render Active Generators
  activeGens.forEach(gen => {
    const card = createGeneratorCard(gen, maxPmax, false);
    activeContainer.appendChild(card);
  });
}

function createGeneratorCard(gen, maxPmax) {
  const relativePmax = Math.round((gen.pmax / maxPmax) * 100);
  const card = document.createElement("div");
  card.className = "generator-card";

  const left = document.createElement("div");
  left.className = "gen-section left";
  left.innerHTML = `
    <div class="gen-name">${gen.station_name}</div>
    <div class="gen-number">Bus ${gen.bus}</div>
    <div class="gen-type">${gen.fuel_type}</div>`;

  const center = document.createElement("div");
  center.className = "gen-section center";
  center.innerHTML = `
    <div class="gen-power">
      <div class="power-label">Power</div>
      <div class="power-bar">
        <div class="power-fill" style="width:${relativePmax}%"></div>
        <div class="power-label-center">${gen.pmax.toFixed(1)} MW</div>
      </div>
    </div>
    <div class="gen-impact-row">
      <div class="gen-cost">${"💲".repeat(Math.round(gen.cost_per_mw))}</div>
      <div class="gen-emissions">${"CO₂ ".repeat(Math.round(gen.emissions_per_mw))}</div>
    </div>`;

  const right = document.createElement("div");
  right.className = "gen-section right";

  if (gen.pg === 0) {
    const plus = document.createElement("div");
    plus.className = "plus-button";
    plus.textContent = "+";
    plus.onclick = () => {
      fetch(`/api/set_generation/${gen.index}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ percent: 50 })
      }).then(res => res.json())
        .then(data => {
          renderGenerators(data.generators);
          renderLines(data.lines);
          renderOverview(data.generators, data.lines, data.total_cost, data.solved);
        });
    };
    right.appendChild(plus);
  } else {
    const minus = document.createElement("div");
minus.className = "minus-button";
minus.textContent = "−";
minus.onclick = () => {
  fetch(`/api/set_generation/${gen.index}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ percent: 0 })
  }).then(res => res.json())
    .then(data => {
      renderGenerators(data.generators);
      renderLines(data.lines);
      renderOverview(data.generators, data.lines, data.total_cost, data.solved);
      bindSortListeners(); // if you're using it
    });
};
right.appendChild(minus);
  }

  card.appendChild(left);
  card.appendChild(center);
  card.appendChild(right);
  return card;
}


function bindSortListeners() {
  document.querySelectorAll('.sort-options span').forEach(el => {
    el.addEventListener('click', () => {
      const list = el.closest('.sort-options').dataset.type;
      const sort = el.dataset.sort;
      activeSort[list] = sort;
      loadData(); // this reloads and re-sorts
    });
  });
}


    loadData();
  </script>
</body>
</html>
