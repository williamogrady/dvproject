<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Case118 Grid Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* Basic Layout & Colors */
    html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: #1e1e1e;
    color: #f0f0f0;
    box-sizing: border-box;
    overflow: hidden;
    }

    #main-layout {
  display: flex;
  height: 100vh;
  width: 100vw;
}

#listView-container {
  width: 65%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 20px;
  box-sizing: border-box;
  gap: 1rem;
}


    #map-panel {
      width: 35%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #888;
    }

    .row {
    display: flex;
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem 0;
    }

    /* Overview */
    #row-1 {
      height: 10%;
    }

    .overview-card {
      width: 100%;
      background: #2f2f2f;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
    }

    .overview-left, .overview-right {
      display: flex;
      flex-direction: column;
    }

    .overview-scenario {
      background: #3a3a3a;
      padding: 0.75rem 1.5rem;
      border-radius: 20px;
      box-shadow: inset 0 0 0 1px #555;
    }

    /* Lines */
    #row-2 {
      height: 10%;
      gap: 1rem;
    }

    .lines-status-card {
      width: 200px;
      background: #2f2f2f;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lines-scroll-card {
      flex: 1;
      background: #1c1c1c;
      border-radius: 10px;
      overflow-x: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
      cursor: grab;
    }

    .line-card {
  min-width: 110px;
  min-height: 50px;
  padding: 0.5rem;
  border-radius: 6px;
  font-size: 0.9rem;
  text-align: center;
  font-weight: bold;
  transition: background 0.3s ease;
}

    /* Generator Lists */
    #row-3 {
      height: 70%;
    }

    #generators-container {
  display: flex;
  width: 100%;
  height: 100%;
  justify-content: space-between;
  gap: 2rem;
  padding: 0 1rem;
  box-sizing: border-box;
}
    .generator-column {
  flex: 1;
  min-width: 0;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px #333;
}

#inactive-container {
  background: #262626;
}

#active-container {
  background: #1f1f1f;
}

    .generator-header {
      padding: 1rem;
      border-bottom: 1px solid #333;
    }

    .generator-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .generator-card {
      display: flex;
      background: #2c2c2c;
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
      height: 90px;
    }

    .gen-section {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .gen-section.left {
      width: 20%;
      background: #444;
    }

    .gen-section.center {
      width: 50%;
    }

    .gen-section.right {
      width: 30%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .power-bar {
      height: 10px;
      background: #555;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .power-fill {
      height: 100%;
      background: #42a5f5;
      text-align: right;
      color: white;
      font-size: 0.7rem;
      padding-right: 5px;
    }

    .faded {
      opacity: 0.3;
    }

    .plus-button {
      font-size: 1.5rem;
      border: 2px dashed #888;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .plus-button:hover {
      background: #42a5f5;
      color: white;
      border-color: #42a5f5;
    }

    /* Row 4: Controls */
    #row-4 { 
        height: 10%; 
        display: flex; 
        gap: 1rem; 
        padding: 0 1rem; 
        box-sizing: border-box; 
        align-items: center; 
    }

    .submit-button {
      background: #42a5f5;
      border: none;
      color: white;
      font-weight: bold;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #2196f3;
    }

.generator-card {
  display: flex;
  width: 100%;
  height: 90px;
  margin-bottom: 1rem;
  border-radius: 10px;
  background: #2c2c2c;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  font-size: 0.85rem;
}

.gen-section.left {
  width: 20%;
  background: #444;
  color: #fff;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.2rem;
}

.gen-name {
  font-weight: bold;
  font-size: 0.95rem;
}
.gen-number {
  font-size: 0.75rem;
  color: #aaa;
}
.gen-type {
  font-size: 0.7rem;
  background: #555;
  border-radius: 4px;
  padding: 2px 6px;
  text-transform: uppercase;
}

.gen-section.center {
  width: 50%;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 0.4rem;
}
.gen-power .power-label {
  font-size: 0.7rem;
  color: #aaa;
  margin-bottom: 0.2rem;
}

.power-bar {
  background: #555;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  position: relative;
}
.power-fill {
  background: #42a5f5;
  height: 100%;
  font-size: 0.7rem;
  color: #fff;
  text-align: right;
  padding-right: 6px;
  white-space: nowrap;
}

.gen-cost, .gen-emissions {
  display: flex;
  gap: 4px;
  font-size: 0.9rem;
}

.gen-section.right {
  width: 30%;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plus-button {
  font-size: 1.5rem;
  border: 2px dashed #666;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #999;
  transition: all 0.2s ease;
}
.plus-button:hover {
  background: #42a5f5;
  border-color: #42a5f5;
  color: #fff;
}

  </style>
</head>
<body>
  <div id="main-layout">
    <div id="listView-container">
      <!-- Row 1: Overview -->
      <div class="row" id="row-1">
        <div class="overview-card">
          <div class="overview-left">
            <div class="power-value" id="overview-power">–</div>
            <div class="label">Total Power</div>
          </div>
          <div class="overview-scenario">Scenario</div>
          <div class="overview-right">
            <div class="cost-value" id="overview-cost">–</div>
            <div class="label">Total Cost</div>
            <div class="emissions-value" id="overview-emissions">–</div>
            <div class="label">Total Emissions</div>
          </div>
        </div>
      </div>

      <!-- Row 2: Transmission Lines -->
      <div class="row" id="row-2">
        <div class="lines-status-card">
          <div class="status-number" id="line-status-count">–</div>
          <div class="status-label">Overloaded Lines</div>
        </div>
        <div class="lines-scroll-card" id="line-scroll"></div>
      </div>

      <!-- Row 3: Generators -->
      <div class="row" id="row-3">
        <div id="generators-container">
          <div class="generator-column" id="inactive-container">
            <div class="generator-header">Inactive Generators</div>
            <div class="generator-body"></div>
          </div>
          <div class="generator-column" id="active-container">
            <div class="generator-header">Active Generators</div>
            <div class="generator-body"></div>
          </div>
        </div>
      </div>

      <!-- Row 4: Submit -->
      <div class="row" id="row-4">
        <div>[Admin Controls]</div>
        <button class="submit-button">Submit</button>
      </div>
    </div>
    <div id="map-panel">Map</div>
  </div>

  <script>
    async function loadData() {
      const res = await fetch('/api/scenario/clean_north_power');
      const data = await res.json();
      renderOverview(data.generators, data.lines);
      renderLines(data.lines);
      renderGenerators(data.generators);
    }

    function renderOverview(gens, lines) {
      const totalPower = gens.reduce((sum, g) => sum + g.pg, 0);
      const totalCost = gens.reduce((sum, g) => sum + g.pg * g.cost_per_mw, 0);
      const totalEmissions = gens.reduce((sum, g) => sum + g.pg * g.emissions_per_mw, 0);
      const overloaded = lines.filter(l => l.overloaded).length;

      document.getElementById("overview-power").textContent = `${totalPower.toFixed(1)} MW`;
      document.getElementById("overview-cost").textContent = `$${totalCost.toFixed(2)}`;
      document.getElementById("overview-emissions").textContent = `${totalEmissions.toFixed(0)} CO₂`;
      document.getElementById("line-status-count").textContent = overloaded;
    }

    function renderLines(lines) {
        const container = document.getElementById("line-scroll");
        container.innerHTML = "";

        lines.forEach(line => {
            const pct = Math.round((line.flow / line.rate_a) * 100);
            const color = d3.interpolateReds(pct / 100);

            const textColor = pct > 60 ? "white" : "#111";

            const card = document.createElement("div");
            card.className = "line-card";
            card.style.background = color;
            card.style.color = textColor;
            card.innerHTML = `Line ${line.from_bus} → ${line.to_bus}<br>${pct}%`;

            container.appendChild(card);
        });
        }


    function renderGenerators(gens) {
      const inactive = document.querySelector("#inactive-container .generator-body");
      const active = document.querySelector("#active-container .generator-body");
      inactive.innerHTML = "";
      active.innerHTML = "";

      gens.forEach(gen => {
        const card = document.createElement("div");
        card.className = "generator-card";

        const left = document.createElement("div");
        left.className = "gen-section left";
        left.innerHTML = `<div class="gen-name">Gen ${gen.bus}</div>
                          <div class="gen-number">#${gen.index}</div>
                          <div class="gen-type">${gen.fuel_type}</div>`;

        const center = document.createElement("div");
        center.className = "gen-section center";
        const percent = Math.round((gen.pg / gen.pmax) * 100);
        center.innerHTML = `
          <div class="gen-power">
            <div class="power-label">Power</div>
            <div class="power-bar">
              <div class="power-fill" style="width:${percent}%">${gen.pg.toFixed(1)} MW</div>
            </div>
          </div>
          <div class="gen-cost">${"💲".repeat(Math.round(gen.cost_per_mw))}</div>
          <div class="gen-emissions">${"CO₂ ".repeat(Math.round(gen.emissions_per_mw))}</div>`;

        const right = document.createElement("div");
        right.className = "gen-section right";
        if (gen.pg === 0) {
          const plus = document.createElement("div");
          plus.className = "plus-button";
          plus.textContent = "+";
          plus.onclick = () => {
            fetch(`/api/set_generation/${gen.index}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ percent: 50 })
            }).then(res => res.json())
              .then(data => {
                renderGenerators(data.generators);
                renderLines(data.lines);
                renderOverview(data.generators, data.lines, data.total_cost, data.solved);
              });
          };
          right.appendChild(plus);
          inactive.appendChild(card);
        } else {
          right.innerHTML = `<div class="slider-placeholder">⏳</div>`;
          active.appendChild(card);
        }

        card.appendChild(left);
        card.appendChild(center);
        card.appendChild(right);
      });
    }

    loadData();
  </script>
</body>
</html>
