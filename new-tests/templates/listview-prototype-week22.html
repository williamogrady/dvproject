<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>listview prototype week22</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="icon" type="image/x-icon" href="/new-tests/circle.ico">
  <link rel="stylesheet" href="/css/listview-core.css">
</head>
<body class="dark-theme">
  <div id="main-layout">
    <div id="listView-container">
      <!-- Row 1: Overview -->
      <div class="row" id="row-1">
        <div class="overview-card">

          <div class="overview-power">
          <div class="label">Power</div>
          <div class="power-blocks-wrapper">
            <div class="power-blocks" id="overview-power-blocks"></div>
            <div class="power-block-label" id="overview-power-label">–</div>
          </div>
        </div>

          <div class="overview-emissions">
            <div class="label">Emissions</div>
            <div class="emissions-value" id="overview-emissions">–</div>
          </div>

          <div class="overview-cost">
            <div class="label">Cost</div>
            <div class="cost-value" id="overview-cost">–</div>
          </div>

          <div class="overview-scenario">
        </div>
        </div>
      </div>
 
      <!-- Row 2: Transmission Lines -->
      <div class="row" id="row-2">
        <div class="lines-status-card">
        <div class="status-label" id="line-status">Loading...</div>
      </div>
        <div class="lines-scroll-card" id="line-scroll"></div>
      </div>

      <!-- Row 3: Generators -->
          
      <div class="row" id="row-3">
      <div id="generators-container">
        <div class="generator-column" id="inactive-container">
          <div class="generator-header">
            <div class="column-label-row">
              <div class="column-label">Inactive Generators</div>
              <div class="sort-buttons" data-type="inactive">
                <button class="sort-btn" data-sort="bus">Bus</button>
                <button class="sort-btn" data-sort="pmax">Power</button>
                <button class="sort-btn" data-sort="cost">Cost</button>
                <button class="sort-btn" data-sort="emissions">Emissions</button>
              </div>
            </div>
          </div>
          <div class="generator-body">
            <!-- generator cards injected here -->
          </div>
        </div>

        <div class="generator-column" id="active-container">
          <div class="generator-header">
            <div class="column-label-row">
              <div class="column-label">Active Generators</div>
              <div class="sort-buttons" data-type="active">
                <button class="sort-btn" data-sort="bus">Bus</button>
                <button class="sort-btn" data-sort="pmax">Power</button>
                <button class="sort-btn" data-sort="cost">Cost</button>
                <button class="sort-btn" data-sort="emissions">Emissions</button>
              </div>
            </div>
          </div>
          <div class="generator-body">
            <!-- generator cards injected here -->
          </div>
        </div>
      </div>
    </div>


      <!-- Row 4: Submit -->
          <div class="row" id="row-4">
  <div class="controls-left">
    <label for="scenario-select">Load Scenario:</label>
    <select id="scenario-select"></select>
    <button id="reset-button">🔁 Reset</button>
    <button id="theme-toggle" class="theme-button">🌞 Light Mode</button>
  </div>
  <div class="controls-right">
    <button class="submit-button">Submit</button>
  </div>
</div>
    </div>
    <div id="map-panel">Map</div>
  </div>

  <script> 
    let activeSort = {
      inactive: { key: 'bus', order: 'asc' },
      active: { key: 'bus', order: 'asc' }
    };

    let currentScenarioId = "";
    let currentScenarioData = null;
    let availableScenarios = [];
    let currentGenerators = [];
    let previousLineFlows = {};  // keyed by `from_bus-to_bus`

    async function fetchAllScenarios() {
      const res = await fetch("/api/scenarios");
      const data = await res.json();

      availableScenarios = data;

      // Find default scenario
      const defaultScenario = data.find(s => s.scenario_id === "mixed_constraints_test");

        if (defaultScenario) {
    currentScenarioId = defaultScenario.scenario_id;
    currentScenarioData = defaultScenario;

        populateScenarioDropdown(data, currentScenarioId);
        loadScenario(currentScenarioId);
      } else {
        console.error("No scenario with ID 'default' found.");
      }
    }

    function populateScenarioDropdown(scenarios, selectedId) {
        const select = document.getElementById("scenario-select");
        select.innerHTML = "";

        scenarios.forEach(s => {
          const option = document.createElement("option");
          option.value = s.scenario_id;
          option.textContent = s.title || s.scenario_id;
          if (s.scenario_id === selectedId) {
            option.selected = true;
          }
          select.appendChild(option);
        });
      }


      async function loadScenario(scenarioId) {
        const res = await fetch(`/api/scenario/${scenarioId}`);
        const data = await res.json();
        currentScenarioId = scenarioId;
        currentScenarioData = data;
        currentGenerators = data.generators;

        renderGenerators(currentGenerators);
        renderLines(data.lines, data.solved !== false);
        renderOverview(currentGenerators, data.lines, data.total_cost, data.solved);
        console.log("🧪 Solved status?", data.solved);
      }

    function populateScenarioDropdown(scenarios, defaultId) {
      const select = document.getElementById("scenario-select");
      select.innerHTML = "";

      scenarios.forEach(s => {
        const option = document.createElement("option");
        option.value = s.scenario_id;
        option.textContent = s.title;
        if (s.scenario_id === defaultId) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    }

        document.getElementById("scenario-select").addEventListener("change", (e) => {
      previousLineFlows = {}; // reset previous flows
      loadScenario(e.target.value);
    });

    document.getElementById("reset-button").addEventListener("click", () => {
      previousLineFlows = {}; // reset previous flows
      loadScenario(currentScenarioId); // reload current scenario
    });


    function renderOverview(gens, lines) {
      const totalPower = gens.reduce((sum, g) => sum + g.pg, 0);
      const totalCost = gens.reduce((sum, g) => sum + g.pg * g.cost_per_mw, 0);
      const totalEmissions = gens.reduce((sum, g) => sum + g.pg * g.emissions_per_mw, 0);
      const overloaded = lines.filter(l => l.overloaded).length;

      const scenarioArea = document.querySelector(".overview-scenario");
      scenarioArea.innerHTML = `
        <div class="label">Scenario</div>
        <div class="scenario-name">${currentScenarioData?.title || currentScenarioId || "No Scenario Loaded"}</div>
      `;

 const BLOCK_SIZE = 100;
const powerGoal = currentScenarioData?.target_mw || 150;
const powerFilled = totalPower;

const container = document.getElementById("overview-power-blocks");
const label = document.getElementById("overview-power-label");
container.innerHTML = "";

const blockGoalCount = Math.ceil(powerGoal / BLOCK_SIZE);
const scaledFilled = powerFilled / BLOCK_SIZE;
const overAmount = scaledFilled - blockGoalCount;
const showOver = overAmount > 0;

for (let i = 0; i < blockGoalCount; i++) {
  const block = document.createElement("div");
  block.className = "power-block goal";

  const fillStart = i;
  const fillEnd = i + 1;

  if (scaledFilled >= fillEnd) {
    block.className = "power-block full";
  } else if (scaledFilled > fillStart) {
    block.className = "power-block partial";
  }

  container.appendChild(block);
}

if (showOver && blockGoalCount > 0) {
  const lastBlock = container.lastElementChild;
  if (lastBlock) {
    lastBlock.className = "power-block over";
    const roundedOver = Math.ceil(overAmount);
    lastBlock.textContent = roundedOver > 20 ? "!!!" : `+${roundedOver}`;
  }
}

label.textContent = `${powerFilled.toFixed(0)} / ${powerGoal} MW`;


      document.getElementById("overview-cost").textContent = `$${totalCost.toFixed(2)}`;
      document.getElementById("overview-emissions").textContent = `${totalEmissions.toFixed(0)} CO₂`;
      //document.getElementById("line-status-count").textContent = overloaded;
    }


function getLineLoadPct(line) {
  return line.rate_a > 0 ? (line.flow / line.rate_a) : 0;
}

function renderLines(lines, solved = true) {
  const container = document.getElementById("line-scroll");
  container.innerHTML = "";

  // ✅ Sort lines by load percentage descending
  const sorted = [...lines].sort((a, b) => {
    const pctA = getLineLoadPct(a);
    const pctB = getLineLoadPct(b);
    return pctB - pctA;
  });

  const statusLabel = document.getElementById("line-status");

  if (!solved) {
    statusLabel.textContent = "⏳ No power flow yet";
    statusLabel.className = "status-label warning";
  } else {
    console.log("🧪 Solved status?", solved);
    const overloadedCount = lines.filter(l => getLineLoadPct(l) > 1).length;

    if (overloadedCount === 0) {
      statusLabel.textContent = "✔ All lines OK";
      statusLabel.className = "status-label";
    } else if (overloadedCount <= 3) {
      statusLabel.textContent = `⚠ ${overloadedCount} line(s) overloaded`;
      statusLabel.className = "status-label warning";
    } else {
      statusLabel.textContent = `🟥 ${overloadedCount} line(s) OVERLOADED`;
      statusLabel.className = "status-label danger";
    }
  }

  sorted.forEach(line => {
    const card = document.createElement("div");
    card.className = "line-card";

    if (!solved) {
      card.innerHTML = `
        Line ${line.from_bus} → ${line.to_bus}<br>
        <span style="font-size: 0.85rem; color: var(--text-faint);">(No power flow)</span>
      `;
    } else {
      const pct = Math.round((line.flow / line.rate_a) * 100);
      const color = d3.interpolateReds(pct / 100);
      const textColor = pct > 60 ? "white" : "#111";
      card.style.background = color;
      card.style.color = textColor;
      card.style.setProperty('--load', pct / 100);

      const key = `${line.from_bus}-${line.to_bus}`;
      const prev = previousLineFlows[key] ?? line.flow;
      const oldPct = (prev / line.rate_a) * 100;
      const newPct = (line.flow / line.rate_a) * 100;
      const delta = Math.round(newPct - oldPct);
      previousLineFlows[key] = line.flow;

      let deltaText = "";
      if (delta > 0) {
        deltaText = `<span style="color: limegreen;">▲ +${delta}%</span>`;
      } else if (delta < 0) {
        deltaText = `<span style="color: crimson;">▼ ${Math.abs(delta)}%</span>`;
      } else {
        deltaText = `<span style="color: gray;">–</span>`;
      }

      card.innerHTML = `
        Line ${line.from_bus} → ${line.to_bus}<br>
        ${pct}%<br>
        ${deltaText}
      `;
    }

    container.appendChild(card);
  });
}



function renderGenerators(gens) {
  currentGenerators = gens;

  // Split gens by status
  const lockedGens = gens.filter(g => g.locked);
  const disabledGens = gens.filter(g => g.disabled);
  const activeGens = gens.filter(g => g.pg > 0 && !g.locked && !g.disabled);
  const inactiveGens = gens.filter(g =>
  (g.pg === 0 && !g.locked) || g.disabled
);

  // Pass specific arrays to renderColumn
  renderColumn("inactive", inactiveGens);
  renderColumn("active", [...lockedGens, ...activeGens]);
}

function renderColumn(type, gens) {
  const container = document.querySelector(`#${type}-container .generator-body`);
  container.innerHTML = "";

  const { key, order } = activeSort[type];
  const maxPmax = Math.max(...currentGenerators.map(g => g.pmax));
  const sorted = gens.slice().sort(getSortFunction(key, order));

  console.log(`📦 Rendering ${type} list sorted by ${key} (${order})`);
  console.log("First 3 names:", sorted.slice(0, 3).map(g => g.station_name || g.name));

  sorted.forEach(gen => {
    container.appendChild(createGeneratorCard(gen, maxPmax));
  });
}



function getSortFunction(key, order) {
  const dir = order === 'asc' ? 1 : -1;
  if (key === 'cost') return (a, b) => dir * (a.cost_per_mw - b.cost_per_mw);
  if (key === 'emissions') return (a, b) => dir * (a.emissions_per_mw - b.emissions_per_mw);
  if (key === 'pmax') return (a, b) => dir * (a.pmax - b.pmax);
  return (a, b) => dir * (a.bus - b.bus);
}


function createGeneratorCard(gen, maxPmax) {
  
  const genId = `Gen${gen.bus}`;
  const locked = currentScenarioData?.locked_generators?.includes(genId);
  const disabled = currentScenarioData?.disabled_generators?.includes(genId);

  // Determine whether it's currently producing power
  const status = gen.pg === 0 ? "inactive" : "active";

  // Create the main generator card container with dynamic classes
  const card = document.createElement("div");
  card.className = `generator-card ${status} ${locked ? "locked" : ""} ${disabled ? "disabled" : ""}`.trim();

  // Debugging output: print generator status info in dev tools
  console.groupCollapsed(`🧪 Generator: ${gen.station_name}`);
  console.log("  → Bus:", gen.bus);
  console.log("  → pg:", gen.pg);
  console.log("  → In scenario disabled list:", currentScenarioData?.disabled_generators?.includes(gen.station_name));
  console.log("  → In scenario locked list:", currentScenarioData?.locked_generators?.includes(gen.station_name));
  console.log("  → Final styling:");
  console.log("     ⮡", disabled ? "DISABLED" : locked ? "LOCKED" : status.toUpperCase());
  console.groupEnd();

  // Color-coded debug log for visual confirmation
  const label = disabled ? "DISABLED" : locked ? "LOCKED" : status.toUpperCase();
  const color = disabled ? "gray" : locked ? "goldenrod" : status === "active" ? "green" : "blue";
  console.log(`%c⮡ Applying: ${label}`, `color: ${color}; font-weight: bold`);

  // Helper functions to color cost/emissions indicators
  function getCostColor(cost) {
    if (cost < 2) return 'green';
    if (cost < 5) return 'yellow';
    if (cost < 7) return 'orange';
    return 'red';
  }
  function getEmissionColor(emissions) {
    if (emissions < 0.5) return 'green';
    if (emissions < 1.0) return '#88cc88';
    if (emissions < 1.5) return '#bbbb88';
    return 'gray';
  }

  // ========== LEFT SECTION ==========
  const left = document.createElement("div");
  const fuelColors = {
    'coal': '#614732',
    'gas': '#4a7838',
    'hydro': '#4faad1',
    'combined': '#ad7a37',
  };
  // Set background color based on fuel type
  left.style.backgroundColor = fuelColors[gen.fuel_type.toLowerCase()] || 'var(--bg-soft)';
  left.className = "gen-section left";
  left.innerHTML = `
    <div class="gen-name">${gen.station_name}</div>
    <div class="gen-number">Bus ${gen.bus}</div>
    <div class="gen-type">${gen.fuel_type}</div>`;

  // ========== CENTER SECTION ==========
  const center = document.createElement("div");
  center.className = "gen-section center";
  center.innerHTML = `
    <div class="gen-power">
      <div class="power-label">Power</div>
    </div>
    <div class="gen-impact-row">
      <div class="gen-cost impact-wrapper">
        <div class="impact-box" style="background:${getCostColor(gen.cost_per_mw)};">💲</div>
        <div class="impact-label">${gen.cost_per_mw.toFixed(1)} / MW</div>
      </div>
      <div class="gen-emissions impact-wrapper">
        <div class="impact-box" style="background:${getEmissionColor(gen.emissions_per_mw)};">☁️</div>
        <div class="impact-label">${gen.emissions_per_mw.toFixed(1)} / MW</div>
      </div>
    </div>
  `;

  // Build dynamic power blocks row
  const powerContainer = center.querySelector(".gen-power");
  const blockRow = document.createElement("div");
  blockRow.className = "power-block-row";

  const fullBlocks = Math.floor(gen.pmax / 100);     // each full block = 100 MW
  const remainder = gen.pmax % 100;                  // final partial block
  let accumulated = 0;

  function createBlock(width, level) {
    const block = document.createElement("div");
    block.className = "power-block";
    block.style.width = `${width}px`;
    block.style.height = "20px";
    block.style.borderRadius = "4px";
    block.style.background = level <= gen.pg ? "var(--gen-on)" : "var(--gen-off)";
    block.style.border = "1px solid rgba(0, 0, 0, 0.2)";
    block.title = `${level} MW`;

    // If not locked or disabled, allow interactive click to set output
    if (!disabled && !locked && gen.pg > 0) {
      block.style.cursor = "pointer";
      block.addEventListener("mousedown", () => {
        const percent = Math.round((level / gen.pmax) * 100);
        fetch(`/api/set_generation/${gen.index}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ percent })
        })
          .then(res => res.json())
          .then(data => {
            currentGenerators = data.generators;
            renderGenerators(currentGenerators);
            renderLines(data.lines, data.solved !== false);
            renderOverview(data.generators, data.lines, data.total_cost, data.solved);
          });
      });
    }

    return block;
  }

  // Create all blocks
  for (let i = 0; i < fullBlocks; i++) {
    accumulated += 100;
    blockRow.appendChild(createBlock(20, accumulated));
  }
  if (remainder > 0) {
    accumulated += remainder;
    blockRow.appendChild(createBlock(20 * (remainder / 100), accumulated));
  }

  // Label showing max capacity
  const maxLabel = document.createElement("span");
  maxLabel.style.marginLeft = "8px";
  maxLabel.style.fontSize = "0.75rem";
  maxLabel.style.color = "var(--text-light)";
  maxLabel.textContent = `${gen.pmax.toFixed(0)} MW max`;
  blockRow.appendChild(maxLabel);

  powerContainer.appendChild(blockRow);

  // ========== RIGHT SECTION ==========
  const right = document.createElement("div");
  right.className = "gen-section right";
  const toggle = document.createElement("div");

  // Determine what the right-hand button should do and look like
  if (locked) {
    toggle.className = "minus-button";
    toggle.textContent = "🔒";
    toggle.title = "Locked by scenario";
    toggle.style.cursor = "default";
  } else if (disabled) {
    toggle.className = "minus-button";
    toggle.textContent = "−";
    toggle.title = "Disabled in this scenario";
    toggle.style.cursor = "not-allowed";
  } else {
    toggle.className = gen.pg === 0 ? "plus-button" : "minus-button";
    toggle.textContent = gen.pg === 0 ? "+" : "−";
    toggle.onclick = async () => {
      const percent = gen.pg === 0 ? 100 : 0;
      const res = await fetch(`/api/set_generation/${gen.index}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ percent })
      });

      const data = await res.json();
      currentGenerators = data.generators;
      renderGenerators(currentGenerators);
      renderLines(data.lines, data.solved !== false);
      renderOverview(data.generators, data.lines, data.total_cost, data.solved);
    };
  }

  // Assemble the full card
  right.appendChild(toggle);
  card.appendChild(left);
  card.appendChild(center);
  card.appendChild(right);

  return card;
}




function bindSortListeners() {
  console.log("Binding sort listeners...");
  document.querySelectorAll('.sort-buttons .sort-btn').forEach(button => {
    button.addEventListener('click', () => {
      const type = button.closest('.sort-buttons').dataset.type;
      const clickedKey = button.dataset.sort;
      const current = activeSort[type];

      if (current.key === clickedKey) {
        current.order = current.order === 'asc' ? 'desc' : 'asc';
      } else {
        current.key = clickedKey;
        current.order = 'asc';
      }

      document.querySelectorAll(`.sort-buttons[data-type="${type}"] .sort-btn`).forEach(btn => {
        btn.classList.remove('active', 'asc', 'desc');
      });
      button.classList.add('active', current.order);

      renderColumn(type); // ✅ only once
    });
  });
}


function updateSortButtonStyles() {
  ['active', 'inactive'].forEach(type => {
    const { key, order } = activeSort[type];
    document.querySelectorAll(`.sort-buttons[data-type="${type}"] .sort-btn`).forEach(btn => {
      btn.classList.remove('active', 'asc', 'desc');
      if (btn.dataset.sort === key) {
        btn.classList.add('active', order);
      }
    });
  });
}


document.getElementById("theme-toggle").addEventListener("click", () => {
  const body = document.body;
  const isDark = body.classList.contains("dark-theme");

  body.classList.toggle("dark-theme", !isDark);
  body.classList.toggle("light-theme", isDark);

  const btn = document.getElementById("theme-toggle");
  btn.textContent = isDark ? "🌙 Dark Mode" : "🌞 Light Mode";
});

    window.addEventListener("DOMContentLoaded", () => {
    const theme = document.body.classList.contains("dark-theme") ? "dark-theme"
                : document.body.classList.contains("light-theme") ? "light-theme"
                : "no theme applied";
    console.log("🌗 Current theme on startup:", theme);
    bindSortListeners();     // ✅ Only here
    updateSortButtonStyles();   // ✅ This applies the correct style immediately
    fetchAllScenarios();     // ✅ Normal startup logic
  });

  </script>
</body>
