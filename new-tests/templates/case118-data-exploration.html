<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grid Simulator</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: sans-serif;
      padding: 2em;
      background-color: #f8f9fa;
    }
    #dashboard {
      display: flex;
      gap: 2em;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-family: monospace;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.4em;
      text-align: center;
    }
    th {
      background-color: #333;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .status-cell {
      font-weight: bold;
      cursor: pointer;
    }
    .on {
      background-color: green;
      color: white;
    }
    .off {
      background-color: red;
      color: white;
    }
    .overloaded {
      background-color: red;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Virtual Power Grid Simulator</h1>
  <div id="overview" style="margin-bottom: 1em; font-size: 1.2em; font-weight: bold;"></div>
  <div id="dashboard">
    <div>
      <h2>Generators</h2>
      <div id="genTable">Loading...</div>
    </div>
    <div>
      <h2>Transmission Lines</h2>
      <div id="lineTable">Loading...</div>
    </div>
  </div>

<script>
  let genSortCol = null;
  let genSortDir = 'desc';
  let lineSortCol = null;
  let lineSortDir = 'desc';
  
  
function renderOverview(generators, lines, totalCost = null, solved = true) {
  const overviewDiv = document.getElementById('overview');

  const totalOnline = generators
  .filter(g => g.pg > 0)
  .reduce((sum, g) => sum + g.pg, 0);

  const overloadedCount = lines.filter(l => l.overloaded).length;

  let statusMsg = solved
    ? ''
    : `<div style="color:red; font-weight:bold;">⚠️ Power flow could not be solved</div>`;

  const costDisplay = solved && totalCost !== null
    ? `$${totalCost.toFixed(2)}`
    : `–`;

  overviewDiv.innerHTML = `
    ${statusMsg}
    🟩 Total Generation Online: <span style="color:green">${totalOnline.toFixed(1)} MW</span><br>
    🟥 Overloaded Lines: <span style="color:${overloadedCount > 0 ? 'red' : 'green'}">${overloadedCount}</span><br>
    💸 Total Cost: <span style="color:blue">${costDisplay}</span>
  `;
}


  async function loadDashboard() {
    const [genRes, lineRes] = await Promise.all([
      fetch('/api/generators'),
      fetch('/api/lines')
    ]);
    const gens = await genRes.json();
    const lines = await lineRes.json();
    renderGenerators(gens);
    renderLines(lines);
    renderOverview(gens, lines); // keep this for now — no cost available at init
  }

  function renderGenerators(gens) {
  // Reapply sorting if it’s defined
  if (genSortCol !== null) {
    gens.sort((a, b) => {
      const values = [a.bus, a.pmax, a.pg ?? 0];
      const va = values[genSortCol];
      const vb = [b.bus, b.pmax, b.pg ?? 0][genSortCol];
      return genSortDir === 'asc' ? va - vb : vb - va;
    });
  }

  const container = document.getElementById('genTable');
  container.innerHTML = '';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');

  const headers = ['Bus', 'Pmax', 'Output'];
  headers.forEach((label, i) => {
    const th = document.createElement('th');
    th.textContent = label;
    th.style.cursor = 'pointer';
    th.onclick = () => {
      if (genSortCol === i) {
        genSortDir = genSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        genSortCol = i;
        genSortDir = 'desc';
      }
      renderGenerators(gens); // apply new sort
    };
    headRow.appendChild(th);
  });

  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  gens.forEach(gen => {
    const row = document.createElement('tr');

    const busCell = document.createElement('td');
    busCell.textContent = gen.bus;
    row.appendChild(busCell);

    const pmaxCell = document.createElement('td');
    pmaxCell.textContent = gen.pmax;
    row.appendChild(pmaxCell);

    const outputCell = document.createElement('td');

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = 0;
    slider.max = 100;
    slider.step = 25;
    slider.value = Math.round((gen.pg / gen.pmax) * 100);

    const label = document.createElement('span');
    label.textContent = ` ${slider.value}%`;

    slider.oninput = () => {
      label.textContent = ` ${slider.value}%`;
    };

    slider.onchange = async () => {
      const percent = parseInt(slider.value);
      const res = await fetch(`/api/set_generation/${gen.index}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ percent })
      });

      const data = await res.json();
      renderGenerators(data.generators);
      renderLines(data.lines);
      renderOverview(data.generators, data.lines, data.total_cost, data.solved);
    };

    outputCell.appendChild(slider);
    outputCell.appendChild(label);
    row.appendChild(outputCell);
    tbody.appendChild(row);
  });

  table.appendChild(tbody);
  container.appendChild(table);
}

function renderLines(lines) {
  if (lineSortCol !== null) {
    lines.sort((a, b) => {
      const values = [a.from_bus, a.to_bus, a.flow, a.rate_a, (a.flow / a.rate_a)];
      const va = values[lineSortCol];
      const vb = [b.from_bus, b.to_bus, b.flow, b.rate_a, (b.flow / b.rate_a)][lineSortCol];
      return lineSortDir === 'asc' ? va - vb : vb - va;
    });
  }

  const container = document.getElementById('lineTable');
  container.innerHTML = '';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');

  const headers = ['From', 'To', 'Flow', 'Limit', 'Status'];
  headers.forEach((label, i) => {
    const th = document.createElement('th');
    th.textContent = label;
    th.style.cursor = 'pointer';
    th.onclick = () => {
      if (lineSortCol === i) {
        lineSortDir = lineSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        lineSortCol = i;
        lineSortDir = 'desc';
      }
      renderLines(lines); // reapply sort
    };
    headRow.appendChild(th);
  });

  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  lines.forEach(line => {
    const row = document.createElement('tr');
    const percent = (line.flow / line.rate_a) * 100;

    row.innerHTML = `
      <td>${line.from_bus}</td>
      <td>${line.to_bus}</td>
      <td>${line.flow.toFixed(2)}</td>
      <td>${line.rate_a}</td>
    `;

    const statusCell = document.createElement('td');
    statusCell.textContent = line.overloaded
      ? `OVERLOADED (${percent.toFixed(0)}%)`
      : `OK (${percent.toFixed(0)}%)`;

    if (percent < 50) {
      statusCell.className = 'load-low';
    } else if (percent < 90) {
      statusCell.className = 'load-med';
    } else {
      statusCell.className = 'load-high';
    }

    row.appendChild(statusCell);
    tbody.appendChild(row);
  });

  table.appendChild(tbody);
  container.appendChild(table);
}


  loadDashboard();
</script>

</body>
</html>
