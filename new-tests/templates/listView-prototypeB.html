<style id="dv-slim-layout-and-cards">

  :root{
    --gutter: 16px;
    --gap: 12px;
    --text-faint:#677089;
    --border:#d9dee8;
    --card:#fff;
    --card-muted:#eef1f5;
    --gen-on:#3bb273;
    --gen-off:#e8eaee;
    --fs-base:14px;
  }

  /* ===== Layout (simple, no overlap) ===== */
  html, body { height:100%; overflow:hidden; }
  #main-layout, #listView-container { height:100vh; display:flex; flex-direction:column; }


  .map-load { fill: #5878cf; stroke: #111; stroke-width: .8; } /* from MapView B */ 

  /* Row 2: lists | map */
  #row-2-work{
    width:100vw; margin-left:calc(50% - 50vw);
    padding:0 var(--gutter) var(--gutter);
    display:flex; gap:var(--gap); min-height:0; box-sizing:border-box;
  }
  #left-lists, #right-map{
    flex:1 1 0; min-width:0; display:flex; flex-direction:column; min-height:0;
  }
  #map-panel{ position:relative; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  #map-wrapper{ flex:1 1 auto; min-height:0; }

  /* Two lists side by side inside the left column */
  #generators-container{
    display:flex; gap:var(--gap); align-items:stretch;
    flex:1 1 auto; min-height:0;
  }
  #inactive-container, #active-container{
    flex:1 1 0; min-width:0; display:flex; flex-direction:column; min-height:0;
  }
  /* LISTS = flex columns so items use natural height (no grid row math → no overlap) */
  #inactive-container .generator-body,
  #active-container   .generator-body{
    flex:1 1 auto; min-height:0; overflow:auto;
    display:flex; flex-direction:column; gap:12px; align-items:stretch;
  }

  #inactive-container .sort-buttons,
#active-container   .sort-buttons{
  margin-bottom: 14px;
}

 .sort-buttons .sort-btn{
    position: relative;
    padding-right: 18px;      /* space for arrow */
  }
  .sort-buttons .sort-btn.active {
    font-weight: 700;
  }
  .sort-buttons .sort-btn.active.asc::after,
  .sort-buttons .sort-btn.active.desc::after{
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: .85;
  }
  .sort-buttons .sort-btn.active.asc::after  { content: "▲"; }
  .sort-buttons .sort-btn.active.desc::after { content: "▼"; }

  /* ===== Cards: 30% | 55% | 15% ===== */
  .generator-card{
    display:grid;
    grid-template-columns: 30% 55% 15%;
    gap:12px;
    width:100%; max-width:100%;
    min-height:180px;              /* higher floor so all info shows; grows as needed */
    height:auto; box-sizing:border-box;
    border:1px solid var(--border); border-radius:12px; background:var(--card);
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    font-size:var(--fs-base); overflow:hidden;
    align-items:stretch;
  }
  .generator-card.locked   { opacity:.95; filter:saturate(.9); }
  .generator-card.disabled { opacity:.65; filter:grayscale(.5); }

  /* Left rail — ZERO padding/margins, full height, clamp text */
  .gen-section.left{
    padding:0; margin:0; height:100%; align-self:stretch; box-sizing:border-box;
    display:flex; flex-direction:column; justify-content:center;
    min-width:0; overflow:hidden; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.18);
    border-radius:12px 0 0 12px;
  }
  .gen-section.left .gen-name{
    font-weight:700; font-size:14px; line-height:1.1;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2;
    overflow:hidden; text-overflow:ellipsis; word-break:break-word; hyphens:auto;
  }
  .gen-section.left .gen-number,
  .gen-section.left .gen-type{
    font-size:12px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* Center — two tight rows; blocks wrap and drive height */
.gen-section.center{
  min-width:0; display:grid; grid-template-rows:auto auto;
  gap:4px;               /* was 6px */
  padding:6px 0;         /* was 8px 0 */
}
  .gen-power{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; }
  .power-label{ font-size:calc(var(--fs-base)*0.8); color:var(--text-faint); }
  .power-block-row{ 
  display:flex; flex-wrap:wrap; 
  gap:3px;               /* was 4px */
  row-gap:3px;           /* was 4px */
  max-width:100%; 
}
  .power-block{ width:var(--pb,20px); height:var(--pb,20px); border-radius:3px; background:var(--gen-off); border:1px solid rgba(0,0,0,.15); }
  .power-block.on{ background:var(--gen-on); }
  .power-block.half{ width:calc(var(--pb,14px)/2); }
  .off-pill{ height:18px; line-height:16px; padding:0 8px; font-size:12px; border-radius:999px; border:1px solid rgba(0,0,0,.2); background:#444; color:#fff; cursor:pointer; }
  .mw-label{ 
  margin-left:6px;       /* was 8px */
  font-size:12px; 
  color:var(--text-faint); 
}

  /* Metrics chips */
  .gen-metrics{ 
  display:flex; flex-wrap:wrap; 
  gap:6px 8px;           /* was 8px 12px */
  min-width:0; 
}
  .metric{ display:flex; align-items:center; gap:8px; min-width:0; }
  .metric-label{ font-size:calc(var(--fs-base)*0.8); color:var(--text-faint); }
  .metric-chip{
    background:var(--chip-bg,#888); color:#fff; font-weight:800;
    font-size:calc(var(--fs-base)*0.86); line-height:1;
    padding:2px 10px; border-radius:999px; white-space:nowrap;
  }
  .metric-unit{ font-size:calc(var(--fs-base)*0.8); color:var(--text-faint); }

  /* Right rail — ZERO padding, full height, centered icon, dark states */
  .gen-section.right{
    padding:0; margin:0; height:100%; align-self:stretch; box-sizing:border-box;
    display:grid; place-items:center;
    border-left:1px solid var(--border); border-radius:0 12px 12px 0;
    cursor:pointer; user-select:none;
  }
  .gen-action-icon{ color:#fff; font-size:22px; line-height:1; }
  .gen-section.right[data-state="minus"],
  .gen-section.right[data-state="locked"]{ background:#188848; }
  .gen-section.right[data-state="plus"]{ background:#949494; }
  .gen-section.right[data-state="disabled"]{ background:#e0e4ea; cursor:not-allowed; }

  /* Fuel gradients (by class) */
  .fuel-Gas      { background:linear-gradient(135deg,#924858,#5e283a); }
  .fuel-Combined { background:linear-gradient(135deg,#0EA5A5,#0B8C8C); color:#0b1b1f; text-shadow:none; }
  .fuel-Coal     { background:linear-gradient(135deg,#444,#222); }
  .fuel-Hydro    { background:linear-gradient(135deg,#1e88e5,#1565c0); }
  .fuel-Wind     { background:linear-gradient(135deg,#6a1b9a,#4527a0); }
  .fuel-Solar    { background:linear-gradient(135deg,#f6c343,#f4a261); color:#202020; text-shadow:none; }
  .fuel-Unknown  { background:linear-gradient(135deg,#8e9eab,#eef2f3); color:#111; text-shadow:none; }

function showTooltip(text, x, y) {
  const tooltip = document.getElementById("map-tooltip");
  tooltip.textContent = text;
  tooltip.style.left = (x + 12) + "px";
  tooltip.style.top = (y - 20) + "px";

function hideTooltip() {

 async function fetchAllScenarios() {
  console.log("fetchAllScenarios");
  const res = await fetch("/api/scenarios");
  const data = await res.json();
  availableScenarios = data || [];

  // 1) URL override: ?scenario=<id>
  const urlId = new URLSearchParams(location.search).get("scenario");

  // 2) Next best: first pilot_* in list
  const pilot = availableScenarios.find(s => /^pilot_/i.test(s.scenario_id));

  // 3) Fallback: the first item in the list
  const first = availableScenarios[0];

  const chosen =
    (urlId && availableScenarios.find(s => s.scenario_id === urlId)) ||
    pilot || first;

  if (!chosen) {
    console.error("No scenarios returned from /api/scenarios");

// === Generator layout constants (global) ===
const BLOCK_UNIT = 100, HALF_STEP = BLOCK_UNIT/2, PAD_INNER = 10, BLOCK_GAP = 4;
const MIN_GEN_W = 50, WIDTH_VARIATION = 80, MAX_GEN_W = MIN_GEN_W + WIDTH_VARIATION;
const MAX_GEN_H = 220, HALO_PAD = 8;

const roundCapToHalf = pmax => Math.ceil((pmax||0)/HALF_STEP)*HALF_STEP;
const capBlocks = p => {
  const cap = roundCapToHalf(p);
  const full = Math.floor(cap/BLOCK_UNIT);
  const half = (cap % BLOCK_UNIT) === HALF_STEP;
  return full + (half ? 1 : 0);
};
function computeBlockH(gens){
  const ext = d3.extent(gens || [], g => g.pmax || 0);
  const maxB = capBlocks(ext[1] || 0);
  const avail = MAX_GEN_H - PAD_INNER*2 - (maxB-1)*BLOCK_GAP;
  return Math.min(28, avail/Math.max(1, maxB));
}
function getWidthScale(){
  const ext = d3.extent((window.currentGenerators || []), g => g.cost_per_mw || 0);
  return d3.scaleLinear().domain([Math.max(1, ext[0]||1), ext[1]||1]).range([MIN_GEN_W, MAX_GEN_W]);
}
function emissionsColor(gen){
  const e = gen.emissions_per_mw||0;
  const ext = d3.extent((window.currentGenerators || []), g => g.emissions_per_mw||0);
  const sat = d3.scaleLinear().domain([ext[1]||1, ext[0]||0]).range([20,85]).clamp(true);
  return `hsl(140, ${sat(e)}%, 45%)`;
}

function buildDisabledLineSetFromScenario(scen = {}) {

  list.forEach(raw => {

    // Accept "Line-13-14", "13-14", "Line_Bus13_Bus14", etc.
    const m = s.match(/(\d+)[^\d]+(\d+)/);
    if (m) {
      const a = Number(m[1]), b = Number(m[2]);
      const lo = Math.min(a, b), hi = Math.max(a, b);
      out.add(`Line_Bus${lo}_Bus${hi}`);

// --- Always exclude these
const EXCLUDE_BUSES = new Set([1]);          // bus numbers to drop
const EXCLUDE_IDS   = new Set(["Gen1"]);     // normalized ids to drop

function normalizeGenId(gen){
  // Prefer bus → consistent with map & API (e.g., "Gen23")
  if (gen && gen.bus != null) return `Gen${Number(gen.bus)}`;
  // Fallbacks (rarely used)
  if (gen?.id)   return String(gen.id);
  if (gen?.name){
    const m = String(gen.name).match(/\d+/);
    if (m) return `Gen${m[0]}`;
  }
  if (gen?.index != null) return `Gen${Number(gen.index)}`;
  // Last resort: try to extract any digits
  const s = String(gen?.id || gen?.name || "");
  const m = s.match(/\d+/);
  return m ? `Gen${m[0]}` : s;
}

function sanitizeGenerators(arr){
  return (arr || []).filter(g => {
    const bus = Number(g?.bus);
    const id  = normalizeGenId(g);
    return !EXCLUDE_BUSES.has(bus) && !EXCLUDE_IDS.has(id);
  });
}


/** Compute universe + overlap/mismatches between API and Map */
function computeGenUniverse(){
  const mapIds = getMapGenIds();
  const apiIds = getApiGenIds(window.currentGenerators || []);
  const intersection = [...mapIds].filter(id => apiIds.has(id));
  const onlyMap =    [...mapIds].filter(id => !apiIds.has(id));
  const onlyApi =    [...apiIds].filter(id => !mapIds.has(id));
  return { mapIds, apiIds, intersection, onlyMap, onlyApi };
}

/** Make scenario sets safe: drop any ids that aren't usable */
function sanitizeScenarioSets(scen){
  const s = scen || {};
  const norm = (arr) => (arr || []).map(normalizeGenId);

  // Normalize first (works on first paint)
  let locked   = norm(s.locked_generators   || s.locked   || []);
  let disabled = norm(s.disabled_generators || s.disabled || []);

  // If map IDs exist, prune to intersection; else keep all
  const mapIds = getMapGenIds();
  if (mapIds && mapIds.size > 0) {
    locked   = locked.filter(id => mapIds.has(id));
    disabled = disabled.filter(id => mapIds.has(id));
  }

  return { ...s, locked_generators: locked, disabled_generators: disabled };
}

function shouldInvertChevronPair(a, b){

  // Exempt these pairs from inversion (normal direction)
  const exceptions = [

  ];

// Mini chevron that matches MapView's shape, is perfectly centered, and supports zero-flow
function _buildChevron(accent, dir, sizePx = 22, flowAbs = 1, zeroThreshMW = 0.1){
  const ns  = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'chev');
  svg.setAttribute('width', sizePx);
  svg.setAttribute('height', sizePx);
  // Wider viewBox so the arrow can be made visibly broader
  svg.setAttribute('viewBox', '-12 -12 24 24');
  svg.style.display = 'block';

  // Outer group: rotate to vertical. +flow = up (90°) / –flow = down (270°)
  const gRot = document.createElementNS(ns, 'g');
  const baseAngle = (dir < 0) ? 270 : 90;
  gRot.setAttribute('transform', `rotate(${baseAngle})`);

  // Inner group: center and widen the glyph
  const gCtr = document.createElementNS(ns, 'g');

  // Size for the glyph generator (matches MapView mini scale nicely)
  const s = 6;

  // EXACT same geometry as Map chevrons if available; fallback otherwise
  const d = (typeof chevronPath === 'function')
    ? chevronPath(s)
    : `M 0 0 L ${s*2} ${-s} L ${s*1.6} 0 L ${s*2} ${s} Z`;

  const path = document.createElementNS(ns, 'path');

  if (Math.abs(flowAbs) < (zeroThreshMW || 0.1)) {
    // Zero-flow: centered circle (same box)
    path.setAttribute('d', 'M -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0 Z');
  } else {
    path.setAttribute('d', d);
  }

  path.setAttribute('fill', accent);
  path.setAttribute('stroke', '#111');
  path.setAttribute('stroke-width', '0.6'); // slightly bolder in small size

  // Center the glyph horizontally and make it 1.5× wider (no drift when rotated)
  const WIDEN = 1.5;
  gCtr.setAttribute('transform', `translate(${-s}, 0) scale(${WIDEN}, 1)`);

  gCtr.appendChild(path);
  gRot.appendChild(gCtr);
  svg.appendChild(gRot);
  return svg;
}

// --- NEW: pure state computation (no DOM here) ---
function evaluateScenarioState(gens = [], linesIn = [], scenario = {}){
  const lines = normalizeLines(linesIn);

  const totals = {
    power:     gens.reduce((s,g) => s + nz(g.pg), 0),
    cost:      gens.reduce((s,g) => s + nz(g.pg) * nz(g.cost_per_mw), 0),
    emissions: gens.reduce((s,g) => s + nz(g.pg) * nz(g.emissions_per_mw), 0),
  };

  const targetMW = nz(scenario.target_mw);
  const targetCost  = (scenario.cost_limit != null) ? nz(scenario.cost_limit) : null;
  const targetEmissions   = (scenario.emissions_limit != null) ? nz(scenario.emissions_limit) : null;

  const overloadedCount = lines.filter(l => {
    const rate = nz(l.rate_a ?? l.rateA);
    const flow = Math.abs(nz(l.flow));
    return rate > 0 && flow > rate;
  }).length;

  const meetsPower = (targetMW > 0) ? (totals.power >= targetMW * 0.95 && totals.power <= targetMW * 1.05) : true;
  const withinCost      = (targetCost == null) ? true : totals.cost      <= targetCost;
  const withinEmissions = (targetEmissions  == null) ? true : totals.emissions <= targetEmissions;
  const noOverloads     = overloadedCount === 0;

  return {
    totals, targetMW, targetCost, targetEmissions, overloadedCount,
    meetsPower, withinCost, withinEmissions, noOverloads,
    allMet: meetsPower && withinCost && withinEmissions && noOverloads
  };
}

function updatePowerBlocks(totalPower, targetPower) {

  const valueWrap = document.getElementById("overview-power");
  const label =
    document.querySelector("#overview-power .fraction") ||

  targetPower = +targetPower || 0;

  let row = valueWrap.querySelector(".fraction-row");
  if (!row) {
    row = document.createElement("div");
    row.className = "fraction-row";

    // Insert right after the blocks container (your markup has .blocks then .fraction)
    // <div id="overview-power"><div class="blocks"></div><div class="fraction">–</div></div>
    const blocksEl = valueWrap.querySelector(".blocks");
    if (blocksEl && blocksEl.nextSibling) valueWrap.insertBefore(row, blocksEl.nextSibling);
    else valueWrap.appendChild(row);

    if (label) row.appendChild(label);
  } else {
    if (label && label.parentElement !== row) row.appendChild(label);
  }

  let pill = document.getElementById("power-ok-pill");
  if (!pill) {
    pill = document.createElement("div");
    pill.id = "power-ok-pill";
    pill.className = "pill-ok";
    pill.textContent = "All good!";
    pill.style.display = "none";
    row.appendChild(pill);
  }

  // --- Update fraction text ---
  if (label && targetPower > 0) {
    label.textContent = `${Math.round(totalPower)} / ${Math.round(targetPower)} MW`;
  } else if (label) {
    label.textContent = `${Math.round(totalPower)} MW`;
  }

  // --- Toggle pill when within ±5% of target ---
  const meets = targetPower > 0 &&
                totalPower >= targetPower * 0.95 &&
                totalPower <= targetPower * 1.05;
  pill.style.display = meets ? "inline-block" : "none";
 

  // --- Rebuild blocks (unchanged from your version) ---
  container.innerHTML = "";
  if (!(targetPower > 0)) return;

  const MW_PER_BLOCK = 100;
  const count   = Math.ceil(targetPower / MW_PER_BLOCK);
  const overAmt = totalPower - targetPower;

  // Density thresholds
  let cellMin = 22, blockH = 26, gap = 6;
  if (count > 120)      { cellMin = 12; blockH = 14; gap = 4; }
  else if (count > 80)  { cellMin = 14; blockH = 16; gap = 5; }
  else if (count > 40)  { cellMin = 18; blockH = 20; gap = 6; }

  container.style.setProperty("--cell-min", `${cellMin}px`);
  container.style.setProperty("--block-h",  `${blockH}px`);
  container.style.setProperty("--gap",      `${gap}px`);

  for (let i = 0; i < count; i++) {
    const startMW = i * MW_PER_BLOCK;
    const endMW   = (i + 1) * MW_PER_BLOCK;
    const el = document.createElement("div");
    el.className = "block";

    if (totalPower >= endMW) {
      el.classList.add("full");
      el.style.background = "#4caf50";
    } else if (totalPower <= startMW) {
      el.classList.add("goal");
      el.style.background = "#e0e0e0";
    } else {
      el.classList.add("partial");
      const pct = Math.max(1, Math.min(99, Math.round(((totalPower - startMW) / MW_PER_BLOCK) * 100)));
      el.style.background = `linear-gradient(90deg, #4caf50 ${pct}%, #e0e0e0 ${pct}%)`;
    }
    container.appendChild(el);
  }

  // Overshoot badge
  if (overAmt > 0 && count > 0) {
    const last = container.lastElementChild;
    if (last) {
      last.className = "block over";
      last.style.background = "#ef5350";
      last.style.color = "#fff";

    const pct01 = rate > 0 ? Math.abs(flow) / rate : 0; // 0..1
    const id    = _lineId(L);
    const prev  = previousLineLoads[id] ?? pct01;
    const deltaPts = (pct01 - prev) * 100;
    const dir   = Math.abs(deltaPts) < 0.5 ? 'neutral' : (deltaPts > 0 ? 'up' : 'down');

    return {

      dirArrow: (shouldInvertChevronPair(L.from_bus ?? L.from ?? L.i ?? L.bus1,
                                        L.to_bus   ?? L.to   ?? L.j ?? L.bus2)
                ? -1 : 1) * (flow >= 0 ? 1 : -1),
      flowAbs: Math.abs(flow),              // <-- add this
      _prev01: prev,
      _deltaPts: deltaPts,
      _deltaDir: dir
    };
  })
  .sort((a,b) => b.pct - a.pct);


  // Row 3: top-3 overloaded (>100%)
  const row3 = norm.filter(d => d.pct > 100).slice(0,3);

  // append real items + pad to exactly 3 with placeholders (no recursion!)

function getLineLoadPct(line) {

function renderLines(lines, solved = true) {

      card.style.background = color;
      card.style.color = textColor;
      card.style.setProperty('--load', pct / 100);

      const key = `${line.from_bus}-${line.to_bus}`;
      const prev = previousLineFlows[key] ?? line.flow;
      const oldPct = (prev / line.rate_a) * 100;
      const newPct = (line.flow / line.rate_a) * 100;
      const delta = Math.round(newPct - oldPct);
      previousLineFlows[key] = line.flow;

      let deltaText = "";
      if (delta > 0) deltaText = `<span style="color: limegreen;">▲ +${delta}%</span>`;
      else if (delta < 0) deltaText = `<span style="color: crimson;">▼ ${Math.abs(delta)}%</span>`;
      else deltaText = `<span style="color: gray;">–</span>`;

      card.innerHTML = `
        Line ${line.from_bus} → ${line.to_bus}<br>
        ${pct}%<br>
        ${deltaText}
      `;
    }

    container.appendChild(card);
  });

  if (solved) renderMapLineLoads(lines);
}

// Ping the generator on the map: quick grow + shrink, with anti-spam
function pingGenerator(genId){
  if (!genId) return;

  // Try the rect first; if the transform lives on the parent <g>, use that.
  let target = d3.select(`#${CSS.escape(genId)}`);
  if (target.empty()) target = d3.select(`rect.map-gen.gen-card#${CSS.escape(genId)}`);
  if (target.empty()) return;
  const parent = target.node().parentNode;
  const elem   = parent && parent.tagName.toLowerCase() === 'g'
    ? d3.select(parent) : target;

  // Don’t allow spam while animating
  if (elem.attr('data-animating') === '1') return;
  elem.attr('data-animating','1');

  // Always return to the base transform (strip any previous scale)
  const baseT = elem.attr('data-base-transform')
           || (elem.attr('transform') || '').replace(/\s*scale\([^)]+\)/g, '');
  elem.attr('data-base-transform', baseT);

  // Get zoom k for ring sizing
  const svg = d3.select('svg');                   // your main SVG
  const k   = (d3.zoomTransform(svg.node()).k || 1);

  // Center of the generator (BBox in local coords is fine)
  const bb  = elem.node().getBBox();
  const cx  = bb.x + bb.width  / 2;
  const cy  = bb.y + bb.height / 2;

  // Emit two subtle rings (in their own layer under zoom-group)

  // Quick grow → shrink back, then clear anim flag
  const MAX_SCALE = 1.8;
  elem.interrupt()
      .attr('transform', `${baseT} scale(1)`)
      .transition().duration(140).ease(d3.easeCubicOut)
        .attr('transform', `${baseT} scale(${MAX_SCALE})`)
      .transition().duration(200).ease(d3.easeCubicIn)
        .attr('transform', `${baseT} scale(1)`)
        .on('end', () => elem.attr('data-animating', null));
}

function pingChevron(lineId){
  const sel = `#chev-${CSS.escape(lineId)}`;
  const chev = d3.select(sel);
  if (chev.empty()) return;

  // Base transform (translate+rotate only) so scales don’t compound
  const baseT = chev.attr("data-base-transform")
             || (chev.attr("transform") || "").replace(/\s*scale\([^)]+\)/g, "");
  chev.attr("data-base-transform", baseT);

  // Anti-spam
  if (chev.attr("data-animating") === "1") return;
  chev.attr("data-animating", "1");

  // Scale pop: ~300% (3x original size)
  const MAX_SCALE = 3.0;

  chev.interrupt()
      .attr("transform", `${baseT} scale(1)`)
      .transition().duration(250).ease(d3.easeCubicOut)   // slower up
        .attr("transform", `${baseT} scale(${MAX_SCALE})`)
      .transition().duration(350).ease(d3.easeCubicIn)    // slower down
        .attr("transform", `${baseT} scale(1)`)
        .on("end", () => chev.attr("data-animating", null));
}

// === Canonical directions (case118 fbus→tbus) + geometry base ===
async function loadCanonicalDirections(){
  if (window.__canonDir) return window.__canonDir;
  try{
    const r = await fetch('/api/branch-directions');
    const { branches = [] } = await r.json();
    const m = new Map();
    for (const { fbus, tbus } of branches){
      const lo = Math.min(fbus,tbus), hi = Math.max(fbus,tbus);
      m.set(`${lo}|${hi}`, [fbus, tbus]);   // electrical AB = fbus→tbus
    }
    window.__canonDir = m;
    return m;
  }catch(e){
    console.warn('Failed to load canonical directions', e);
    window.__canonDir = new Map();
    return window.__canonDir;
  }
}

function baseAngleAB(A, B){
  const idAB = `Line_Bus${A}_Bus${B}`;
  const idBA = `Line_Bus${B}_Bus${A}`;
  const path = document.getElementById(idAB) || document.getElementById(idBA);
  if (!path || !path.getTotalLength) return null;

  const L = path.getTotalLength();
  const P1 = path.getPointAtLength(L * 0.45);
  const P2 = path.getPointAtLength(L * 0.55);
  const mid = path.getPointAtLength(L * 0.50);

  let deg = Math.atan2(P2.y - P1.y, P2.x - P1.x) * 180 / Math.PI;
  if (!document.getElementById(idAB)) deg += 180; // only BA path? invert once so base is AB
  return { midX: mid.x, midY: mid.y, deg };
}




function renderMapLineLoads(lines) {
  d3.selectAll(".line-load-indicator").remove();

  // Ensure canonical directions are ready before drawing
  const ensure = window.__canonDir ? Promise.resolve(window.__canonDir) : loadCanonicalDirections();

  ensure.then(() => {
    setTimeout(() => {
      const group = d3.select("#zoom-group");
      if (group.empty()) return;

      (lines || []).forEach(line => {
        const a0 = +line.from_bus, b0 = +line.to_bus;
        if (!Number.isFinite(a0) || !Number.isFinite(b0)) return;

        // Canonical electrical AB = fbus→tbus (case118)
        const key = `${Math.min(a0,b0)}|${Math.max(a0,b0)}`;
        const canon = (window.__canonDir && window.__canonDir.get(key)) || [a0, b0];
        const [A, B] = canon;

        // Base angle in AB frame from SVG geometry (normalize BA→AB if only BA exists)
        const base = baseAngleAB(A, B);
        if (!base) return;

        // Signed flow in AB frame; negative flips 180° to B→A
        // Signed flow in AB frame; negative flips 180° to B→A
        const fs = +(line.flow_signed ?? line.flow ?? 0);

          // Global inversion (except Bus68–Bus69)
        const invertExtra = shouldInvertChevronPair(A, B) ? 180 : 0;

        const angle = base.deg + (fs < 0 ? 180 : 0) + invertExtra;

        const midX = base.midX, midY = base.midY;

        // Utilization and styling
        const pct01 = (+line.rate_a > 0) ? Math.abs(fs) / +line.rate_a : 0;
        const color = getChevronColor(pct01);
        const size  = Math.max(8, 10 * (1 + 0.6 * pct01));

        const baseT = `translate(${midX}, ${midY}) rotate(${angle})`;

        // Unordered line id for lookups (disabled set, ping, etc.)
        const lineId = `Line_Bus${Math.min(a0,b0)}_Bus${Math.max(a0,b0)}`;
        const isDisabled = (window.disabledLineSet && window.disabledLineSet.has(lineId));

        if (isDisabled) {
          group.append("text")
            .attr("class", "line-load-indicator line-x")
            .attr("id", `chev-${lineId}`)
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "central")
            .attr("transform", baseT)
            .attr("data-base-transform", baseT)
            .style("font-size", `${size * 3.0}px`)
            .style("pointer-events", "none")
            .text("❌");
        } else {
          const ZERO = 0.1; // MW
          const isZero = Math.abs(fs) < ZERO || pct01 === 0;

          const pathD = isZero
            ? (function circlePath(r){
                 const rr = Math.max(2, r*0.45);
                 return `M ${-rr},0 a ${rr},${rr} 0 1,0 ${rr*2},0 a ${rr},${rr} 0 1,0 ${-rr*2},0 Z`;
               })(size)
            : chevronPath(size);

          group.append("path")
            .attr("class", "line-load-indicator")
            .attr("id", `chev-${lineId}`)
            .attr("d", pathD)
            .attr("fill", color)
            .attr("stroke", "#111")
            .attr("stroke-width", 0.4)
            .attr("opacity", 1)
            .attr("transform", baseT)
            .attr("data-base-transform", baseT);
        }
      });
    }, 0);
  });
}



// Nuanced, calm ramp, shared with MapView
function getChevronColor(pct01) {
  const p = Math.max(0, +pct01 || 0); // 0..∞ (1 === 100%)

  if (p <= 0.10) { // 0–10%: almost white → pale yellow
    const t = p / 0.10;
    return d3.interpolateRgb("#FFFDE7", "#FFF9C4")(t);
  }
  if (p <= 0.30) { // 10–30%: pale → mellow yellow
    const t = (p - 0.10) / 0.20;
    return d3.interpolateRgb("#FFF9C4", "#FFF59D")(t);
  }
  if (p <= 0.50) { // 30–50%: mellow → warm yellow
    const t = (p - 0.30) / 0.20;
    return d3.interpolateRgb("#FFF59D", "#FFE082")(t);
  }
  if (p <= 0.70) { // 50–70%: warm yellow → light orange
    const t = (p - 0.50) / 0.20;
    return d3.interpolateRgb("#FFE082", "#FFB74D")(t);
  }
  if (p <= 0.85) { // 70–85%: light orange → orange
    const t = (p - 0.70) / 0.15;
    return d3.interpolateRgb("#FFB74D", "#FF9800")(t);
  }
  if (p <= 1.00) { // 85–100%: orange → bright red
    const t = (p - 0.85) / 0.15;
    return d3.interpolateRgb("#FF9800", "#EF5350")(t);
  }
  // >100%: bright, pleasant reds (never maroon)
  const t = Math.min(1, (p - 1) / 0.50);
  return d3.interpolateRgb("#EF5350", "#FF6E6E")(t);
}

  if (g.disabled) { g.user_active = false; g.pg = 0; }
});

// 🔑 List-membership rule:
// - Disabled → always Inactive
// - Locked   → Active iff it's actually on (pg > 0), else Inactive
// - Unlocked → Active iff user_active = true
function isActiveForList(g){
  if (g.disabled) return false;
  if (g.locked)   return (Number(g.pg) || 0) > 0;        // locked follow real output
  return !!g.user_active;                                 // normal user control
}

const activeSafe   = window.currentGenerators.filter(isActiveForList);
const inactiveSafe = window.currentGenerators.filter(g => !isActiveForList(g));

activeGenerators   = activeSafe;
inactiveGenerators = inactiveSafe;

// (Optional) sanity log
console.log(`🧮 active=${activeGenerators.length}, inactive=${inactiveGenerators.length}`);
console.log(`🔒 locked in active?`, activeGenerators.some(g => g.locked),
            `⛔ disabled in active?`, activeGenerators.some(g => g.disabled));

// Render
renderColumn("inactive", inactiveGenerators);
renderColumn("active",   activeGenerators);

if (typeof updateMapGeneratorsFromScenario === 'function') {
  updateMapGeneratorsFromScenario();
}

function markUserActiveStatus(gens) {
  gens.forEach(g => {
    if (g.user_active === undefined) {
      g.user_active = g.pg > 0;  // infer on first load

function getSortFunction(key, order) {
  const dir = order === 'asc' ? 1 : -1;
  if (key === 'cost') return (a, b) => dir * (a.cost_per_mw - b.cost_per_mw);
  if (key === 'emissions') return (a, b) => dir * (a.emissions_per_mw - b.emissions_per_mw);
  if (key === 'pmax') return (a, b) => dir * (a.pmax - b.pmax);
  return (a, b) => dir * (a.bus - b.bus);
}

window.debugScenarioVsMap = function debugScenarioVsMap(maxTries = 20, delayMs = 100){
  let tries = 0;

  const normalizeId = v => {
    const m = String(v).match(/\d+/);
    return m ? `Gen${m[0]}` : String(v);
  };

  const run = () => {
    tries++;

    // 1) Gather map generator rects
    const mapRects = document.querySelectorAll('rect.map-gen.gen-card');
    if (!mapRects.length) {
      if (tries < maxTries) return setTimeout(run, delayMs);  // wait for map
      console.warn("⚠ debugScenarioVsMap: no map generator rects found after retries.");
      return;
    }
    const mapIds = new Set([...mapRects].map(r => r.id));

    // 2) Scenario refs (locked/disabled)
    const scen = window.currentScenarioData || {};
    const locked   = (scen.locked_generators   || scen.locked   || []).map(normalizeId);
    const disabled = (scen.disabled_generators || scen.disabled || []).map(normalizeId);
    const referenced = [...new Set([...locked, ...disabled])];

    // 3) API ids (from /api/generators)
    const apiIds = new Set((window.currentGenerators || []).map(g => `Gen${g.bus}`));

    // 4) Diffs
    const missingOnMapFromScenario = referenced.filter(id => !mapIds.has(id));
    const apiOnly = [...apiIds].filter(id => !mapIds.has(id));
    const mapOnly = [...mapIds].filter(id => !apiIds.has(id));

    console.group("🔎 Generator ID cross-check");
    console.log("Map IDs (count):", mapIds.size);
    console.log("Scenario referenced:", referenced);
    if (missingOnMapFromScenario.length) {
      console.warn("⚠ Scenario gens NOT found on map:", missingOnMapFromScenario);
    } else {
      console.log("✅ All scenario-referenced gens exist on the map.");
    }
    if (apiOnly.length) console.warn("⚠ In API only (not on map):", apiOnly);
    if (mapOnly.length) console.warn("⚠ On map only (not in API):", mapOnly);
    console.groupEnd();
  };

  run();
};

function _lv_now(){ return performance.now(); }
function _lv_fmt(ms){
  const s = Math.max(0, Math.round(ms/1000));
  const m = Math.floor(s/60), r = s % 60;
  return `${m}:${String(r).padStart(2,'0')}`;
}
function _lv_num(v){ return Number.isFinite(+v) ? +v : 0; }

function _lv_disabledLineSet(scen){
  // Prefer a shared set if present; else derive from scenario.disabled_lines
  if (window.disabledLineSet instanceof Set) return window.disabledLineSet;
  const s = new Set();
  (scen?.disabled_lines || []).forEach(id => s.add(String(id)));
  return s;
}

function lvComputeSubmitStats(){
  const gens  = Array.isArray(window.currentGenerators) ? window.currentGenerators : [];
  const lines = Array.isArray(window.currentLines)      ? window.currentLines      : [];
  const scen  = window.currentScenarioData || {};

  // Totals
  let totalCost = 0, totalEmissions = 0;
  for (const g of gens){
    const pg  = _lv_num(g?.pg);
    totalCost      += pg * _lv_num(g?.cost_per_mw);
    totalEmissions += pg * _lv_num(g?.emissions_per_mw);
  }

  // Highest load % across enabled lines
  const disabled = _lv_disabledLineSet(scen);
  let highestLoadPct = 0;
  for (const L of lines){
    if (!L) continue;
    const id = String(L.id ?? `Line_Bus${L.from_bus}_Bus${L.to_bus}`);
    if (disabled.has(id)) continue;
    const rate = _lv_num(L.rate_a ?? L.rateA);
    const flow = Math.abs(_lv_num(L.flow));
    const pct  = rate > 0 ? (flow / rate) * 100 : 0;
    if (Number.isFinite(pct) && pct > highestLoadPct) highestLoadPct = pct;
  }

  const startedAt = window.lvScenarioStartedAt || window.mvScenarioStartedAt || window.scenarioStartedAt || _lv_now();
  const elapsedMs = Math.max(0, _lv_now() - startedAt);

  return { elapsedMs, highestLoadPct, totalCost, totalEmissions };
}

  }
  function getScenario(){ return window.currentScenarioData || {}; }

  // Fallback for when the page doesn't return normalized eval state
  function computeFallbackState(){
    const gens = getGens(), lines = getLines(), scen = getScenario();
    const totals = {
      power:     gens.reduce((s,g)=>s+nz(g.pg), 0),
      cost:      gens.reduce((s,g)=>s+nz(g.pg)*nz(g.cost_per_mw), 0),
      emissions: gens.reduce((s,g)=>s+nz(g.pg)*nz(g.emissions_per_mw), 0),
    };
    const goals = {
      target_mw:        Number.isFinite(nz(scen.target_mw))       ? nz(scen.target_mw)       : null,
      max_cost:         (scen.cost_limit != null)                  ? nz(scen.cost_limit)      : null,
      max_emissions:    (scen.emissions_limit != null)             ? nz(scen.emissions_limit) : null,
      max_overloads:    (scen.max_overloads != null)               ? nz(scen.max_overloads)   : 0,
      target_tolerance: Number.isFinite(nz(scen.target_tolerance)) ? nz(scen.target_tolerance): 0.05
    };
    const overloaded_count = getLines().filter(l => {
      const r = nz(l.rate_a ?? l.rateA), f = Math.abs(nz(l.flow));
      return r > 0 && f > r;
    }).length;
    const meets = {
      power:     goals.target_mw != null ?
                 (totals.power >= goals.target_mw*(1 - goals.target_tolerance) &&
                  totals.power <= goals.target_mw*(1 + goals.target_tolerance)) : true,
      cost:      goals.max_cost != null      ? totals.cost      <= goals.max_cost      : true,
      emissions: goals.max_emissions != null ? totals.emissions <= goals.max_emissions : true,
      overloads: overloaded_count <= (goals.max_overloads ?? 0)
    };
    meets.overall = Boolean(meets.power && meets.cost && meets.emissions && meets.overloads);

    return {
      scenarioId: getScenario().scenario_id || getScenario().id || null,
      totals,
      state: { overloaded_count },
      meta: { gens: gens.length, lines: lines.length, ts: Date.now() },
      meets,
      goals
    };
  }

  function computeEvalStateSafe(){
    try {
      if (typeof window.__origEvaluateScenarioState === 'function') {
        return window.__origEvaluateScenarioState(getGens(), getLines(), getScenario());
      }
      if (typeof window.evaluateScenarioState === 'function') {
        return window.evaluateScenarioState(getGens(), getLines(), getScenario());
      }
    } catch (e) {
      console.warn('[RunnerBridge] eval failed; using fallback', e);
    }
    return computeFallbackState();
  }

  function normalize(res){
    if (res && typeof res === 'object' && res.totals && (res.meets || res.goals)) {
      return {
        scenarioId: res.scenarioId ?? (getScenario().scenario_id || getScenario().id || null),
        totals: res.totals ?? null,
        state:  res.state  ?? null,
        meta:   res.meta   ?? { ts: Date.now() },
        meets:  res.meets  ?? null,
        goals:  res.goals  ?? null
      };
    }
    return computeFallbackState();
  }

  function postToRunner(precomputed){
    const snap = normalize(precomputed || computeEvalStateSafe());
    const payload = {
      type: 'dv:state',
      view: 'list',
      scenarioId: snap.scenarioId,
      totals: snap.totals,
      state:  snap.state,
      meta:   snap.meta,
      meets:  snap.meets,
      goals:  snap.goals
    };
    try { window.parent && window.parent.postMessage(payload, '*'); }
    catch (e) { console.warn('[RunnerBridge] postMessage failed:', e); }
  }

  // Patch WITHOUT recursion (fix the `.args` bug)
  if (typeof window.evaluateScenarioState === 'function' && !window.__origEvaluateScenarioState) {
    window.__origEvaluateScenarioState = window.evaluateScenarioState;
    window.evaluateScenarioState = function patchedEvaluateScenarioState(...args) {
      const result = window.__origEvaluateScenarioState.apply(this, args);
      postToRunner(result);
      return result;
    };
  }
  if (typeof window.applyScenarioUI === 'function' && !window.__origApplyScenarioUI) {
    window.__origApplyScenarioUI = window.applyScenarioUI;
    window.applyScenarioUI = function patchedApplyScenarioUI(state) {
      const ret = window.__origApplyScenarioUI.call(this, state);
      postToRunner(state && typeof state === 'object' ? state : computeEvalStateSafe());
      return ret;
    };
  }

  // Reply to the runner’s explicit request
  window.addEventListener('message', (e) => {
    if ((e.data || {}).type === 'runner:requestState') postToRunner(computeEvalStateSafe());
  });

  // First beacon
  window.addEventListener('load', () => postToRunner(computeEvalStateSafe()));
})();
</script>
<script>
  // Lightweight legend toggle for MapView (no deps)
  (function () {
    const btn   = document.getElementById('lv-legend-toggle');
    const panel = document.getElementById('lv-legend-panel');
    if (!btn || !panel) return;

    // Open/close with the button
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (panel.hasAttribute('hidden')) {
        panel.removeAttribute('hidden');
      } else {
        panel.setAttribute('hidden', '');
      }
    });

    // Clicking the panel itself closes it (per caption)
    panel.addEventListener('click', () => panel.setAttribute('hidden', ''));

    // Click-away to close
    document.addEventListener('click', (e) => {
      const inside = panel.contains(e.target) || btn.contains(e.target);
      if (!inside) panel.setAttribute('hidden', '');
    });

    // Escape key closes
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') panel.setAttribute('hidden', '');
    });
  })();
</script>
