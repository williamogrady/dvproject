async function loadScenario(scenarioId){
  const res = await fetch(`/api/scenario/${scenarioId}`);
  const data = await res.json();

  currentScenarioId   = scenarioId;
  currentScenarioData = data.scenario || {};
  currentGenerators   = data.generators || [];
  const lines         = data.lines || data.powerflow?.lines || [];

  window.currentLines = lines; // if other modules rely on it

  renderGenerators(currentGenerators);
  renderLines(lines, data.solved !== false);
  renderOverview(currentGenerators, currentScenarioData, lines);
  updateLinesCard(lines);
  updateMapGeneratorsFromScenario();
  setupTaskSection(currentScenarioData);
  // No second “scenario UI” call — renderOverview already computed + applied it
}


    function populateScenarioDropdown(scenarios, defaultId) {

        option.value = s.scenario_id;

          option.selected = true;
        }
        select.appendChild(option);
      });
    }

// --- NEW: normalize helpers ---
function normalizeLines(linesIn){
  if (Array.isArray(linesIn)) return linesIn;
  if (!linesIn) return [];
  if (typeof linesIn === "object" && !("length" in linesIn)) return Object.values(linesIn);
  return Array.from(linesIn);
}
function nz(n){ return Number(n || 0); }

// --- NEW: pure state computation (no DOM here) ---
function evaluateScenarioState(gens = [], linesIn = [], scenario = {}){
  const lines = normalizeLines(linesIn);

  const totals = {
    power:     gens.reduce((s,g) => s + nz(g.pg), 0),
    cost:      gens.reduce((s,g) => s + nz(g.pg) * nz(g.cost_per_mw), 0),
    emissions: gens.reduce((s,g) => s + nz(g.pg) * nz(g.emissions_per_mw), 0),
  };

  const targetMW = nz(scenario.target_mw);
  const maxCost  = (scenario.max_cost != null) ? nz(scenario.max_cost) : null;
  const maxCO2   = (scenario.max_emissions != null) ? nz(scenario.max_emissions) : null;

  const overloadedCount = lines.filter(l => {
    const rate = nz(l.rate_a ?? l.rateA);
    const flow = Math.abs(nz(l.flow));
    return rate > 0 && flow > rate;
  }).length;

  const meetsPower      = targetMW > 0 ? totals.power >= targetMW : true;
  const withinCost      = (maxCost == null) ? true : totals.cost      <= maxCost;
  const withinEmissions = (maxCO2  == null) ? true : totals.emissions <= maxCO2;
  const noOverloads     = overloadedCount === 0;

  return {
    totals, targetMW, maxCost, maxCO2, overloadedCount,
    meetsPower, withinCost, withinEmissions, noOverloads,
    allMet: meetsPower && withinCost && withinEmissions && noOverloads
  };
}

// --- NEW: apply the computed state to checkboxes/buttons (DOM only) ---
function applyScenarioUI(state){
  const cPower  = document.getElementById("check-power");
  const cLines  = document.getElementById("check-lines");
  const cBudget = document.getElementById("check-budget");
  if (cPower)  cPower.checked  = !!state.meetsPower;
  if (cLines)  cLines.checked  = !!state.noOverloads;
  if (cBudget){
    cBudget.closest("li").style.display = (state.maxCost != null) ? "" : "none";
    cBudget.checked = (state.maxCost != null) && !!state.withinCost;
  }
  const submitBtn = document.getElementById("submit-button");
  if (submitBtn){
    submitBtn.disabled = !state.allMet;
    submitBtn.classList.toggle("active", state.allMet);
  }
  const ctrlSubmit = document.querySelector("#row-4 .submit-button");
  if (ctrlSubmit) ctrlSubmit.disabled = !state.allMet;
}





function renderTaskSection(scenario = {}, evalStateArg) {
  // Fallbacks so we never read properties off undefined
  const gens  = (window.currentGenerators || []);
  const lines = (window.currentLines     || []);
  // Use provided eval state if present; otherwise compute it safely
  const state = evalStateArg ?? (typeof evaluateScenarioState === "function"
    ? evaluateScenarioState(gens, lines, scenario)
    : {
        totals: { power: 0, cost: 0, emissions: 0 },
        targetMW: Number(scenario?.target_mw || 0),
        maxCost:  (scenario?.max_cost ?? null),
        maxCO2:   (scenario?.max_emissions ?? null),
        overloadedCount: 0,
        meetsPower: false, withinCost: true, withinEmissions: true, noOverloads: true,
        allMet: false
      });

  // --- Render UI using `state` (NEVER assume evalStateArg is defined) ---
  const title = scenario?.title || scenario?.name || "Scenario";
  const desc  = scenario?.description || scenario?.task || "";

  const reqList = document.getElementById("task-requirements");
  if (reqList) {
    const hasBudget = state.maxCost != null;
    // update checkboxes (if present)
    const cPower  = document.getElementById("check-power");
    const cLines  = document.getElementById("check-lines");
    const cBudget = document.getElementById("check-budget");
    if (cPower)  cPower.checked  = !!state.meetsPower;
    if (cLines)  cLines.checked  = !!state.noOverloads;
    if (cBudget) { cBudget.closest("li").style.display = hasBudget ? "" : "none"; cBudget.checked = hasBudget && !!state.withinCost; }
  }

  // Constraints
  const powerSpan = document.getElementById("constraint-power");
  if (powerSpan) powerSpan.textContent = String(state.targetMW || 0);

  const costWrap = document.getElementById("constraint-cost-container");
  const costSpan = document.getElementById("constraint-cost");
  if (costWrap) costWrap.style.display = (state.maxCost != null) ? "" : "none";
  if (costSpan && state.maxCost != null) costSpan.textContent = String(state.maxCost);

  // Submit enablement
  const submitBtn = document.getElementById("submit-button");
  if (submitBtn) {
    submitBtn.disabled = !state.allMet;
    submitBtn.classList.toggle("active", state.allMet);
  }

  // Keep controls bar submit (if present) in sync
  const ctrlSubmit = document.querySelector("#row-4 .submit-button");
  if (ctrlSubmit) ctrlSubmit.disabled = !state.allMet;
}


// MapView-style overview renderer (robust to any 'lines' shape)
function renderOverview(gens, scenarioData = {}, linesIn = []) {
  // --- normalize lines to a plain array ---
  const lines = Array.isArray(linesIn)
    ? linesIn
    : (linesIn == null
        ? []
        : (typeof linesIn === "object" && !("length" in linesIn))
          ? Object.values(linesIn)         // e.g., { "1-2": {...}, "2-3": {...} }
          : Array.from(linesIn));          // e.g., NodeList / array-like

  // --- totals (safe numbers) ---
  totalPower     = (gens || []).reduce((s, g) => s + Number(g.pg || 0), 0);
  totalCost      = (gens || []).reduce((s, g) => s + Number(g.pg || 0) * Number(g.cost_per_mw || 0), 0);
  totalEmissions = (gens || []).reduce((s, g) => s + Number(g.pg || 0) * Number(g.emissions_per_mw || 0), 0);

  const target = Number(scenarioData?.target_mw || 0);

  // --- overloaded lines count (abs(flow) > rate_a) ---
  const overloadedCount = lines.filter(l => {
    const rate = Number(l?.rate_a ?? l?.rateA ?? 0);
    const flow = Math.abs(Number(l?.flow ?? 0));
    return rate > 0 && flow > rate;
  }).length;

  // --- DOM hookups (supports both legacy IDs and MapView selectors) ---
  const powerBlocks = document.querySelector("#overview-power .blocks")
                    || document.getElementById("overview-power-blocks");
  const powerLabel  = document.querySelector("#overview-power .fraction")
                    || document.getElementById("overview-power-label");
  if (powerLabel) powerLabel.textContent = target
      ? `${Math.round(totalPower)} / ${target}`
      : `${Math.round(totalPower)} / –`;

  const costEl = document.getElementById("overview-cost");
  if (costEl) costEl.textContent = `$${Math.round(totalCost)}`;

  const emiEl = document.getElementById("overview-emissions");
  if (emiEl) emiEl.textContent = `${Math.round(totalEmissions)} CO₂`;

  const linesEl = document.getElementById("overview-lines");
  if (linesEl) linesEl.textContent = overloadedCount;

  const okPill = document.getElementById("lines-ok-pill");
  if (okPill) {
    const solved = overloadedCount === 0 && target > 0 && totalPower >= target;
    okPill.style.display = solved ? "inline-block" : "none";
  }

  // --- power blocks grid render ---
  updatePowerBlocks(totalPower, target);

  // optional hooks if present
  try { if (typeof refreshChevrons === "function") refreshChevrons(lines, window.currentMapMode || "full"); } catch(_) {}
  try { if (typeof updateLinesCard  === "function") updateLinesCard(lines); } catch(_) {}
  // Re-evaluate scenario + refresh the task section UI
try {
  const state = evaluateScenarioState(gens, lines, currentScenarioData || {});
renderTaskSection(currentScenarioData || {}, state);   // fills numbers/visibility
applyScenarioUI(state);      
} catch (_) {}

}

// Keeps previous loads for deltas across renders
const _prevLineFlow = Object.create(null);

function getLineKey(l) {
  const a = Number(l.from_bus ?? l.from ?? l.a ?? 0);
  const b = Number(l.to_bus   ?? l.to   ?? l.b ?? 0);
  const lo = Math.min(a,b), hi = Math.max(a,b);
  return `${lo}-${hi}`;
}

function linePct(l) {
  const rate = Number(l.rate_a ?? l.rateA ?? 0);
  const flow = Math.abs(Number(l.flow ?? 0));
  if (!rate) return 0;
  return (flow / rate) * 100;
}

function loadClass(pct) {
  if (pct >= 100) return "load-high";
  if (pct >= 80)  return "load-warn";
  return "load-okay";
}

function deltaInfo(curr, prev) {
  const d = Math.round(curr - prev);
  if (d > 0)  return { cls: "up", txt: `+${d}%` };
  if (d < 0)  return { cls: "down", txt: `${d}%` };
  return { cls: "neutral", txt: "–" };
}

function makeMini(line, pct, prevPct) {
  const key = getLineKey(line);
  const di  = deltaInfo(pct, prevPct);
  const klass = loadClass(pct);
  const name = `L ${line.from_bus ?? line.from}→${line.to_bus ?? line.to}`;
  return `
    <div class="line-mini ${klass}" data-line="${key}">
      <div class="chev"></div>
      <div class="txt">
        <span class="name">${name}</span>
        <span class="load">${Math.round(pct)}%</span>
        <span class="delta ${di.cls}">${di.txt}</span>
      </div>
    </div>
  `;
}

/**
 * Populate Lines card like MapView B:
 * - row-rich: top 3 overloaded (>=100%)
 * - row-top : next highest (up to 6), excluding those in row-rich
 */
function updateLinesCard(linesIn) {
  // Normalize to array
  const lines = Array.isArray(linesIn)
    ? linesIn
    : (linesIn == null ? [] :
       (typeof linesIn === "object" && !("length" in linesIn)) ? Object.values(linesIn) : Array.from(linesIn));

  const richRow = document.getElementById("lines-row-rich");
  const topRow  = document.getElementById("lines-row-top");
  const countEl = document.getElementById("overview-lines");

  if (!richRow || !topRow) return;

  // Compute % and sort by severity
  const withPct = lines.map(l => {
    const pct = linePct(l);
    const key = getLineKey(l);
    const prev = _prevLineFlow[key] ?? pct;
    _prevLineFlow[key] = pct;
    return { line: l, pct, prev };
  }).sort((a,b) => b.pct - a.pct);

  const overloaded = withPct.filter(x => x.pct >= 100);
  const others     = withPct.filter(x => x.pct < 100);

  // Count & pill handled in renderOverview; keep count synced here if present
  if (countEl) countEl.textContent = overloaded.length;

  // Top 3 overloaded
  const rich = overloaded.slice(0, 3)
    .map(x => makeMini(x.line, x.pct, x.prev)).join("");

  // Next best (up to 6), excluding the ones already shown
  const shownKeys = new Set(overloaded.slice(0,3).map(x => getLineKey(x.line)));
  const top = others.filter(x => !shownKeys.has(getLineKey(x.line)))
    .slice(0, 6)
    .map(x => makeMini(x.line, x.pct, x.prev)).join("");

  richRow.innerHTML = rich || "";
  topRow.innerHTML  = top  || "";
}



// Power block grid (ported from MapView B with dual-selector support)
function updatePowerBlocks(totalPower, targetPower) {
  const container = document.querySelector("#overview-power .blocks")
                 || document.getElementById("overview-power-blocks");
  const label     = document.querySelector("#overview-power .fraction")
                 || document.getElementById("overview-power-label");

  if (!container) return;

  container.innerHTML = "";

  const BLOCK_SIZE   = 100;                       // MW per block
  const blockCount   = targetPower > 0 ? Math.ceil(targetPower / BLOCK_SIZE) : 0;
  const scaledTotal  = totalPower / BLOCK_SIZE;
  const overAmount   = Math.max(0, totalPower - (targetPower || 0));
  const showOver     = overAmount > 0;

  // Densify grid for large goals (so it fits inside the card)
  let cellMin = 22, blockH = 26, gap = 6;
  if (blockCount > 120) { cellMin = 12; blockH = 14; gap = 4; }
  else if (blockCount > 80) { cellMin = 14; blockH = 16; gap = 5; }
  else if (blockCount > 40) { cellMin = 18; blockH = 20; gap = 6; }

  container.style.setProperty('--cell-min', `${cellMin}px`);
  container.style.setProperty('--block-h', `${blockH}px`);
  container.style.setProperty('--gap', `${gap}px`);

  for (let i = 0; i < blockCount; i++) {
    const block = document.createElement("div");
    block.className = "block";
    if (scaledTotal >= (i + 1))       block.classList.add("full");
    else if (scaledTotal > i)         block.classList.add("partial");
    else                              block.classList.add("goal");
    container.appendChild(block);
  }

  if (showOver && blockCount > 0) {
    const last = container.lastElementChild;
    if (last) {
      last.className = "block over";
      last.textContent = overAmount > 2000 ? "!!!" : `+${Math.ceil(overAmount / 100)}`;
    }
  }

  if (label) {
    label.textContent = targetPower ? `${Math.round(totalPower)} / ${targetPower}` : `${Math.round(totalPower)} / –`;
  }
}


function getLineLoadPct(line) {
  return line.rate_a > 0 ? (line.flow / line.rate_a) : 0;
}

function renderLines(lines, solved = true) {
  const container = document.getElementById("line-scroll");
  const statusLabel = document.getElementById("line-status");

  // If the panel isn't present, just draw map indicators (when solved) and bail.
  if (!container || !statusLabel) {
    if (solved) { try { renderMapLineLoads(lines || []); } catch (e) {} }
    return;
  }

  container.innerHTML = "";

  // ✅ Sort lines by load percentage descending
  const sorted = [...lines].sort((a, b) => getLineLoadPct(b) - getLineLoadPct(a));

  if (!solved) {
    statusLabel.textContent = "⏳ No power flow yet";
    statusLabel.className = "status-label warning";
  } else {
    const overloadedCount = lines.filter(l => getLineLoadPct(l) > 1).length;
    if (overloadedCount === 0) {
      statusLabel.textContent = "✔ All lines OK";
      statusLabel.className = "status-label";
    } else if (overloadedCount <= 3) {
      statusLabel.textContent = `⚠ ${overloadedCount} line(s) overloaded`;
      statusLabel.className = "status-label warning";
    } else {
      statusLabel.textContent = `🟥 ${overloadedCount} line(s) OVERLOADED`;
      statusLabel.className = "status-label danger";
    }
  }

  sorted.forEach(line => {
    const card = document.createElement("div");
    card.className = "line-card";

    if (!solved) {
      card.innerHTML = `
        Line ${line.from_bus} → ${line.to_bus}<br>
        <span style="font-size: 0.85rem; color: var(--text-faint);">(No power flow)</span>
      `;
    } else {
      const pct = Math.round((line.flow / line.rate_a) * 100);
      const color = d3.interpolateReds(pct / 100);
      const textColor = pct > 60 ? "white" : "#111";
      card.style.background = color;
      card.style.color = textColor;
      card.style.setProperty('--load', pct / 100);

      const key = `${line.from_bus}-${line.to_bus}`;
      const prev = previousLineFlows[key] ?? line.flow;
      const oldPct = (prev / line.rate_a) * 100;
      const newPct = (line.flow / line.rate_a) * 100;
      const delta = Math.round(newPct - oldPct);
      previousLineFlows[key] = line.flow;

      let deltaText = "";
      if (delta > 0) deltaText = `<span style="color: limegreen;">▲ +${delta}%</span>`;
      else if (delta < 0) deltaText = `<span style="color: crimson;">▼ ${Math.abs(delta)}%</span>`;
      else deltaText = `<span style="color: gray;">–</span>`;

      card.innerHTML = `
        Line ${line.from_bus} → ${line.to_bus}<br>
        ${pct}%<br>
        ${deltaText}
      `;
    }

    container.appendChild(card);
  });

  if (solved) renderMapLineLoads(lines);
}


function renderMapLineLoads(lines) {
  d3.selectAll(".line-load-indicator").remove();

  setTimeout(() => {
    const group = d3.select("#zoom-group");

    lines.forEach(line => {
      const lineId = `Line_Bus${Math.min(line.from_bus, line.to_bus)}_Bus${Math.max(line.from_bus, line.to_bus)}`;
      const path = document.getElementById(lineId);
      if (!path) return;

      const totalLength = path.getTotalLength();
      const pointA = path.getPointAtLength(totalLength * 0.45);
      const pointB = path.getPointAtLength(totalLength * 0.55);

      const dx = pointB.x - pointA.x;
      const dy = pointB.y - pointA.y;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      const dir = line.flow >= 0 ? 1 : -1;
      const color = getLoadColor(getLineLoadPct(line));

      group.append("path")
        .attr("class", "line-load-indicator")
        .attr("d", "M -30 -20 L 0 0 L -30 20")
        .attr("fill", color)
        .attr("stroke", "black")
        .attr("stroke-width", 0.5)
        .attr("transform", `translate(${(pointA.x + pointB.x) / 2}, ${(pointA.y + pointB.y) / 2}) rotate(${angle + (dir < 0 ? 180 : 0)})`)
        .on("click", (event) => {
          showTooltip(`Line ${line.from_bus}→${line.to_bus}`, event.pageX, event.pageY);
          event.stopPropagation();
        });
    });
  }, 0);
}



function getLoadColor(pct) {
  return d3.interpolateYlOrRd(Math.min(1, Math.max(0, pct)));
}



function renderGenerators(gens) {
  currentGenerators = gens;

  const lockedGens = gens.filter(g => g.locked);
  const disabledGens = gens.filter(g => g.disabled);
  const activeGens = gens.filter(g => g.user_active && !g.locked && !g.disabled);
  const inactiveGens = gens.filter(g => !g.user_active || g.disabled);

  // ✅ Save for future sorting
  activeGenerators = [...lockedGens, ...activeGens];
  inactiveGenerators = inactiveGens;

  renderColumn("inactive", inactiveGenerators);
  renderColumn("active", activeGenerators);
}

function renderColumn(type, gens) {
  const container = document.querySelector(`#${type}-container .generator-body`);
  container.innerHTML = "";

  const { key, order } = activeSort[type];
  const maxPmax = Math.max(...currentGenerators.map(g => g.pmax));
  const sorted = gens.slice().sort(getSortFunction(key, order));

  console.log(`📦 Rendering ${type} list sorted by ${key} (${order})`);
  console.log("First 3 names:", sorted.slice(0, 3).map(g => g.station_name || g.name));

  sorted.forEach(gen => {

  });

function markUserActiveStatus(gens) {
  gens.forEach(g => {
    if (g.user_active === undefined) {
      g.user_active = g.pg > 0;  // infer on first load
    }
  });
}

function getSortFunction(key, order) {
  const dir = order === 'asc' ? 1 : -1;
  if (key === 'cost') return (a, b) => dir * (a.cost_per_mw - b.cost_per_mw);
  if (key === 'emissions') return (a, b) => dir * (a.emissions_per_mw - b.emissions_per_mw);
  if (key === 'pmax') return (a, b) => dir * (a.pmax - b.pmax);
  return (a, b) => dir * (a.bus - b.bus);
}

// === POWER blocks (identical behavior + look) ===
const POWER_BLOCK_SIZE_MW = 100;
let _powerDensityIdx = 1; // 0..N, cycles on click
const _densityPresets = [
  { cell: 22, gap: 6 },  // roomy
  { cell: 18, gap: 6 },  // default
  { cell: 14, gap: 5 },  // compact
  { cell: 12, gap: 4 }   // extra-compact
];

function updatePowerBlocks(totalPower, targetPower){
  const container = document.querySelector("#overview-power .blocks")
                 || document.getElementById("overview-power-blocks");
  const label     = document.querySelector("#overview-power .fraction")
                 || document.getElementById("overview-power-label");
  if (!container) return;

  const total = Math.max(0, Number(totalPower || 0));
  const target = Math.max(0, Number(targetPower || 0));

  // Decide how many blocks to draw
  const blockCount = target > 0 ? Math.ceil(target / POWER_BLOCK_SIZE_MW)
                                : Math.ceil(total / POWER_BLOCK_SIZE_MW);

  // Density: auto-adjust based on block count, then apply current preset offset
  let auto = 1; // default index
  if (blockCount > 120) auto = 3;
  else if (blockCount > 80) auto = 2;
  else if (blockCount > 40) auto = 1;
  const preset = _densityPresets[Math.min(auto, _powerDensityIdx)];
  container.style.setProperty("--cell-min", `${preset.cell}px`);
  container.style.setProperty("--gap", `${preset.gap}px`);

  // Build the grid
  container.innerHTML = "";
  const fullCount = Math.floor(total / POWER_BLOCK_SIZE_MW);
  const partialRemainder = total % POWER_BLOCK_SIZE_MW;
  const hasPartial = partialRemainder > 0 && fullCount < blockCount;

  for (let i = 0; i < blockCount; i++){
    const div = document.createElement("div");
    div.className = "block";
    if (i < fullCount) div.classList.add("full");
    else if (i === fullCount && hasPartial) div.classList.add("partial");
    // else remains as goal (unfilled)
    container.appendChild(div);
  }

  // Over indicator: if total exceeds target, mark last block red with +X
  if (target > 0 && total > target && container.lastElementChild){
    const overBlocks = Math.ceil((total - target) / POWER_BLOCK_SIZE_MW);
    const last = container.lastElementChild;
    last.className = "block over";
    last.textContent = `+${overBlocks}`;
  }

  if (label){
    label.textContent = target ? `${Math.round(total)} / ${target}` : `${Math.round(total)} / –`;
  }
}

    updatePowerBlocks(window.totalPower || 0, (window.currentScenarioData && currentScenarioData.target_mw) || 0);

})();



function bindSortListeners() {

  document.querySelectorAll('.sort-buttons .sort-btn').forEach(button => {
    button.addEventListener('click', () => {
      const type = button.closest('.sort-buttons').dataset.type;
      const clickedKey = button.dataset.sort;
      const current = activeSort[type];

      if (current.key === clickedKey) {
        current.order = current.order === 'asc' ? 'desc' : 'asc';
      } else {
        current.key = clickedKey;
        current.order = 'asc';
      }

      document.querySelectorAll(`.sort-buttons[data-type="${type}"] .sort-btn`).forEach(btn => {
        btn.classList.remove('active', 'asc', 'desc');
      });
      button.classList.add('active', current.order);

      const data = type === "active" ? activeGenerators : inactiveGenerators;
      renderColumn(type, data);
    });
  });
}

      <p><strong>🫧 Emissions:</strong> ${Math.round(totalEmissions)} tCO₂</p>
    </div>
    <button class="results-close" id="close-overlay">Close</button>
  `;

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  document.getElementById("close-overlay").addEventListener("click", () => overlay.remove());
}


// === Update generator colors on scenario load ===
function updateMapGeneratorsFromScenario() {
  const genNodes = d3.selectAll(".map-gen");

  genNodes.each(function(d) {
    const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
    const isOn = match && match.pg > 0;
    const isSelected = d.id === selectedGeneratorId;

    d3.select(this)
      .attr("fill", isOn ? "#4caf50" : "white")
      .attr("stroke", isSelected ? "blue" : "black")
      .attr("stroke-width", isSelected ? 2.5 : 1.2);
  });

  d3.selectAll(".map-gen-highlight").remove();

  if (selectedGeneratorId) {
    const selected = d3.select(`#${CSS.escape(selectedGeneratorId)}`);
    if (!selected.empty()) {
      const { cx, cy } = selected.node();
      const r = +selected.attr("r");

      d3.select("#zoom-group")
        .append("circle")
        .attr("class", "map-gen-highlight")
        .attr("cx", cx.baseVal.value)
        .attr("cy", cy.baseVal.value)
        .attr("r", r + 6)
        .attr("fill", "none")
        .attr("stroke", "#00f")
        .attr("stroke-width", 3)
        .attr("pointer-events", "none");
    }
  }
}

document.querySelectorAll(".layer-toggle").forEach(checkbox => {
  checkbox.addEventListener("change", (e) => {
    const className = e.target.dataset.target;
    const isVisible = e.target.checked;

    d3.selectAll(`.${className}`).style("display", isVisible ? null : "none");
  });
});

function pushToHistory(generators) {
  historyStack.push(JSON.parse(JSON.stringify(generators)));
  if (historyStack.length > 100) historyStack.shift(); // prevent memory bloat
  redoStack = []; // clear redo stack on new action
}

function applyGeneratorState(state) {
  currentGenerators = JSON.parse(JSON.stringify(state));
  renderGenerators(currentGenerators);
  renderOverview(currentGenerators, currentScenarioData, window.currentLines);
  updateMapGeneratorsFromScenario();
}

    window.addEventListener("DOMContentLoaded", () => {
    bindSortListeners();     // ✅ Only here
    updateSortButtonStyles();   // ✅ This applies the correct style immediately
    fetchAllScenarios();     // ✅ Normal startup logic
  });

  </script>
</body>
