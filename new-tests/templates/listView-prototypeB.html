<style id="listview-core-bootstrap">

<style id="layout-overrides">
  /* Full-viewport app, no page scroll */
  html, body { height: 100%; overflow: hidden; }
  #main-layout, #listView-container { height: 100vh; display: flex; flex-direction: column; }

  /* Row 1: full‑bleed across any container width */
  #row-1 {
    width: 100vw;                /* span the whole viewport */
    margin-left: calc(50% - 50vw); /* escape parent padding/margins */
    flex: 0 0 auto;
  }

  /* Work grid consumes the rest of the height, internal panels can scroll */
  #row-2-work { flex: 1 1 auto; min-height: 0; }
  #left-lists, #right-map { height: 100%; min-height: 0; }
  #generators-container, #map-panel { height: 100%; display: flex; flex-direction: column; }
  .generator-body { overflow: auto; }

  /* Kill the duplicate submit on the controls row */
  #row-4 .controls-right { display: none !important; }

  /* Hide the old inline map filters/legend (we’ll toggle them) */
  #map-filters, #map-legend-bar { display: none; }

  /* Floating buttons + panels */
  .floating-btn {
    position: fixed;
    z-index: 2000;
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.15);
    background: #111; color: #fff; cursor: pointer;
  }
  /* placements */
  .top-left   { top: 10px; left: 10px; }
  .below-left { top: 56px; left: 10px; } /* under admin */
  .bottom-left{ bottom: 10px; left: 10px; }

  .floating-panel {
    position: fixed;
    z-index: 1999;
    background: rgba(20,20,20,.98);
    color: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,.25);
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    max-width: 86vw;
    transition: transform .18s ease, opacity .18s ease, visibility .18s ease;
    opacity: 1; visibility: visible;
    backdrop-filter: blur(6px);
  }
  .floating-panel.horizontal { flex-wrap: nowrap; }

  /* collapsed state */
  .collapsed { opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.98); }

  /* Admin bar location (unfurled horizontally) */
  #admin-panel { top: 10px; left: 80px; }

  /* Filters panel (top-left under admin) */
  #filters-panel { top: 56px; left: 80px; }

  /* Legend panel (bottom-left) */
  #legend-panel { bottom: 10px; left: 80px; }

  /* Make the overview’s value grid breathe on narrow screens too */
  #overview .overview-card { min-width: 0; }

  /* Optional: keep map wrapper from overflowing */
  #map-wrapper { min-height: 0; }
</style>
<style>

<style id="layout-final-overrides">
  /* 1) Overview: full width, no container clamps */
  #row-1 {
    width: 100vw;
    margin-left: calc(50% - 50vw);
  }
  #overview { width: 100%; max-width: none; }

  /* 2) Work area: hard 50/50 split (lists | map) */
  #row-2-work {
    display: flex !important;
    width: 100vw;                             /* full-bleed row */
    margin-left: calc(50% - 50vw);            /* escape parent padding */
    min-height: 0;
  }
  #left-lists, #right-map {
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #left-lists  { flex: 0 0 50% !important; min-width: 0; }
  #right-map   { flex: 0 0 50% !important; min-width: 0; padding: 0 !important; }

  /* 3) Lists parallel (inactive | active) and scroll internally */
  #generators-container {
    display: flex !important;
    flex-direction: row !important;
    gap: 12px;
    align-items: stretch;
    flex: 1 1 auto;
    min-height: 0;
  }
  #inactive-container, #active-container {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #inactive-container .generator-body,
  #active-container .generator-body {
    flex: 1 1 auto;
    overflow: auto;
    min-height: 0;
  }

  /* 4) Map panel must fill its half (no “skinny” map) */
  #map-panel {
    position: relative;
    flex: 1 1 auto !important;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #map-wrapper {
    flex: 1 1 auto !important;
    min-height: 0;
  }

  /* Safety: ensure nothing upstream hides filters/legend in-map flyouts */

</style>

<style id="layout-polish-overrides">
  :root{
    --gutter: 16px;   /* page edge padding */
    --gap: 12px;      /* gap between columns */
  }

  /* --- Overview: full width with gutters --- */
  #row-1{
    width: 100vw;
    margin-left: calc(50% - 50vw);
    padding-inline: var(--gutter);   /* add left/right padding */
    padding-top: 8px;
    padding-bottom: 8px;
    box-sizing: border-box;
  }
  #overview{ width: 100%; max-width: none; }

  /* --- Work area: full-bleed row with gutters & equal split --- */
  #row-2-work{
    width: 100vw;
    margin-left: calc(50% - 50vw);
    padding-inline: var(--gutter);   /* keep lists off the screen edge */
    padding-bottom: var(--gutter);   /* keep map off the bottom edge */
    display: flex !important;
    gap: var(--gap);
    min-height: 0;
    box-sizing: border-box;
  }
  /* Equal 50/50 split but respect the gutters above */
  #left-lists, #right-map{
    flex: 1 1 0 !important;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* --- Map: add inner padding so it doesn’t touch right/bottom --- */
  #right-map{
    padding: var(--gutter);      /* space all around the map column */
    padding-top: 0;              /* keep icons tight at top if you like */
    box-sizing: border-box;
  }
  #map-panel{
    flex: 1 1 auto !important;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #map-wrapper{
    flex: 1 1 auto !important;
    min-height: 0;
    /* optional: soften edges of the visible map area */
    border-radius: 8px;
    overflow: hidden;
  }

  /* --- Lists: keep inactive/active strictly side-by-side --- */
  #generators-container{
    display: flex !important;
    flex-direction: row !important;
    gap: var(--gap);
    align-items: stretch;
    flex: 1 1 auto;
    min-height: 0;
  }
  #inactive-container, #active-container{
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #inactive-container .generator-body,
  #active-container .generator-body{
    flex: 1 1 auto;
    overflow: auto;
    min-height: 0;

    /* make cards use natural height instead of stretching */
    display: grid;
    grid-auto-rows: auto;
    gap: 10px;
    align-content: start;
  }

  /* --- Normalize generator card height (fix “stretched” active cards) --- */
  .generator-card{
    height: auto !important;         /* never fill column height */
    flex: 0 0 auto !important;       /* don’t grow to fill */
    align-items: flex-start !important;
  }
  .generator-card .gen-section{ align-self: flex-start !important; }

  /* If any earlier rule gives fixed heights to sections, neutralize: */
  .gen-section.left,
  .gen-section.center,
  .gen-section.right{ height: auto !important; }

  /* --- Keep filter/legend flyouts visible when opened --- */
  #map-filters-panel, #map-legend-panel{ display: flex; }
</style>
<style id="locked-disabled-styles">
  /* ===== Map generator shapes (rounded rectangle) ===== */
  .map-gen-rect {
    rx: 8; ry: 8;                 /* rounded corners */
    stroke: #000;
    stroke-width: 1.2;
  }

  /* Selected gen gets thicker blue outline */
  g.map-gen.selected > .map-gen-rect {
    stroke: blue !important;
    stroke-width: 2.5 !important;
  }

  /* Disabled: use dashed outline and a little fade */
  g.map-gen.disabled > .map-gen-rect {
    stroke-dasharray: 4 3;
    opacity: 0.85;
  }

  /* Overlay icons (SVG <image>) stacked centered over the rect */
  .map-gen-lock,
  .map-gen-disabled {
    pointer-events: none;
  }

  /* ===== Generator cards: locked/disabled ===== */
  .generator-card.locked {
    opacity: 0.95;
    filter: saturate(0.9);
  }
  .generator-card.disabled {
    opacity: 0.65;
    filter: grayscale(0.5);
  }

  /* Keep the lock on the +/- button (as in the original file), and
     show the disabled.png on the button when disabled */
  .gen-section.right .locked-btn {
    cursor: default !important;
  }
  .gen-section.right .disabled-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: #222 center/16px 16px no-repeat url('disabled.png');
    border: 1px solid rgba(0,0,0,.25);
    cursor: not-allowed !important;
  }

  /* Make sure any text on the disabled button is hidden */
  .gen-section.right .disabled-btn::before {
    content: "";
  }
</style>
<style id="mapview-skin-patch">

    --ui-bg: #0e1420;         /* control buttons bg */

  /* Overlays */
  .map-gen-lock, .map-gen-disabled { pointer-events: none; }

  /* List cards (locked/disabled) */
  .generator-card.locked   { opacity: .95; filter: saturate(.9); }
  .generator-card.disabled { opacity: .65; filter: grayscale(.5); }
  .gen-section.right .locked-btn  { cursor: default !important; }

</style>

// Small format helpers
const formatMW  = v => `${Math.round(Number(v||0))} MW`;

const formatCO2 = v => `${Math.round(Number(v||0))} CO₂`;

let redoStack = [];

    async function fetchAllScenarios() {
      const res = await fetch("/api/scenarios");
      const data = await res.json();

      availableScenarios = data;

      // Find default scenario
      const defaultScenario = data.find(s => s.scenario_id === "clean_north_power");

        if (defaultScenario) {
    currentScenarioId = defaultScenario.scenario_id;
    currentScenarioData = defaultScenario;

        populateScenarioDropdown(data, currentScenarioId);
        loadScenario(currentScenarioId);
      } else {

      }

// Settings lifted from MapView B
// === Generator layout constants (global) ===
const BLOCK_UNIT = 100, HALF_STEP = BLOCK_UNIT/2, PAD_INNER = 10, BLOCK_GAP = 4;
const MIN_GEN_W = 50, WIDTH_VARIATION = 80, MAX_GEN_W = MIN_GEN_W + WIDTH_VARIATION;
const MAX_GEN_H = 220, HALO_PAD = 8;

const roundCapToHalf = pmax => Math.ceil((pmax||0)/HALF_STEP)*HALF_STEP;
const capBlocks = p => {
  const cap = roundCapToHalf(p);
  const full = Math.floor(cap/BLOCK_UNIT);
  const half = (cap % BLOCK_UNIT) === HALF_STEP;
  return full + (half ? 1 : 0);
};
function computeBlockH(gens){
  const ext = d3.extent(gens || [], g => g.pmax || 0);
  const maxB = capBlocks(ext[1] || 0);
  const avail = MAX_GEN_H - PAD_INNER*2 - (maxB-1)*BLOCK_GAP;
  return Math.min(28, avail/Math.max(1, maxB));
}
function getWidthScale(){
  const ext = d3.extent((window.currentGenerators || []), g => g.cost_per_mw || 0);
  return d3.scaleLinear().domain([Math.max(1, ext[0]||1), ext[1]||1]).range([MIN_GEN_W, MAX_GEN_W]);

// --- NEW: normalize helpers ---
function normalizeLines(linesIn){
  if (Array.isArray(linesIn)) return linesIn;
  if (!linesIn) return [];
  if (typeof linesIn === "object" && !("length" in linesIn)) return Object.values(linesIn);
  return Array.from(linesIn);
}
function nz(n){ return Number(n || 0); }







// --- NEW: pure state computation (no DOM here) ---
function evaluateScenarioState(gens = [], linesIn = [], scenario = {}){
  const lines = normalizeLines(linesIn);

  const totals = {
    power:     gens.reduce((s,g) => s + nz(g.pg), 0),
    cost:      gens.reduce((s,g) => s + nz(g.pg) * nz(g.cost_per_mw), 0),
    emissions: gens.reduce((s,g) => s + nz(g.pg) * nz(g.emissions_per_mw), 0),
  };

  const targetMW = nz(scenario.target_mw);
  const maxCost  = (scenario.max_cost != null) ? nz(scenario.max_cost) : null;
  const maxCO2   = (scenario.max_emissions != null) ? nz(scenario.max_emissions) : null;

  const overloadedCount = lines.filter(l => {
    const rate = nz(l.rate_a ?? l.rateA);
    const flow = Math.abs(nz(l.flow));
    return rate > 0 && flow > rate;
  }).length;

  const meetsPower = (targetMW > 0) ? (totals.power >= targetMW * 0.95 && totals.power <= targetMW * 1.05) : true;
  const withinCost      = (maxCost == null) ? true : totals.cost      <= maxCost;
  const withinEmissions = (maxCO2  == null) ? true : totals.emissions <= maxCO2;
  const noOverloads     = overloadedCount === 0;

  return {
    totals, targetMW, maxCost, maxCO2, overloadedCount,
    meetsPower, withinCost, withinEmissions, noOverloads,
    allMet: meetsPower && withinCost && withinEmissions && noOverloads
  };
}

// Keeps previous loads for deltas across renders
const _prevLineFlow = Object.create(null);

function getLineKey(l) {
  const a = Number(l.from_bus ?? l.from ?? l.a ?? 0);
  const b = Number(l.to_bus   ?? l.to   ?? l.b ?? 0);
  const lo = Math.min(a,b), hi = Math.max(a,b);
  return `${lo}-${hi}`;
}

function linePct(l) {
  const rate = Number(l.rate_a ?? l.rateA ?? 0);
  const flow = Math.abs(Number(l.flow ?? 0));
  if (!rate) return 0;
  return (flow / rate) * 100;
}

function loadClass(pct) {
  if (pct >= 100) return "load-high";
  if (pct >= 80)  return "load-warn";
  return "load-okay";
}

function deltaInfo(curr, prev) {
  const d = Math.round(curr - prev);
  if (d > 0)  return { cls: "up", txt: `+${d}%` };
  if (d < 0)  return { cls: "down", txt: `${d}%` };
  return { cls: "neutral", txt: "–" };
}

// Helper: small inline chevron SVG (uses existing chevronPath())
function miniChevronSVG(color) {
  const size = 10; // tuned to fit the card nicely
  return `
    <svg width="16" height="16" viewBox="-1 -1 24 24" aria-hidden="true">
      <path d="${chevronPath(size)}" fill="${color}" stroke="#111" stroke-width="0.6"/>
    </svg>`;
}

// MapView-style mini (NO line name; just load + delta)
function makeMini(line, pct, prevPct, compact=false) {
  const accent = getLoadColor(pct / 100); // your getLoadColor expects 0..1
  const delta  = Math.round(pct - (prevPct ?? pct));
  const dCls   = delta > 0 ? "up" : (delta < 0 ? "down" : "neutral");
  const dTxt   = delta > 0 ? `+${delta}%` : (delta < 0 ? `${delta}%` : `–`);

  const borderW = compact ? "1.5px" : "3px"; // rich row vs top row

  return `
    <div class="line-card" style="--accent:${accent}; border-color:${accent}; border-width:${borderW};">
      <div class="left">${miniChevronSVG(accent)}</div>
      <div class="right">
        <div class="load">${Math.round(pct)}%</div>
        <div class="delta ${dCls}">${dTxt}</div>
      </div>
    </div>`;
}


/**
 * Populate Lines card like MapView B:
 * - row-rich: top 3 overloaded (>=100%)
 * - row-top : next highest (up to 6), excluding those in row-rich
 */
function updateLinesCard(linesIn) {
  // Normalize to array
  const lines = Array.isArray(linesIn)
    ? linesIn
    : (linesIn == null ? [] :
       (typeof linesIn === "object" && !("length" in linesIn)) ? Object.values(linesIn) : Array.from(linesIn));

  const richRow = document.getElementById("row-rich");
  const topRow  = document.getElementById("row-top");
  if (!richRow || !topRow) return;

  const countEl = document.getElementById("overview-lines");
  const flow = (window._prevLineFlow ||= {});

  // Compute % loads, remember previous, sort by severity
  const withPct = lines.map(line => {
    const pct  = linePct(line);
    const key  = getLineKey(line);
    const prev = (flow[key] ?? pct);
    flow[key]  = pct;
    return { line, pct, prev, key };
  }).sort((a,b) => b.pct - a.pct);

  const overloaded = withPct.filter(x => x.pct >= 100);
  const others     = withPct.filter(x => x.pct < 100);

  // Sync count (badge/pill elsewhere also reads this)
  if (countEl) countEl.textContent = String(overloaded.length);

  // Top 3 overloaded (rich row, thick border)
  const topOver = overloaded.slice(0, 3);

  // Next up to 6 top lines excluding the ones already shown (compact row)
  const shown   = new Set(topOver.map(x => x.key));
  const nextTop = others.filter(x => !shown.has(x.key)).slice(0, 6);

  richRow.innerHTML = topOver
    .map(x => makeMini(x.line, x.pct, x.prev, /*compact=*/false))
    .join("");

  topRow.innerHTML = nextTop
    .map(x => makeMini(x.line, x.pct, x.prev, /*compact=*/true))
    .join("");
}




// Power block grid (ported from MapView B with dual-selector support)
function updatePowerBlocks(totalPower, targetPower) {
  const container = document.querySelector("#overview-power .blocks")
                 || document.getElementById("overview-power-blocks");
  const label     = document.querySelector("#overview-power .fraction")
                 || document.getElementById("overview-power-label");

  if (!container) return;

  container.innerHTML = "";

  const BLOCK_SIZE   = 100;                       // MW per block
  const blockCount   = targetPower > 0 ? Math.ceil(targetPower / BLOCK_SIZE) : 0;
  const scaledTotal  = totalPower / BLOCK_SIZE;
  const overAmount   = Math.max(0, totalPower - (targetPower || 0));
  const showOver     = overAmount > 0;

  // Densify grid for large goals (so it fits inside the card)
  let cellMin = 22, blockH = 26, gap = 6;
  if (blockCount > 120) { cellMin = 12; blockH = 14; gap = 4; }
  else if (blockCount > 80) { cellMin = 14; blockH = 16; gap = 5; }
  else if (blockCount > 40) { cellMin = 18; blockH = 20; gap = 6; }

  container.style.setProperty('--cell-min', `${cellMin}px`);
  container.style.setProperty('--block-h', `${blockH}px`);
  container.style.setProperty('--gap', `${gap}px`);

  for (let i = 0; i < blockCount; i++) {
    const block = document.createElement("div");
    block.className = "block";
    if (scaledTotal >= (i + 1))       block.classList.add("full");
    else if (scaledTotal > i)         block.classList.add("partial");
    else                              block.classList.add("goal");
    container.appendChild(block);
  }

  if (showOver && blockCount > 0) {
    const last = container.lastElementChild;
    if (last) {
      last.className = "block over";
      last.textContent = overAmount > 2000 ? "!!!" : `+${Math.ceil(overAmount / 100)}`;
    }
  }

  if (label) {
    label.textContent = targetPower ? `${Math.round(totalPower)} / ${targetPower}` : `${Math.round(totalPower)} / –`;
  }
}


function getLineLoadPct(line) {
  return line.rate_a > 0 ? (line.flow / line.rate_a) : 0;
}

function renderLines(lines, solved = true) {
  const container = document.getElementById("line-scroll");
  const statusLabel = document.getElementById("line-status");

  // If the panel isn't present, just draw map indicators (when solved) and bail.
  if (!container || !statusLabel) {
    if (solved) { try { renderMapLineLoads(lines || []); } catch (e) {} }
    return;
  }

  container.innerHTML = "";

  // ✅ Sort lines by load percentage descending
  const sorted = [...lines].sort((a, b) => getLineLoadPct(b) - getLineLoadPct(a));

  if (!solved) {
    statusLabel.textContent = "⏳ No power flow yet";
    statusLabel.className = "status-label warning";
  } else {
    const overloadedCount = lines.filter(l => getLineLoadPct(l) > 1).length;
    if (overloadedCount === 0) {
      statusLabel.textContent = "✔ All lines OK";
      statusLabel.className = "status-label";
    } else if (overloadedCount <= 3) {
      statusLabel.textContent = `⚠ ${overloadedCount} line(s) overloaded`;
      statusLabel.className = "status-label warning";
    } else {
      statusLabel.textContent = `🟥 ${overloadedCount} line(s) OVERLOADED`;
      statusLabel.className = "status-label danger";
    }
  }

  sorted.forEach(line => {
    const card = document.createElement("div");
    card.className = "line-card";

    if (!solved) {
      card.innerHTML = `
        Line ${line.from_bus} → ${line.to_bus}<br>
        <span style="font-size: 0.85rem; color: var(--text-faint);">(No power flow)</span>
      `;
    } else {
      const pct = Math.round((line.flow / line.rate_a) * 100);
      const color = d3.interpolateReds(pct / 100);
      const textColor = pct > 60 ? "white" : "#111";
      card.style.background = color;
      card.style.color = textColor;
      card.style.setProperty('--load', pct / 100);

      const key = `${line.from_bus}-${line.to_bus}`;
      const prev = previousLineFlows[key] ?? line.flow;
      const oldPct = (prev / line.rate_a) * 100;
      const newPct = (line.flow / line.rate_a) * 100;
      const delta = Math.round(newPct - oldPct);
      previousLineFlows[key] = line.flow;

      let deltaText = "";
      if (delta > 0) deltaText = `<span style="color: limegreen;">▲ +${delta}%</span>`;
      else if (delta < 0) deltaText = `<span style="color: crimson;">▼ ${Math.abs(delta)}%</span>`;
      else deltaText = `<span style="color: gray;">–</span>`;

      card.innerHTML = `
        Line ${line.from_bus} → ${line.to_bus}<br>
        ${pct}%<br>
        ${deltaText}
      `;
    }

    container.appendChild(card);
  });

  if (solved) renderMapLineLoads(lines);
}




function renderMapLineLoads(lines) {
  d3.selectAll(".line-load-indicator").remove();

  setTimeout(() => {
    const group = d3.select("#zoom-group");

    (lines||[]).forEach(line => {
      const id = `Line_Bus${Math.min(line.from_bus, line.to_bus)}_Bus${Math.max(line.from_bus, line.to_bus)}`;
      const path = document.getElementById(id);
      if (!path || !path.getTotalLength) return;

      const len = path.getTotalLength();
      const A = path.getPointAtLength(len * 0.45);
      const B = path.getPointAtLength(len * 0.55);

      const angle = Math.atan2(B.y - A.y, B.x - A.x) * 180 / Math.PI + (line.flow < 0 ? 180 : 0);
      const midX = (A.x + B.x)/2, midY = (A.y + B.y)/2;

      const pct = line.rate_a > 0 ? Math.abs(line.flow) / line.rate_a : 0;
      const color = d3.interpolateYlOrRd(Math.max(0, Math.min(1, pct)));
      const size = Math.max(8, 10 * (1 + 0.6 * pct)); // mimic MapView scaling

      group.append("path")
        .attr("class", "line-load-indicator")
        .attr("d", chevronPath(size))
        .attr("fill", color)
        .attr("stroke", "#111")
        .attr("stroke-width", 0.4)
        .attr("transform", `translate(${midX}, ${midY}) rotate(${angle})`);
    });
  }, 0);
}

// === POWER blocks (identical behavior + look) ===
const POWER_BLOCK_SIZE_MW = 100;
let _powerDensityIdx = 1; // 0..N, cycles on click
const _densityPresets = [
  { cell: 22, gap: 6 },  // roomy
  { cell: 18, gap: 6 },  // default
  { cell: 14, gap: 5 },  // compact
  { cell: 12, gap: 4 }   // extra-compact
];

function updatePowerBlocks(totalPower, targetPower){
  const container = document.querySelector("#overview-power .blocks")
                 || document.getElementById("overview-power-blocks");
  const label     = document.querySelector("#overview-power .fraction")
                 || document.getElementById("overview-power-label");
  if (!container) return;

  const total = Math.max(0, Number(totalPower || 0));
  const target = Math.max(0, Number(targetPower || 0));

  // Decide how many blocks to draw
  const blockCount = target > 0 ? Math.ceil(target / POWER_BLOCK_SIZE_MW)
                                : Math.ceil(total / POWER_BLOCK_SIZE_MW);

  // Density: auto-adjust based on block count, then apply current preset offset
  let auto = 1; // default index
  if (blockCount > 120) auto = 3;
  else if (blockCount > 80) auto = 2;
  else if (blockCount > 40) auto = 1;
  const preset = _densityPresets[Math.min(auto, _powerDensityIdx)];
  container.style.setProperty("--cell-min", `${preset.cell}px`);
  container.style.setProperty("--gap", `${preset.gap}px`);

  // Build the grid
  container.innerHTML = "";
  const fullCount = Math.floor(total / POWER_BLOCK_SIZE_MW);
  const partialRemainder = total % POWER_BLOCK_SIZE_MW;
  const hasPartial = partialRemainder > 0 && fullCount < blockCount;

  for (let i = 0; i < blockCount; i++){
    const div = document.createElement("div");
    div.className = "block";
    if (i < fullCount) div.classList.add("full");
    else if (i === fullCount && hasPartial) div.classList.add("partial");
    // else remains as goal (unfilled)
    container.appendChild(div);
  }

  // Over indicator: if total exceeds target, mark last block red with +X
  if (target > 0 && total > target && container.lastElementChild){
    const overBlocks = Math.ceil((total - target) / POWER_BLOCK_SIZE_MW);
    const last = container.lastElementChild;
    last.className = "block over";
    last.textContent = `+${overBlocks}`;
  }

  if (label){
    label.textContent = target ? `${Math.round(total)} / ${target}` : `${Math.round(total)} / –`;
  }
}

function updateMapGeneratorsFromScenario() {
  const gens = Array.isArray(window.currentGenerators) ? window.currentGenerators : [];
  const scen = window.currentScenarioData || {};

  // Build lookups keyed like your rect ids: "Gen{bus}"
  const keyFromGen = g => (g?.id) || (g?.bus != null ? `Gen${g.bus}` : null);
  const byId = new Map();
  const byBus = new Map();
  for (const g of gens) {
    const id = keyFromGen(g);
    if (id) byId.set(String(id), g);
    if (g?.bus != null) byBus.set(String(g.bus), g);
  }

  // Debug: see what we’re matching with
  const rects = Array.from(document.querySelectorAll('rect.map-gen.gen-card'));
  const rectIds = rects.slice(0, 10).map(r => r.id);
  const genKeys = Array.from(byId.keys()).slice(0, 10);
  console.log(`[updater] gens=${gens.length}, rects=${rects.length}`);
  console.log(`[updater] sample rect ids:`, rectIds);
  console.log(`[updater] sample gen keys:`, genKeys);

  // Normalize scenario lists to id-format "Gen{bus}"
  const toIdSet = (arr) => {
    const s = new Set();
    (arr || []).forEach(v => {
      const sv = String(v);
      const num = (sv.match(/\d+/) || [null])[0];
      if (num) s.add(`Gen${num}`);
      if (sv)  s.add(sv);
    });
    return s;
  };
  const lockedSet   = toIdSet(scen.locked_generators   || scen.locked   || []);
  const disabledSet = toIdSet(scen.disabled_generators || scen.disabled || []);

  const selectedId = window.selectedGeneratorId || null;

  let matched = 0, total = 0;

  d3.selectAll('rect.map-gen.gen-card').each(function () {
    total++;
    const rect = d3.select(this);
    const id   = this.id || "";                 // e.g. "Gen24"
    const bus  = (id.match(/\d+/) || [null])[0];// e.g. "24"
    const g    = byId.get(id) || (bus ? byBus.get(bus) : null);

    const pg         = Number(g?.pg ?? 0);
    const userActive = !!g?.user_active;
    const isOn       = (pg > 0) || userActive;

    const isLocked   = lockedSet.has(id)   || !!g?.locked;
    const isDisabled = disabledSet.has(id) || !!g?.disabled;
    const isSelected = selectedId && id === selectedId;

    // DIRECT paint – ignores CSS specificity issues
    rect
      .attr('fill', (isOn && !isDisabled) ? 'var(--gen-on, #27ae60)' : '#fff')
      .attr('stroke', isSelected ? '#3b82f6' : '#222')
      .attr('stroke-width', isSelected ? 3 : 1.2)
      .attr('opacity', isDisabled ? 0.45 : 1)
      .style('pointer-events', isDisabled ? 'none' : null)
      .attr('stroke-dasharray', isLocked ? '4 3' : null);

    // overlays/halo if present
    const group = d3.select(this.parentNode);
    const halo  = group.select('.map-gen-halo');
    if (!halo.empty()) halo.attr('opacity', isSelected ? 0.9 : 0);

    const lockImg = group.select('.map-gen-lock');
    if (!lockImg.empty()) lockImg.style('display', isLocked ? null : 'none');
    const disImg  = group.select('.map-gen-disabled');
    if (!disImg.empty())  disImg.style('display', isDisabled ? null : 'none');

    if (g) matched++;
  });

  console.log(`[map gens] updated: matched=${matched}/${total}`);
}
