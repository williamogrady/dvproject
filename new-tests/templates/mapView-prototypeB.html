<style>
  
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap');


.map-load {
  fill: #5878cf;
}

:root {
  --gen-on: #4caf50;
  --gen-off: #333;
}


    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: sans-serif;
      background: #1e1e1e;
      color: #eee;
      overflow: hidden;
    }

    #map-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    svg#map {
      width: 100%;
      height: 100%;
      background: #dfcfcf;
    }

#overview {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 20;
  padding: 10px 20px;
  background: rgba(40, 40, 40, 0.85); /* translucent wrapper */
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

#overview-top {
  display: grid;
  grid-template-columns: 3fr 2fr 2fr;
  gap: 1rem;
  padding: 1rem;
  box-sizing: border-box;
  align-items: stretch;
  width: 100%;
}

#overview-bottom {
  margin-top: 10px;
}

#overview {
  display: flex;
  flex-direction: row; /* just in case */
  background: white;
  border-radius: 20px;
  padding: 1rem;
  gap: 1rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  box-sizing: border-box;
  width: 1500px;
  margin: auto;
  opacity: 0.95;
  align-items: stretch; /* ensures both columns match height */
}


#overview-status-section {
  display: grid;
  grid-template-columns: 3fr 2fr 2fr;
  gap: 1rem;
  flex: 0 0 68%;
}

#overview-task-section {
  width: 220px;
  flex: 1 1 32%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

#overview-task-section, 
#overview-task-section * {
  font-family: 'Figtree', sans-serif;
}

/* ----------------------------------------
   GENERAL CARD STRUCTURE + TYPOGRAPHY
---------------------------------------- */

.overview-card {
  font-family: "Figtree", sans-serif;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0.6rem 0.75rem;
  box-sizing: border-box;
  cursor: pointer;
  height: 100%;
  transition: background 0.2s ease, transform 0.2s ease;
}

.overview-card:hover {
  background: #f5f5f5;
  transform: translateY(-1px);
}

.overview-label {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 0.25rem;
  color: #333;
}

.overview-value {
  font-size: 1.1rem;
  font-weight: bold;
  color: #000;
}

.overview-status {
  font-size: 0.7rem;
  text-align: center;
  color: #666;
  margin-top: auto;
}


/* ----------------------------------------
   SPECIFIC CARD LAYOUTS (CLEANED)
---------------------------------------- */

/* Column placement + vertical spacing model */
#scale-power {
  grid-column: 1 / 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

#scale-lines {
  grid-column: 2 / 3;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

#scale-cost,
#scale-emissions {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: calc(50% - 0.25rem);
}

#right-column {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  height: 100%;
  grid-column: 3 / 4;
}

/* ----------------------------------------
   LINES CARD (Rows 3 & 4)
---------------------------------------- */

/* Horizontal rows (single line); no visible scrollbars/gray boxes */
#scale-lines .row-rich,
#scale-lines .row-top {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 6px 2px;
  background: transparent;
  /* Hide scrollbars cross-browser */
  scrollbar-width: none;              /* Firefox */
  -ms-overflow-style: none;           /* IE/Edge legacy */
}


#scale-lines .row-rich { margin-bottom: 8px; }  /* tweak 6–12px to taste */
#scale-lines .row-top  { margin-top: 8px; }

#scale-lines .row-rich::-webkit-scrollbar,
#scale-lines .row-top::-webkit-scrollbar {
  width: 0 !important;
  height: 0 !important;               /* Chrome/Safari */
}
#scale-lines .row-rich::-webkit-scrollbar-thumb,
#scale-lines .row-top::-webkit-scrollbar-thumb,
#scale-lines .row-rich::-webkit-scrollbar-track,
#scale-lines .row-top::-webkit-scrollbar-track,
#scale-lines .row-rich::-webkit-scrollbar-corner,
#scale-lines .row-top::-webkit-scrollbar-corner {
  background: transparent !important;
}

/* Optional tiny title when overloaded == 0 */
#scale-lines .row-top-title {
  font-size: 0.72rem;
  color: #64748b;
  font-weight: 700;
  margin-right: 8px;
  white-space: nowrap;
}

/* Cards — shared base */
#scale-lines .line-card {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 22px 1fr;   /* left icon + right text */
  align-items: center;
  background: #fff;
  border-radius: 10px;
  padding: 4px 6px;
  border: 1.5px solid var(--accent, #e5e7eb); /* JS sets --accent/borderColor */
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  position: relative;
}

/* Row 3 cards 20% smaller */
#scale-lines .row-rich .line-card {
  width: 88px;          /* was ~110px */
  height: 26px;         /* was ~32px */
  padding: 3px 5px;     /* slightly tighter */
  grid-template-columns: 18px 1fr; /* shrink left icon column */
}

/* Slightly smaller type only for Row 3 */
#scale-lines .row-rich .line-card .load  { font-size: 0.74rem; }
#scale-lines .row-rich .line-card .delta { font-size: 0.60rem; }


#scale-lines .row-top .line-card {   /* Row 4 */
  width: 80px;
  height: 24px;
  border-radius: 8px;
  padding: 3px 5px;
  grid-template-columns: 18px 1fr;
  box-shadow: 0 1px 2px rgba(0,0,0,.05);
}

/* Inner layout + type */
#scale-lines .line-card .left  { display:flex; align-items:center; justify-content:center; }
#scale-lines .line-card .right { display:grid; grid-template-rows: 1fr auto; padding-left: 4px; }
#scale-lines .line-card .load  { font-weight: 800; color: #111; font-size: 0.82rem; line-height: 1; }
#scale-lines .row-top .line-card .load { font-size: 0.78rem; }
#scale-lines .line-card .delta { font-weight: 700; line-height: 1; font-size: .68rem; }
.delta.up { color:#c62828; }
.delta.down { color:#2e7d32; }
.delta.neutral { color:#64748b; }

/* Hover: subtle only, no layout shift */
#scale-lines .line-card:hover { background: #f7f9fb; }

/* Remove the old left accent bar entirely */
#scale-lines .line-card::before { content: none !important; }

/* Selection state (keep, but no colored borders) */
.overview-card.selected { border: none; box-shadow: 0 0 0 2px rgba(66,165,245,.18) inset; }
.overview-card.scale-power.selected,
.overview-card.scale-cost.selected,
.overview-card.scale-emissions.selected,
.overview-card.scale-lines.selected { border: none; }




/* ----------------------------------------
   TASK SECTION
---------------------------------------- */

.task-card {
  background: #f8f8f8;
  border-radius: 12px;
  padding: 0.8rem 1rem;
  box-sizing: border-box;
  color: #333;
  font-size: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  flex: 1;
}

.task-content {
  display: flex;
  gap: 1rem;
  justify-content: space-between;
}

.task-left,
.task-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

/* Specific styling for task section title card */
.overview-card.task-card {
  padding: 0.6rem 0.75rem;
  gap: 0.5rem;
}

.task-card .task-title {
  margin-top: 0;
  margin-bottom: 0.3rem;
}
.task-subtitle {
  font-size: 0.7rem;
  color: #777;
  margin-bottom: 0.3rem;
}

#task-requirements .task-title,
#task-constraints .task-title {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 0.25rem;
  color: #333;
}

#task-requirements {
  list-style: none;
  padding-left: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

#task-requirements li {
  font-weight: bold;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

#task-constraints div {
  font-weight: bold;
  font-size: 0.75rem;
  color: #333;
  margin: 0.2rem 0;
}

.task-submit-row {
  margin-top: 0.5rem;
  display: flex;
  justify-content: flex-end;
}

#submit-button {
  padding: 0.35rem 0.8rem;
  border-radius: 6px;
  background-color: #ccc;
  color: #fff;
  font-weight: bold;
  border: none;
  font-size: 0.75rem;
  cursor: not-allowed;
  transition: background-color 0.2s ease;
}

#submit-button.active {
  background-color: #4CAF50; /* Green */
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  transition: all 0.2s ease-in-out;
}

#submit-button:disabled {
  background-color: #ccc;
  color: #666;
  cursor: not-allowed;
  box-shadow: none;
}


.task-placeholder {
  font-style: italic;
  font-size: 0.85rem;
  color: #666;
  padding: 0.5rem 0;
}
/* ----------------------------------------
   VISUAL FEEDBACK (SELECTED STATES)
---------------------------------------- */

.overview-card.selected {
  border: 2px solid #42a5f5;
}

.overview-card.scale-lines.selected {
  border-color: #42a5f5;
}


.overview-card.scale-power.selected {
  border-color: #4caf50;
}

.overview-card.scale-cost.selected {
  border-color: #f9a825;
}

.overview-card.scale-emissions.selected {
  border-color: #c62828;
}
/* ----------------------------------------
   BLOCKS — Power card (responsive)
---------------------------------------- */

/* Space between blocks and fraction text; keep content inside card */
#scale-power .overview-value {
  display: flex;
  flex-direction: column;
  gap: 10px;         /* margin between blocks and the text */
  width: 100%;
  overflow: hidden;  /* prevent any overflow peeking out */
}

/* Power blocks become a responsive grid that auto-wraps */
#overview-power .blocks {
  --cell-min: 22px;  /* JS will tune for huge goals */
  --gap: 6px;
  --block-h: 26px;

  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--cell-min), 1fr));
  gap: var(--gap);
  width: 100%;
  max-width: 100%;   /* remove old 200px clamp */
  height: auto;      /* remove fixed heights */
  align-content: start;
  box-sizing: border-box;
}

/* Each block fills its grid cell */
#overview-power .block {
  width: 100%;
  height: var(--block-h);
  border-radius: 6px;
}

/* Keep your color semantics */
#overview-power .block.full   { background-color: #4caf50; }
#overview-power .block.partial{ background-color: #a5d6a7; }
#overview-power .block.goal   { background-color: #e0e0e0; }
#overview-power .block.over   {
  background-color: #ef5350;
  color: white;
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}

/* ----------------------------------------
   BLOCKS — Legacy styles (scoped AWAY from power)
   (prevents them from overriding the grid above)
---------------------------------------- */
.overview-card:not(#scale-power) .blocks {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  width: 100%;
  max-width: 200px;
}

.overview-card:not(#scale-power) .block {
  width: 18px;
  height: 20px;
  background: #ccc;
  border-radius: 2px;
}

/* ----------------------------------------
   RESULTS
---------------------------------------- */

.results-box {
  background: white;
  color: #222;
  padding: 2rem 2.5rem;
  border-radius: 12px;
  font-family: "Figtree", sans-serif;
  text-align: center;
  width: 320px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

.results-title {
  font-size: 1.4rem;
  margin-bottom: 1rem;
  font-weight: bold;
  color: #1a1a1a;
}

.results-summary p {
  margin: 0.5rem 0;
  font-size: 1rem;
  font-weight: 500;
}

.results-close {
  margin-top: 1.5rem;
  background: #4CAF50;
  color: white;
  border: none;
  padding: 0.6rem 1.2rem;
  border-radius: 6px;
  font-size: 1rem;
  cursor: pointer;
  font-family: "Figtree", sans-serif;
}

.results-close:hover {
  background: #45a049;
}



    #admin-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 15;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }



#map-legend {
  position: fixed;
  left: 20px;
  bottom: 80px; /* space above admin panel */
  background: rgba(40, 40, 40, 0.85);
  padding: 10px 14px;
  border: 1px solid #bbb;
  border-radius: 12px;
  font-family: sans-serif;
  font-size: 12px;
  box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
  pointer-events: none;
  z-index: 19;
}

.legend-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.legend-item {
  display: flex;
  align-items: center;
  margin: 2px 0;
}

.legend-symbol,
.legend-line,
.legend-triangle,
.legend-chevron {
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: middle;
}

.generator-on {
  background-color: #4caf50;
  border: 1px solid #333;
}

.generator-off {
  background-color: white;
  border: 1px solid #333;
}

.legend-line {
  width: 18px;
  height: 4px;
  background-color: grey;
  border-radius: 2px;
}

.legend-triangle {
  width: 0;
  height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-bottom: 14px solid #201cdf;
  margin-top: 2px;
}

.legend-chevron {
  font-size: 16px;
  color: red;
  font-weight: bold;
}

.admin-panel {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: rgba(40, 40, 40, 0.85); /* translucent wrapper */
  border: 1px solid #bbb;
  border-radius: 8px;
  display: flex;
  align-items: center;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  transition: width 0.4s ease, padding 0.4s ease;
  white-space: nowrap;
  z-index: 20;
}

.admin-panel.collapsed {
  width: 190px;
  padding: 10px 12px;
}

.admin-panel.expanded {
  width: 900px;
  padding: 10px 16px;
}

.admin-toggle-btn {
  background: rgba(20, 20, 20, 0.95); /* darker than container */
  color: white;
  border: none;
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: bold;
  align-items: center;
  cursor: pointer;
  margin-right: 14px;
  white-space: nowrap;
}

.admin-body {
  display: flex;
  gap: 12px;
  opacity: 1;
  transition: opacity 0.3s ease;
}

.admin-panel.collapsed .admin-body {
  opacity: 0;
  pointer-events: none;
}


/* --- tokens --- */
:root{
  --card-bg: #fff;
  --card-stroke: #cdd5df;
  --on-stroke: #2e7d32;

  --gen-on: #4caf50;
  --gen-on-dark: #1b5e20;

  --dice-off-stroke: #222;
  --pip-off: #111;
  --pip-on: #fff;

  --emi-ring-w: 10px;          /* ← adjust ring thickness here */
}

/* emissions indicators */
.gen-emi-strip { fill: var(--emi, #4caf50); pointer-events:none; }
.gen-emi-ring  { fill: none; stroke: var(--emi, #4caf50); stroke-width: var(--emi-ring-w); pointer-events:none; }

/* interaction */
.clickable { cursor: pointer; }

/* base card (expanded defaults) */
.gen-card{
  fill: var(--card-bg);
  stroke: var(--card-stroke);
  stroke-width: 1.2;
  shape-rendering: geometricPrecision;
}
.gen-card--on { stroke: var(--on-stroke); stroke-width: 1.6; }

/* dice-mode overrides (declared AFTER .gen-card so they win) */
.gen-card--dice-on  { fill: var(--gen-on) !important;  stroke: var(--gen-on-dark) !important; }
.gen-card--dice-off { fill: #fff !important;           stroke: var(--dice-off-stroke) !important; }

/* dice pips */
.pip-dot { stroke: none; }
.pip-dot.off { fill: var(--pip-off); }
.pip-dot.on  { fill: var(--pip-on); }

/* soft shadow */
.with-soft-shadow { filter: url(#softShadow); }

  /* On/off halo (green when ON) */
.gen-halo-on  { stroke: #2e7d32; stroke-width: 3; fill: none; opacity: 0.95; }
.gen-halo-off { stroke: none; fill: none; opacity: 0; }

/* Locked/disabled overlays */
.gen-locked   { pointer-events: none; }            /* still clickable via icon layer if you want */
.gen-disabled { opacity: 0.35; pointer-events: none; filter: grayscale(0.2); }

.gen-lock-icon {
  font: 700 14px/1.0 system-ui, sans-serif;
  fill: #111;
  paint-order: stroke;
  stroke: rgba(255,255,255,0.8);
  stroke-width: 2px;
}

// Collapsed dice pips: ON => white dots for current, black for remaining
// OFF => all capacity dots black
function drawDicePipsCollapsed(containerSel, size, currentMW, maxMW, isOn){
  const grid = 3;
  const cell = size / grid;
  const r = Math.max(4.2, cell * 0.34);

  // Round to your 50 MW half-step logic
  const capMW = roundCapToHalf(maxMW || 0);
  const curMW = Math.min(roundToHalf(currentMW || 0), capMW);

  const capDots = Math.floor(Math.min(9, capMW / 100));  // 100 MW per dot
  const curDots = Math.floor(Math.min(9, curMW / 100));

  const g = containerSel.append("g").attr("class", "dice-pips");

  for (let i = 0; i < capDots; i++) {
    const row = Math.floor(i / grid), col = i % grid;
    const cx = 0 - size/2 + cell*(col + 0.5);
    const cy = 0 - size/2 + cell*(row + 0.5);

    // Decide color by state:
    // - if ON: first curDots are white ("on"), rest black ("off")
    // - if OFF: all black ("off")
    const isFilledNow = isOn && (i < curDots);
    const cls = isFilledNow ? "pip-dot on" : "pip-dot off";

    g.append("circle")
      .attr("class", cls)
      .attr("cx", cx).attr("cy", cy).attr("r", r);
  }
}


function map(value, inMin, inMax, outMin, outMax) {
  return outMin + ((value - inMin) / (inMax - inMin)) * (outMax - outMin);
}

// Draws a fresh chevron layer from enriched line data
function drawChevrons(lines, nodes, mode) {
  // Remove old layer
  d3.select("#chevron-layer").remove();
  const chevronGroup = d3.select("#zoom-group").append("g").attr("id", "chevron-layer");

  const isLinesMode = mode === "lines";

  lines.forEach(line => {
    const fromId = line.source, toId = line.target;
    if (!fromId || !toId) return;

    const from = nodes.find(n => n.id === fromId);
    const to   = nodes.find(n => n.id === toId);
    if (!from || !to || from.type !== "bus" || to.type !== "bus") return;

    const pathEl = document.getElementById(line.id);
    if (!pathEl || !pathEl.getTotalLength) return;

    const totalLen = pathEl.getTotalLength();
    const A = pathEl.getPointAtLength(totalLen * 0.45);
    const B = pathEl.getPointAtLength(totalLen * 0.55);

    const angleDeg = Math.atan2(B.y - A.y, B.x - A.x) * 180 / Math.PI + 180;
    const midX = (A.x + B.x) / 2;
    const midY = (A.y + B.y) / 2;

    const loadPct = (line.rate_a > 0) ? (line.flow / line.rate_a) : 0;
    const color = getLoadColor ? getLoadColor(loadPct) : d3.interpolateYlOrRd(Math.max(0, Math.min(1, loadPct)));

    // Slight size boost in Lines mode
    const scale = isLinesMode ? (1 + 0.6 * Math.max(0, loadPct)) : 1;
    const base = 10;
    const size = Math.max(8, base * scale);

    chevronGroup.append("path")
  .datum(line)
  .attr("class", "chevron")
  .attr("id", `chev-${line.id}`)
  .attr("d", chevronPath ? chevronPath(size) : defaultChevronPath(size))
  .attr("fill", color)
  .attr("opacity", 0.95)
  .attr("stroke", "#111")
  .attr("stroke-width", 0.4)
  .attr("data-x", midX)
  .attr("data-y", midY)
  .attr("transform", `translate(${midX}, ${midY}) rotate(${angleDeg})`)
.attr("data-base-transform", `translate(${midX}, ${midY}) rotate(${angleDeg})`);


  });
}

function pingChevron(lineId){
  const chev = d3.select(`#chev-${CSS.escape(lineId)}`);
  if (chev.empty()) return;

  // Use a base transform (translate+rotate only) so we never compound scales
  const baseT = chev.attr("data-base-transform")
             || (chev.attr("transform") || "").replace(/\s*scale\([^)]+\)/g, "");
  const accent = chev.attr("fill") || "#42a5f5";

  // Simple buffer: ignore while animating (prevents spam-click grow)
  if (chev.attr("data-animating") === "1") return;
  chev.attr("data-animating", "1");

  // Ensure ping layer
  let pingLayer = d3.select("#chevron-pings");
  if (pingLayer.empty()) pingLayer = d3.select("#zoom-group").append("g").attr("id","chevron-pings");

  // Ring radii that remain visible at any zoom
  const k = d3.zoomTransform(svg.node()).k || 1;
  const midX = +chev.attr("data-x");
  const midY = +chev.attr("data-y");
  const rOuter = 70 / k;
  const rInner = 40 / k;

  // Emit 2 color-matched rings
  [0, 120].forEach((delay, i) => {
    const circle = pingLayer.append("circle")
      .attr("cx", midX).attr("cy", midY)
      .attr("r", 0)
      .attr("fill", "none")
      .attr("stroke", accent)
      .attr("stroke-width", 2 / k)
      .attr("opacity", 0.95);

    circle.transition().delay(delay).duration(650)
      .attr("r", i === 0 ? rOuter : rInner)
      .attr("opacity", 0)
      .ease(d3.easeCubicOut)
      .on("end", () => circle.remove());
  });

  // Clamp growth to 500% and ALWAYS return to base (no compounding)
  const MAX_SCALE = 5;
  chev.interrupt()
      .attr("transform", `${baseT} scale(1)`)
      .transition().duration(180).ease(d3.easeCubicOut)
        .attr("transform", `${baseT} scale(${MAX_SCALE})`)
      .transition().duration(220).ease(d3.easeCubicIn)
        .attr("transform", `${baseT} scale(1)`)
        .on("end", () => { chev.attr("data-animating", null); });
}




function chevronPath(scale) {
    const length = scale * 2;
  const width = scale;

  return `
    M 0 0
    L ${length} ${-width}
    L ${length * 0.8} 0
    L ${length} ${width}
    Z
  `;
}

function refreshChevrons(liveLines, currentMapMode) {
  // Index both directions so lookups don’t miss when sign flips
  const liveIdx = new Map();
  for (const l of (liveLines || [])) {
    liveIdx.set(`Bus${l.from_bus}|Bus${l.to_bus}`, l);
    liveIdx.set(`Bus${l.to_bus}|Bus${l.from_bus}`, l);
  }

  const enriched = staticLines.map(s => {
    const live = liveIdx.get(`${s.source}|${s.target}`);
    const flow = live?.flow ?? 0;
    const rate = live?.rate_a ?? 1;
    const pct  = rate > 0 ? Math.abs(flow) / rate : 0;
    return { ...s, flow, rate_a: rate, _pct: pct };
  });

  // Update the shared metrics map (source of truth for BOTH rows)
  lineMetrics.clear();
  for (const L of enriched) {
    lineMetrics.set(L.id, { pct: L._pct, flow: L.flow, rate_a: L.rate_a });
  }

  // (Re)draw chevrons using enriched data as you already do
  d3.select("#chevron-layer").remove();
  drawChevrons(enriched, staticNodes, currentMapMode);

  // Optionally stamp DOM for debug/consistency
  enriched.forEach(L => {
    d3.select(`#chev-${CSS.escape(L.id)}`).attr("data-pct", L._pct);
  });
}


// === Rect Generators: settings (tune freely) ================================
const DICE = 54;        // collapsed square side (px)
const BLOCK_UNIT       = 100;      // MW per block
const HALF_STEP        = BLOCK_UNIT / 2;
const BASE_BLOCK_H     = 28;       // px (upper bound; will scale down to fit MAX_GEN_H)
const BLOCK_GAP        = 4;        // px vertical gap
const PAD_INNER        = 10;       // px inner padding
const HALO_PAD         = 8;        // px halo padding
const MIN_GEN_W        = 50;       // px minimum width (clickable)
const WIDTH_VARIATION  = 80;       // px subtle width variation by cost
const MAX_GEN_W        = MIN_GEN_W + WIDTH_VARIATION;
const MAX_GEN_H        = 220;      // px tallest generator on screen
const BASE_S = 64;  // default dice size when Power scaling is OFF


// Round capacity to nearest half-block (capacity shown is full/half only)
const roundCapToHalf = pmax => Math.ceil((pmax || 0) / HALF_STEP) * HALF_STEP;

// Compute number of visual blocks (top can be half)
function capBlocks(p){
  const cap = roundCapToHalf(p);
  const full = Math.floor(cap / BLOCK_UNIT);
  const hasHalfTop = (cap % BLOCK_UNIT) === HALF_STEP;
  return full + (hasHalfTop ? 1 : 0);
}

// Compute global block height so the tallest gen fits MAX_GEN_H
function computeBlockH(gens){
  const pmaxExtent = d3.extent(gens, g => g.pmax || 0);
  const maxBlocks  = capBlocks(pmaxExtent[1] || 0);
  const available  = MAX_GEN_H - PAD_INNER*2 - (maxBlocks - 1) * BLOCK_GAP;
  return Math.min(BASE_BLOCK_H, available / Math.max(1, maxBlocks));
}

// Build capacity blocks (TOP → DOWN). Top block may be HALF_STEP wide (half capacity).
function capacityBoundsTopDown(pmax){
  const cap = roundCapToHalf(pmax);
  const fullBlocks = Math.floor(cap / BLOCK_UNIT);
  const hasHalfTop = (cap % BLOCK_UNIT) === HALF_STEP;
  const out = [];
  let rem = cap;

  if (hasHalfTop){
    out.push({ size: HALF_STEP, upper: rem, lower: rem - HALF_STEP }); // TOP = half
    rem -= HALF_STEP;
  }
  for (let i=0; i<fullBlocks; i++){
    out.push({ size: BLOCK_UNIT, upper: rem, lower: rem - BLOCK_UNIT });
    rem -= BLOCK_UNIT;
  }
  return out; // index 0 is TOP
}

function makePowerWidthScale(gens = currentGenerators){
  const [minP, maxP] = window.d3.extent(gens, g => g.pmax || 0);
  return window.d3.scaleSqrt()
    .domain([Math.max(1,minP||1), Math.max(2,maxP||2)])
    .range([MIN_GEN_W, MAX_GEN_W])
    .clamp(true);
}




function wireToggle(key, elId, statusId){
  const el = document.getElementById(elId);
  const status = document.getElementById(statusId);
  if (!el) { console.warn("Missing toggle element:", elId); return; }
  if (el.dataset.wired === "1") return;
  el.dataset.wired = "1";

  const setState = (on) => {
    if (on) activeFilters.add(key); else activeFilters.delete(key);
    el.classList.toggle("selected", on);
    if (status) status.textContent = on ? "Scaling ON" : "Click to scale";
  };

  // initial
  setState(activeFilters.has(key));

  el.addEventListener("click", (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const next = !activeFilters.has(key);
    console.log(`[TOGGLE] ${key}: ${!next} → ${next}`);
    setState(next);
    safeUpdate();
  }, { passive: false });
}

// Draw pips by capacity (max) and fill by current (pg).
// Binary-only rendering for dice: NO half dots (capacity or current).
function drawPipsByMaxD3(containerSel, cx, cy, size, currentMW, maxMW){
  const grid = 3;
  const cell = size / grid;
  const r = Math.max(4.2, cell * 0.34);

  const capMW = roundCapToHalf(maxMW);
  const curMW = Math.min(roundToHalf(currentMW), capMW);

  const maxBlocks = capMW / 100;   // 100 MW per dot
  const curBlocks = Math.min(maxBlocks, curMW / 100);

  const capDots = Math.floor(Math.min(9, maxBlocks));
  const curDots = Math.floor(Math.min(9, curBlocks));

  const g = containerSel.append("g").attr("class", "dice-pips");

  for (let i = 0; i < capDots; i++) {
    const row = Math.floor(i / grid), col = i % grid;
    const px = cx - size/2 + cell*(col + 0.5);
    const py = cy - size/2 + cell*(row + 0.5);

    // capacity outline (always)
    g.append("circle")
      .attr("class", "pip-capacity")
      .attr("cx", px).attr("cy", py).attr("r", r);

    // current fill (overlay)
    if (i < curDots) {
      g.append("circle")
        .attr("class", "pip-current")
        .attr("cx", px).attr("cy", py).attr("r", r - 0.6);
    }
  }
}

function onBlockClick(ev, b, node) {
  const gen = currentGenerators.find(x => `Gen${x.bus}` === node.id);
  if (!gen) return;

  // Logical bounds for this block against gen.pmax
  const upper = Math.min(b.upper, gen.pmax || 0);
  const lower = Math.min(b.lower, gen.pmax || 0);

  // Toggle: clicking a filled block drops to its lower edge, else raise to upper edge
  let targetMW = ((gen.pg || 0) >= upper) ? lower : upper;

  // Quantize to 50 MW steps and clamp
  const HALF_STEP = BLOCK_UNIT / 2;
  targetMW = Math.round(targetMW / HALF_STEP) * HALF_STEP;
  targetMW = Math.max(0, Math.min(targetMW, gen.pmax || 0));

  // Optimistic UI
  gen.pg = targetMW;
  updateMapGeneratorsFromScenario();

  // Persist to backend
  const percent = Math.min(100, Math.round((targetMW / (gen.pmax || 1)) * 100));
  fetch(`/api/set_generation/${gen.index}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ percent, user_active: true })
  })
  .then(r => r.json())
  .then(data => {
    currentGenerators = data.generators;
    currentLines = data.lines;
    renderOverview(currentGenerators, currentScenarioData, currentLines);
    updateMapGeneratorsFromScenario();
    updateGeneratorHalos();

    // Re-open the selected generator’s UI if needed
    if (selectedGeneratorId) {
      const selected = d3.select(`#${CSS.escape(selectedGeneratorId)}`);
      if (!selected.empty()) selected.dispatch("click");
    }
  })
  .catch(console.error);

  ev.stopPropagation();
}

// POWER → side length S (square). Reuse your MIN/MAX constants or set dice-specific ones.
function makePowerDiceScale(gens = currentGenerators){
  const [minP, maxP] = d3.extent(gens, g => g.pmax || 0);
  const MIN_S = 44;      // min square side in px
  const MAX_S = 120;     // max square side in px
  return d3.scaleSqrt()
    .domain([Math.max(1, minP || 1), Math.max(2, maxP || 2)])
    .range([MIN_S, MAX_S])
    .clamp(true);
}

// Draw a 3×3 grid of pips and wire clicks.
// If the first (lowest) pip is already filled and you click it → set to zero.
function drawDicePipsScaled(g, W, H, maxPips, curPips, lockedOrDisabled, onSetPips){
  const pipG = g.selectAll("g.dice-pips").data([0]).join(enter => enter.append("g").attr("class","dice-pips"));
  pipG.selectAll("*").remove();

  const cx = 0, cy = 0;
  const grid = 3;
  const pad  = Math.max(6, Math.min(W,H) * 0.10);
  const boxW = W - pad*2, boxH = H - pad*2;
  const cellW = boxW / grid, cellH = boxH / grid;
  const r = Math.max(3, Math.min(cellW, cellH) * 0.22);

  // positions left-to-right, bottom-to-top (so "lowest" pip = first)
  const positions = [];
  for (let gy = grid-1; gy >= 0; gy--){
    for (let gx = 0; gx < grid; gx++){
      positions.push({
        x: -boxW/2 + gx*cellW + cellW/2,
        y: -boxH/2 + gy*cellH + cellH/2
      });
    }
  }

  const pipCount = Math.min(9, Math.max(1, maxPips));
  const data = positions.slice(0, pipCount).map((p, i) => ({...p, i}));

  const pips = pipG.selectAll("circle.pip").data(data, d => d.i);
  pips.enter().append("circle")
    .attr("class", "pip")
    .attr("cx", d => d.x)
    .attr("cy", d => d.y)
    .attr("r", r)
    .attr("stroke", "#111")
    .attr("stroke-width", 1)
    .attr('fill', d => d.i < curBlocks ? '#22c55e' : '#374151') // green on, dark gray off
    .style("cursor", lockedOrDisabled ? "default" : "pointer")
    .on("click", function (ev, d) {
      if (lockedOrDisabled) return;
      // clicking first (lowest) when filled -> set to 0
      if (curPips > 0 && d.i === 0 && d.i < curPips) {
        onSetPips(0);
        return;
      }
      // clicking pip k sets to k+1, and fills all below
      onSetPips(d.i + 1);
    });
}

function makeCostColorScale(gens = currentGenerators) {
  const vals = (Array.isArray(gens) ? gens : [])
    .map(g => g?.cost_per_mw)
    .filter(v => Number.isFinite(v));

  let minC = Math.min(...vals), maxC = Math.max(...vals);
  if (!Number.isFinite(minC) || !Number.isFinite(maxC)) { minC = 0; maxC = 1; }
  if (minC === maxC) { const pad = Math.max(1, Math.abs(minC)*0.1); minC -= pad; maxC += pad; }

  const d0 = minC, d3max = maxC;
  const d1 = d0 + (d3max - d0) * 0.33;
  const d2 = d0 + (d3max - d0) * 0.66;

  return window.d3.scaleLinear()
    .domain([d0, d1, d2, d3max])
    .range(["#2e7d32", "#f9a825", "#fb8c00", "#c62828"]) // green→yellow→orange→red
    .clamp(true);
}

function makeEmiStrokeScale(gens = currentGenerators) {
  const [minE, maxE] = window.d3.extent(gens, g => g.emissions_per_mw || 0);
  return window.d3.scaleLinear().domain([minE||0, maxE||1]).range([0.6, 4.5]).clamp(true);
}

function makeEmiSpacingScale(gens = currentGenerators) {
  const [minE, maxE] = window.d3.extent(gens, g => g.emissions_per_mw || 0);
  return window.d3.scaleLinear().domain([minE||0, maxE||1]).range([12, 6]).clamp(true);
}

function drawPowerBlocks(g, W, H, pmax, pg, lockedOrDisabled, onSetPg) {
  const grid = 3;
  const pad  = Math.max(4, Math.min(W, H) * 0.10);
  const boxW = W - pad*2, boxH = H - pad*2;
  const cellW = boxW / grid, cellH = boxH / grid;

  const maxBlocks = Math.max(1, Math.min(9, Math.round((pmax || 0) / BLOCK_MW)));
  const curBlocks = Math.max(0, Math.min(maxBlocks, Math.round((pg   || 0) / BLOCK_MW)));

  // positions left→right, bottom→top
  const positions = [];
  for (let gy = grid - 1; gy >= 0; gy--) {
    for (let gx = 0; gx < grid; gx++) {
      positions.push({
        x: -boxW/2 + gx*cellW,
        y: -boxH/2 + gy*cellH,
        w:  cellW,
        h:  cellH
      });
    }
  }
  const data = positions.slice(0, maxBlocks).map((p, i) => ({ ...p, i })); // ← fixed

  const sel = g.selectAll("rect.gen-block").data(data, d => d.i);
  sel.join(
    e => e.append("rect").attr("class","gen-block"),
    u => u,
    x => x.remove()
  )
  .attr("x", d => d.x + 1).attr("y", d => d.y + 1)
  .attr("width", d => d.w - 2).attr("height", d => d.h - 2)
  .attr("rx", 4).attr("ry", 4)
  .attr("fill", d => (d.i < curBlocks ? BLOCK_GREEN : "#757575"))
  .style("cursor", lockedOrDisabled ? "default" : "pointer")
  .on("click", function(ev, d) {
    if (lockedOrDisabled) return;
    // first filled toggles to 0
    let newBlocks = (d.i === 0 && curBlocks > 0) ? 0 : (d.i + 1);
    newBlocks = Math.max(0, Math.min(maxBlocks, newBlocks));
    onSetPg(newBlocks * BLOCK_MW);
  });
}

    //console.log("✅ Found .blocks container");
  }

  if (!label) {
    console.warn("⚠️ .fraction label not found in #overview-power");
  } else {
    //console.log("✅ Found .fraction label");
  }

  container.innerHTML = "";

  const blockSize = 100; // MW per block
  const blockCount = Math.ceil(targetPower / blockSize);
  const scaledTotal = totalPower / blockSize;
  const overAmount = totalPower - targetPower;
  const showOver = overAmount > 0;

  // Make the grid denser for huge goals so it stays inside the card
    let cellMin = 22, blockH = 26, gap = 6;
    if (blockCount > 120) { cellMin = 12; blockH = 14; gap = 4; }
    else if (blockCount > 80) { cellMin = 14; blockH = 16; gap = 5; }
    else if (blockCount > 40) { cellMin = 18; blockH = 20; gap = 6; }

    container.style.setProperty('--cell-min', `${cellMin}px`);
    container.style.setProperty('--block-h', `${blockH}px`);
    container.style.setProperty('--gap', `${gap}px`);


  //console.log("🔢 blockCount:", blockCount);
  //console.log("📈 overAmount:", overAmount);
  //console.log("📦 showOver:", showOver);

  for (let i = 0; i < blockCount; i++) {
  const block = document.createElement("div");
  block.className = "block";

  if (totalPower >= (i + 1) * 100) {
    block.classList.add("full");
    //console.log(`🟩 Block ${i + 1}: full`);
  } else if (totalPower > i * 100) {
    block.classList.add("partial");
    //console.log(`🟨 Block ${i + 1}: partial`);
  } else {
    block.classList.add("goal");
    //console.log(`⬜ Block ${i + 1}: goal`);
  }

  container.appendChild(block);
}

  if (showOver && blockCount > 0) {
    const lastBlock = container.lastElementChild;
    if (lastBlock) {
      lastBlock.className = "block over";
      lastBlock.textContent = overAmount > 2000 ? "!!!" : `+${Math.ceil(overAmount / 100)}`;
    }
  }

  if (label) {
    label.textContent = `${Math.round(totalPower)} / ${targetPower}`;
  }

}

function setupTaskSection(scenario) {
  const container = document.getElementById("overview-task-section");
  const hasBudget = scenario.max_cost !== undefined && scenario.max_cost !== null;
    const lockedList = scenario.locked_generators || scenario.locked || [];
  const disabList  = scenario.disabled_generators || scenario.disabled || [];
const hasDisabled = Array.isArray(disabList) && disabList.length > 0;
  const hasLocked  = Array.isArray(lockedList)  && lockedList.length > 0;

  container.innerHTML = `
    <div class="task-card">
      <div class="overview-label">Scenario Task</div>
      <div class="task-card" id="task-checklist">
        <div class="task-content">
          <!-- LEFT COLUMN: REQUIREMENTS -->
          <div class="task-left">
            <div class="task-title">Requirements</div>
            <ul id="task-requirements">
              <li>
  <input type="checkbox" disabled id="check-power" />
  Meet target power${scenario.target_mw != null ? ` (${scenario.target_mw} MW)` : ""}
</li>
              <li><input type="checkbox" disabled id="check-lines" /> No line overloads</li>
              ${hasBudget
                ? `<li id="budget-check"><input type="checkbox" disabled id="check-budget" /> Stay within budget</li>`
                : ``}
            </ul>
          </div>

          <!-- RIGHT COLUMN: CONSTRAINTS -->
          <div class="task-right">
            <div class="task-title">Scenario Constraints</div>
            <div class="task-subtitle" id="task-constraints">
              ${hasLocked ? `<div id="constraint-locked">Some generators are locked</div>` : ``}
              ${hasDisabled ? `<div id="constraint-disabled">Some generators are disabled</div>` : ``}
            </div>
          </div>
        </div>

        <!-- SUBMIT BUTTON -->
        <div class="task-submit-row">
          <button id="submit-button" disabled>Submit Solution</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("submit-button").addEventListener("click", () => {
  if (document.getElementById("submit-button").disabled) return;

  showResultOverlay(totalPower, totalCost, totalEmissions);
});
}


function evaluateScenarioState(scenario, lines) {
  const meetsPower = !scenario.target_mw
  ? true
  : (totalPower >= scenario.target_mw * 0.95 &&
     totalPower <= scenario.target_mw * 1.05);
  const meetsLines = !lines.some(line => line.flow > line.rate_a);
  const meetsBudget = !scenario.max_cost || totalCost <= scenario.max_cost;

  console.log("🔎 Evaluating scenario state!");
  //console.log("   ⚡ totalPower:", totalPower, "→ meetsPower:", meetsPower);
  //console.log("   🔌 line overload check:", meetsLines ? "✅ OK" : "❌ Overloaded");
  //console.log("   💸 totalCost:", totalCost, "/", scenario.max_cost, "→ meetsBudget:", meetsBudget);

  const powerCheckbox = document.getElementById("check-power");
  const linesCheckbox = document.getElementById("check-lines");
  const budgetCheckbox = document.getElementById("check-budget");

  if (powerCheckbox) {
    powerCheckbox.checked = meetsPower;
    //console.log("   📥 check-power checkbox updated:", meetsPower);
  } else {
    console.warn("⚠️ check-power checkbox not found");
  }

  if (linesCheckbox) {
    linesCheckbox.checked = meetsLines;
    //console.log("   📥 check-lines checkbox updated:", meetsLines);
  } else {
    console.warn("⚠️ check-lines checkbox not found");
  }

  if (budgetCheckbox && scenario.max_cost !== undefined) {
    budgetCheckbox.checked = meetsBudget;
    //console.log("   📥 check-budget checkbox updated:", meetsBudget);
  } else if (scenario.max_cost !== undefined) {
    console.warn("⚠️ check-budget checkbox not found");
  }

  const allMet = meetsPower && meetsLines && (scenario.max_cost ? meetsBudget : true);
  const submitBtn = document.getElementById("submit-button");

    if (allMet) {
    submitBtn.classList.add("active");
    submitBtn.disabled = false;
  } else {
    submitBtn.classList.remove("active");
    submitBtn.disabled = true;
  }
}

function showResultOverlay() {
  const overlay = document.createElement("div");
  overlay.id = "result-overlay";
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100vw";
  overlay.style.height = "100vh";
  overlay.style.background = "rgba(0, 0, 0, 0.6)";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.zIndex = "999";

  const box = document.createElement("div");
  box.className = "results-box";
  box.innerHTML = `
    <h2 class="results-title">✅ Scenario Complete</h2>
    <div class="results-summary">
      <p><strong>⚡ Power:</strong> ${Math.round(totalPower)} MW</p>
      <p><strong>💲 Cost:</strong> $${Math.round(totalCost)}</p>
      <p><strong>🫧 Emissions:</strong> ${Math.round(totalEmissions)} tCO₂</p>
    </div>
    <button class="results-close" id="close-overlay">Close</button>
  `;

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  document.getElementById("close-overlay").addEventListener("click", () => {
    overlay.remove();
  });
}

  // Lines card stays a mode toggle, not a compound filter
// === Lines card handler ===
const linesCard = document.getElementById("scale-lines");
const linesStatus = document.getElementById("status-lines");
if (linesCard) {
  linesCard.addEventListener("click", () => {
    // Toggle a simple boolean flag
    const wasOn = (currentMapMode === "lines");
    currentMapMode = wasOn ? "full" : "lines";

    // Update appearance
    linesCard.classList.toggle("selected", !wasOn);
    linesCard.classList.add("scale-lines");
    if (linesStatus) {
      linesStatus.textContent = !wasOn ? "Active" : "Click to scale";
    }

    // Redraw chevrons appropriately
    refreshChevrons(currentLines || [], currentMapMode);

    // Dim/undim other elements if you want
    d3.selectAll(".map-bus, .map-load, .map-gen-group")
      .transition().duration(300)
      .attr("opacity", !wasOn ? 0.2 : 1);
  });
}
