  <script>
const svg = d3.select("#map");
const svgElement = svg.node();
const zoomLayer = svg.select("#zoom-layer");
const zoomGroup = svg.append("g").attr("id", "zoom-group");

const bubble = d3.select("#bubble");
let selectedGeneratorId = null;

let totalPower = 0;
let totalCost = 0;
let totalEmissions = 0;

let currentScaleMode = null;
let currentGenerators = [];
let currentLines = [];

let staticLines = [];
let staticNodes = [];

let currentScenarioId = "";
let currentScenarioData = null;
let availableScenarios = [];

let currentMapMode = "full";

// Define zoom behavior — same as before
const zoomBehavior = d3.zoom()
  .scaleExtent([0.2, 2.0])  // Allow good zoom range
  .on("zoom", (event) => {
  zoomGroup.attr("transform", event.transform);
  updateConnector();
});

svg.call(zoomBehavior);

window.addEventListener("load", () => {
  const initialScale = 0.3;
  const centerX = svgElement.clientWidth / 2;
  const centerY = svgElement.clientHeight / 2;

  svg.call(
    zoomBehavior.transform,
    d3.zoomIdentity
      .translate(centerX - 200, centerY - 150)
      .scale(initialScale)
      .translate(-centerX, -centerY)
  );

  // ✅ FIX: call fetchAllScenarios here
  fetchAllScenarios();
});

function getLineLoadPct(line) {
  return line.rate_a > 0 ? (line.flow / line.rate_a) : 0;
}

function getLoadColor(pct) {
  return d3.interpolateYlOrRd(Math.min(1, Math.max(0, pct)));
}

function drawSelectedGeneratorHalo(){
  d3.selectAll(".map-gen-halo")
    .attr("opacity", function(d){
      // d here is the bound node object (bus/gen/meta node)
      const parent = d3.select(this.parentNode);
      const id = parent.select(".map-gen").attr("id");
      return (id === selectedGeneratorId) ? 1 : 0;
    });
}

async function fetchAllScenarios() {
  console.log("fetchAllScenarios")
      const res = await fetch("/api/scenarios");
      const data = await res.json();

      availableScenarios = data;

      // Find default scenario
      const defaultScenario = data.find(s => s.scenario_id === "clean_north_power");

        if (defaultScenario) {
    currentScenarioId = defaultScenario.scenario_id;
    currentScenarioData = defaultScenario;

        populateScenarioDropdown(data, currentScenarioId);
        loadScenario(currentScenarioId);
      } else {
        console.error("No scenario with ID 'default' found.");
      }
    }

function renderOverview(gens, scenarioData = {}, lines) {
  totalPower = gens.reduce((sum, g) => sum + g.pg, 0);
  console.log("in renderOverview with totalPower:", totalPower)
  totalCost = gens.reduce((sum, g) => sum + g.pg * g.cost_per_mw, 0);
  totalEmissions = gens.reduce((sum, g) => sum + g.pg * g.emissions_per_mw, 0);

  const overloaded = lines.filter(line => line.flow > line.rate_a).length;
  const currentPower = gens.reduce((acc, g) => acc + (g.pg || 0), 0);

  
  
  const powerFraction = document.querySelector("#overview-power .fraction");
if (powerFraction) {
  powerFraction.textContent = `${Math.round(totalPower)} MW`;
}
  document.getElementById("overview-cost").textContent = `$${totalCost.toFixed(0)}`;
  document.getElementById("overview-emissions").textContent = `${totalEmissions.toFixed(0)} CO₂`;
  document.getElementById("overview-lines").textContent = overloaded;
  updatePowerBlocks(totalPower, currentScenarioData.target_mw)
  evaluateScenarioState(scenarioData, lines)
  if (lines) {
    console.log("🔁 Refreshing chevrons with updated line data");
    refreshChevrons(lines, currentMapMode);
  }
  
}

 async function loadScenario(scenarioId) {
  console.log("loadScenario")
  const res = await fetch(`/api/scenario/${scenarioId}`);
  const data = await res.json();
  currentScenarioId = scenarioId;
  currentScenarioData = data;
  currentGenerators = data.generators;
  currentLines = data.lines;


  console.log("calling renderOverview");
  setupTaskSection(currentScenarioData);
  updateMapGeneratorsFromScenario(); // Make sure this is called too
  renderOverview(currentGenerators, currentScenarioData || {}, currentLines);

}

    function populateScenarioDropdown(scenarios, selectedId) {
        const select = document.getElementById("scenario-select");
        select.innerHTML = "";

        scenarios.forEach(s => {
          const option = document.createElement("option");
          option.value = s.scenario_id;
          option.textContent = s.title || s.scenario_id;
          if (s.scenario_id === selectedId) {
            option.selected = true;
          }
          select.appendChild(option);
        });
      }

document.getElementById("scenario-select").addEventListener("change", (e) => {
    previousLineFlows = {}; // reset previous flows
    loadScenario(e.target.value);
    });

    document.getElementById("reset-button").addEventListener("click", () => {
      previousLineFlows = {}; // reset previous flows
      loadScenario(currentScenarioId); // reload current scenario
    });

function updateMapGeneratorsFromScenario() {
  // If a scale mode is active, use it
  if (currentScaleMode) {
    scaleGeneratorsBy(currentScaleMode);
  } else {
    resetGeneratorSizes();
  }

  // Also reapply stroke and highlight logic
  const genNodes = d3.selectAll(".map-gen");

  genNodes.each(function(d) {
    const isSelected = d.id === selectedGeneratorId;
    d3.select(this)
      .attr("stroke", isSelected ? "blue" : "black")
      .attr("stroke-width", isSelected ? 2.5 : 3); // ✅ consistent width
  });

  drawSelectedGeneratorHalo();
  
}
function drawChevrons(lines, nodes, mode) {
  console.log("drawChevrons with mode:", mode)
  const chevronGroup = zoomGroup.append("g").attr("id", "chevron-layer");

  lines.forEach(line => {
    const fromId = line.source;
    const toId = line.target;
    if (!fromId || !toId) return;

    const from = nodes.find(n => n.id === fromId);
    const to = nodes.find(n => n.id === toId);
    if (!from || !to || from.type !== "bus" || to.type !== "bus") return;

    const path = document.getElementById(line.id);
    if (!path) return;

    const totalLength = path.getTotalLength();
    const pointA = path.getPointAtLength(totalLength * 0.45);
    const pointB = path.getPointAtLength(totalLength * 0.55);

    const angle = Math.atan2(pointB.y - pointA.y, pointB.x - pointA.x) * 180 / Math.PI + 180;
    const midX = (pointA.x + pointB.x) / 2;
    const midY = (pointA.y + pointB.y) / 2;

    const load = line.rate_a > 0 ? line.flow / line.rate_a : 0;
    const color = getLoadColor(load);

    // 🔄 Logic based on string mode
    const scale = mode === "lines" ? Math.min(1.5, load) : 1;
    const baseSize = Math.max(10, 6 * scale);

    chevronGroup.append("path")
      .datum(line)
      .attr("class", "chevron")
      .attr("d", chevronPath(baseSize))
      .attr("fill", color)
      .attr("opacity", 0.95)
      .attr("stroke", "#111")
      .attr("stroke-width", 0.4)
      .attr("transform", `translate(${midX}, ${midY}) rotate(${angle})`);
  });
}



function chevronPath(scale) {
    const length = scale * 2;
  const width = scale;

  return `
    M 0 0
    L ${length} ${-width}
    L ${length * 0.8} 0
    L ${length} ${width}
    Z
  `;
}

function refreshChevrons(liveLines, currentMapMode) {
  console.log("refreshChevrons called with mode:", currentMapMode);

  const enrichedLines = staticLines.map(line => {
    const live = liveLines.find(l =>
      `Bus${l.from_bus}` === line.source && `Bus${l.to_bus}` === line.target
    );
    return {
      ...line,
      id: line.id,
      flow: live?.flow ?? 0,
      rate_a: live?.rate_a ?? 1
    };
  });

  d3.select("#chevron-layer").remove();
  drawChevrons(enrichedLines, staticNodes, currentMapMode); // Pass mode
}

// === Rect Generators: settings (tune freely) ================================
const BLOCK_UNIT       = 100;      // MW per block
const HALF_STEP        = BLOCK_UNIT / 2;
const BASE_BLOCK_H     = 28;       // px (upper bound; will scale down to fit MAX_GEN_H)
const BLOCK_GAP        = 4;        // px vertical gap
const PAD_INNER        = 10;       // px inner padding
const HALO_PAD         = 8;        // px halo padding
const MIN_GEN_W        = 50;       // px minimum width (clickable)
const WIDTH_VARIATION  = 80;       // px subtle width variation by cost
const MAX_GEN_W        = MIN_GEN_W + WIDTH_VARIATION;
const MAX_GEN_H        = 220;      // px tallest generator on screen

// Round capacity to nearest half-block (capacity shown is full/half only)
const roundCapToHalf = pmax => Math.ceil((pmax || 0) / HALF_STEP) * HALF_STEP;

// Compute number of visual blocks (top can be half)
function capBlocks(p){
  const cap = roundCapToHalf(p);
  const full = Math.floor(cap / BLOCK_UNIT);
  const hasHalfTop = (cap % BLOCK_UNIT) === HALF_STEP;
  return full + (hasHalfTop ? 1 : 0);
}

// Compute global block height so the tallest gen fits MAX_GEN_H
function computeBlockH(gens){
  const pmaxExtent = d3.extent(gens, g => g.pmax || 0);
  const maxBlocks  = capBlocks(pmaxExtent[1] || 0);
  const available  = MAX_GEN_H - PAD_INNER*2 - (maxBlocks - 1) * BLOCK_GAP;
  return Math.min(BASE_BLOCK_H, available / Math.max(1, maxBlocks));
}

// Build capacity blocks (TOP → DOWN). Top block may be HALF_STEP wide (half capacity).
function capacityBoundsTopDown(pmax){
  const cap = roundCapToHalf(pmax);
  const fullBlocks = Math.floor(cap / BLOCK_UNIT);
  const hasHalfTop = (cap % BLOCK_UNIT) === HALF_STEP;
  const out = [];
  let rem = cap;

  if (hasHalfTop){
    out.push({ size: HALF_STEP, upper: rem, lower: rem - HALF_STEP }); // TOP = half
    rem -= HALF_STEP;
  }
  for (let i=0; i<fullBlocks; i++){
    out.push({ size: BLOCK_UNIT, upper: rem, lower: rem - BLOCK_UNIT });
    rem -= BLOCK_UNIT;
  }
  return out; // index 0 is TOP
}

const blockColor = d3.scaleLinear() // low emis → green, high → grey
  .domain([emisExtent[0] || 0, emisExtent[1] || 1])
  .range(["#2e7d32", "#bdbdbd"]);

const SCALED_BLOCK_H = computeBlockH(currentGenerators);

function genDims(gen){
  const W = Math.max(MIN_GEN_W, widthScale(gen.cost_per_mw || 0));
  const caps = capacityBoundsTopDown(gen.pmax || 0);
  const n = caps.length;
  const H = n * SCALED_BLOCK_H + (n-1) * BLOCK_GAP + PAD_INNER*2;
  const innerW = W - PAD_INNER*2;
  return { W, H, innerW, caps };
}

function drawRectGenerators(){
  genGroups.each(function(node){
    const g = d3.select(this);
    const gen = currentGenerators.find(x => `Gen${x.bus}` === node.id) || { pmax:0, cost_per_mw:1, emissions_per_mw:0, pg:0 };
    const { W, H, innerW, caps } = genDims(gen);
    const topY = -H/2 + PAD_INNER;

    // main rect size + ON outline
    const isOn = (gen.pg || 0) > 0;
    g.select(".map-gen")
      .attr("x", -W/2)
      .attr("y", -H/2)
      .attr("width",  W)
      .attr("height", H)
      .attr("fill",  "#fff")
      .attr("stroke", isOn ? "#2e7d32" : "#111")
      .attr("stroke-width", isOn ? 5 : 2);

    // halo box size
    g.select(".map-gen-halo")
      .attr("x", -W/2 - HALO_PAD)
      .attr("y", -H/2 - HALO_PAD)
      .attr("width",  W + HALO_PAD*2)
      .attr("height", H + HALO_PAD*2);

    // clip
    g.select(`#clip-${CSS.escape(node.id)} rect`)
      .attr("x", -W/2 + PAD_INNER)
      .attr("y", -H/2 + PAD_INNER)
      .attr("width",  innerW)
      .attr("height", H - PAD_INNER*2);

    // Capacity block backgrounds (TOP → DOWN)
    const bgs = g.select(".blocks").selectAll("rect.gen-block-bg")
      .data(caps, (b,i)=>i);

    bgs.join(
      e => e.append("rect").attr("class","gen-block-bg"),
      u => u,
      x => x.remove()
    )
    .attr("x", -innerW/2)
    .attr("y", (b,i) => topY + i*(SCALED_BLOCK_H + BLOCK_GAP))
    .attr("width",  b => (b.size === HALF_STEP ? innerW/2 : innerW))
    .attr("height", SCALED_BLOCK_H)
    .attr("rx", 6).attr("ry", 6)
    .attr("fill", "transparent")
    .attr("stroke", "#000").attr("stroke-width", .8)
    .on("click", (ev, b) => {
      // Interaction: full blocks → full only; top half (if present) → half only
      const targetMW = b.upper;                              // snap to this block's upper bound
      const pmax = gen.pmax || 1;
      const percent = Math.min(100, Math.round((targetMW / pmax) * 100));
      fetch(`/api/set_generation/${gen.index}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ percent, user_active: true })
      })
      .then(res => res.json())
      .then(data => {
        currentGenerators = data.generators;
        currentLines = data.lines;
        renderOverview(currentGenerators, currentScenarioData, currentLines);
        updateMapGeneratorsFromScenario(); // <-- refresh sizes/fills
      })
      .catch(console.error);

      ev.stopPropagation();
    });

    // Binary fills (0/half/full only), from left
    const fills = g.select(".blocks").selectAll("rect.gen-block-fill")
      .data(caps, (b,i)=>i);

    fills.join(
      e => e.append("rect").attr("class","gen-block-fill"),
      u => u,
      x => x.remove()
    )
    .attr("x", -innerW/2)
    .attr("y", (b,i) => topY + i*(SCALED_BLOCK_H + BLOCK_GAP))
    .attr("height", SCALED_BLOCK_H)
    .attr("rx", 6).attr("ry", 6)
    .attr("width", b => {                  // filled if pg >= block upper bound
      const filled = (gen.pg || 0) >= b.upper;
      if (!filled) return 0;
      return (b.size === HALF_STEP) ? (innerW/2) : innerW;
    })
    .attr("fill", blockColor(gen.emissions_per_mw || 0));

    // Hover/selection halo behaviour
    g.on("mouseover", function(){
      d3.select(this).select(".map-gen-halo").transition().duration(120).attr("opacity", .5);

    }).on("click", function(event){
      event.stopPropagation();
      selectedGeneratorId = node.id;
      updateGeneratorStrokes();
      updateGeneratorHalos();
    });
  });
}

function applyMapMode(mode) {
  // === Reset if the same button is clicked again ===
  if (mode === currentMapMode) {
    mode = "full";
  }
  currentMapMode = mode;
  console.log("Applying map mode:", mode);

  const isFull = mode === "full";
  const isLines = mode === "lines";
  const isMetricMode = ["pmax", "cost_per_mw", "emissions_per_mw", "lines"].includes(mode);

  const baseRadius = 30;
  const maxRadius = 75;

  const metricColors = {
    pmax: "#9ccc65",
    cost_per_mw: "#f9a825",
    emissions_per_mw: "#ef5350"
  };

  const strokeColor = metricColors[mode] || "black";

  const sizeScale = isMetricMode
    ? d3.scaleLinear()
        .domain([0, d3.max(currentGenerators.map(g => g[mode]))])
        .range([baseRadius, maxRadius])
    : null;

  // === Generators ===
  d3.selectAll(".map-gen")
    .transition().duration(500)
      .attr("r", d => {
  if (mode === "lines") {
    return baseRadius;
  }

  if (isMetricMode) {
    const gen = currentGenerators.find(g => `Gen${g.bus}` === d.id);
    return gen ? sizeScale(gen[mode]) : baseRadius;
  }

  return baseRadius;
})
    .attr("opacity", mode === "lines" ? 0.2 : 1)
    .attr("stroke", strokeColor)
    .attr("stroke-width", isMetricMode ? 5 : 3);

  // === Generator Halos ===
  d3.selectAll(".map-gen-halo")
    .transition().duration(500)
    .attr("r", d => {
      const genCircle = d3.select(`#${CSS.escape(d.id)}`);
      const r = +genCircle.attr("r") || baseRadius;
      return r + 6;
    })
    .attr("opacity", d => d.id === selectedGeneratorId && !isLines ? 1 : 0);

  // === Lines ===
  d3.selectAll(".map-line")
    .transition().duration(300)
    .attr("opacity", isLines ? 1 : (isFull ? 1 : 0.2));

  // === Buses and Loads ===
  const busLoadOpacity = isFull ? 1 : 0.2;

  d3.selectAll(".map-bus")
    .transition().duration(300)
    .attr("opacity", busLoadOpacity);

  d3.selectAll(".map-load")
    .transition().duration(300)
    .attr("opacity", busLoadOpacity);

  // === Chevrons ===
  d3.selectAll(".chevron")
    .transition().duration(500)
    .attr("opacity", isLines || isFull ? 1 : 0.2)
    .attr("d", function(d) {
      if (!isLines) return chevronPath(10);
      const pct = +d3.select(this).attr("data-pct") || 0;
      const size = 15 + 6 * pct;
      return chevronPath(size);
    });

  // === Visual button update ===
  const buttonIds = {
  pmax: "scale-power",
  cost_per_mw: "scale-cost",
  emissions_per_mw: "scale-emissions",
  lines: "scale-lines"
};

const statusIds = {
  pmax: "status-power",
  cost_per_mw: "status-cost",
  emissions_per_mw: "status-emissions",
  lines: "status-lines"
};

  Object.keys(buttonIds).forEach(key => {
    const btn = document.getElementById(buttonIds[key]);
    const status = document.getElementById(statusIds[key]);
    if (btn) btn.classList.remove("selected", "scale-power", "scale-cost", "scale-emissions", "scale-lines");
    if (status) status.textContent = "Click to scale";
  });

  if (isMetricMode) {
    const btn = document.getElementById(buttonIds[mode]);
    const status = document.getElementById(statusIds[mode]);
    if (btn) {
      btn.classList.add("selected");
      if (mode === "pmax") btn.classList.add("scale-power");
      if (mode === "cost_per_mw") btn.classList.add("scale-cost");
      if (mode === "emissions_per_mw") btn.classList.add("scale-emissions");
      if (mode === "lines") btn.classList.add("scale-lines");
    }
    if (status) status.textContent = "Currently scaling";
  }
}

function createBlock(level, isHalf, gen) {
  const block = document.createElement("div");
  block.className = "power-block";
  block.style.width = isHalf ? `10px` : `20px`;
  block.style.height = "20px";
  block.style.borderRadius = "4px";
  const updated = currentGenerators.find(g => g.index === gen.index);
  block.style.background = updated && updated.pg >= level - 50 ? "var(--gen-on)" : "var(--gen-off)";
  block.style.border = "1px solid rgba(0, 0, 0, 0.2)";
  block.title = `${level} MW`;

  block.style.cursor = "pointer";
  block.addEventListener("mousedown", (event) => {
  event.stopPropagation(); // prevent bubble from closing

  const percent = Math.min(100, Math.round((level / gen.pmax) * 100));
  fetch(`/api/set_generation/${gen.index}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ percent, user_active: true })
  })
    .then(res => res.json())
    .then(data => {
      currentGenerators = data.generators;
      currentLines = data.lines;
      console.log("calling renderOverview");
      renderOverview(currentGenerators, currentScenarioData, currentLines);
      updateMapGeneratorsFromScenario();
      updateGeneratorHalos();

      // 🔁 Redraw the generator bubble to reflect the updated gen.pg
      const selected = d3.select(`#${CSS.escape(selectedGeneratorId)}`);
      if (!selected.empty()) {
        selected.dispatch("click");
      }
    });
});

  return block;
}

function updateMapGeneratorsFromScenario() {
  const SCALED_BLOCK_H = computeBlockH(currentGenerators);

  // Quick helpers reused here
  function genById(id){
    return currentGenerators.find(x => `Gen${x.bus}` === id) || { pmax:0, cost_per_mw:1, emissions_per_mw:0, pg:0 };
  }
  function dimsFor(gen){
    const W = Math.max(MIN_GEN_W, widthScale(gen.cost_per_mw || 0));
    const caps = capacityBoundsTopDown(gen.pmax || 0);
    const n = caps.length;
    const H = n * SCALED_BLOCK_H + (n-1) * BLOCK_GAP + PAD_INNER*2;
    const innerW = W - PAD_INNER*2;
    return { W, H, innerW, caps };
  }

  d3.selectAll(".map-gen-group").each(function(node){
    const g = d3.select(this);
    const id = g.select(".map-gen").attr("id");
    const gen = genById(id);
    const { W, H, innerW, caps } = dimsFor(gen);
    const topY = -H/2 + PAD_INNER;
    const isOn = (gen.pg || 0) > 0;

    // frame + outline
    g.select(".map-gen")
      .attr("x", -W/2).attr("y", -H/2)
      .attr("width", W).attr("height", H)
      .attr("fill",  "#fff")
      .attr("stroke", isOn ? "#2e7d32" : "#111")
      .attr("stroke-width", isOn ? 5 : 2);

    // halo + clip
    g.select(".map-gen-halo")
      .attr("x", -W/2 - HALO_PAD).attr("y", -H/2 - HALO_PAD)
      .attr("width", W + HALO_PAD*2).attr("height", H + HALO_PAD*2);
    g.select(`#clip-${CSS.escape(id)} rect`)
      .attr("x", -W/2 + PAD_INNER).attr("y", -H/2 + PAD_INNER)
      .attr("width", innerW).attr("height", H - PAD_INNER*2);

    // backgrounds
    const bgs = g.select(".blocks").selectAll("rect.gen-block-bg")
      .data(caps, (b,i)=>i);
    bgs.join(
      e => e.append("rect").attr("class","gen-block-bg"),
      u => u,
      x => x.remove()
    )
    .attr("x", -innerW/2)
    .attr("y", (b,i) => topY + i*(SCALED_BLOCK_H + BLOCK_GAP))
    .attr("width", b => (b.size === HALF_STEP ? innerW/2 : innerW))
    .attr("height", SCALED_BLOCK_H)
    .attr("rx", 6).attr("ry", 6)
    .attr("fill", "transparent")
    .attr("stroke", "#000").attr("stroke-width", .8);

    // fills (binary 0/half/full)
    const fills = g.select(".blocks").selectAll("rect.gen-block-fill")
      .data(caps, (b,i)=>i);
    fills.join(
      e => e.append("rect").attr("class","gen-block-fill"),
      u => u,
      x => x.remove()
    )
    .attr("x", -innerW/2)
    .attr("y", (b,i) => topY + i*(SCALED_BLOCK_H + BLOCK_GAP))
    .attr("height", SCALED_BLOCK_H)
    .attr("rx", 6).attr("ry", 6)
    .attr("width", b => {
      const filled = (gen.pg || 0) >= b.upper;
      if (!filled) return 0;
      return (b.size === HALF_STEP) ? (innerW/2) : innerW;
    })
    .attr("fill", blockColor(gen.emissions_per_mw || 0));
  });

  updateGeneratorStrokes();
  updateGeneratorHalos();
}

function updatePowerBlocks(totalPower, targetPower) {
  //console.log("🧪 updatePowerBlocks called");
  //console.log("   ⚡ totalPower:", totalPower);
  //console.log("   🎯 targetPower:", targetPower);

  const container = document.querySelector("#overview-power .blocks");
  const label = document.querySelector("#overview-power .fraction");

  if (!container) {
    console.warn("⚠️ .blocks container not found in #overview-power");
    return;
  } else {
    //console.log("✅ Found .blocks container");
  }

  if (!label) {
    console.warn("⚠️ .fraction label not found in #overview-power");
  } else {
    //console.log("✅ Found .fraction label");
  }

  container.innerHTML = "";

  const blockSize = 100; // MW per block
  const blockCount = Math.ceil(targetPower / blockSize);
  const scaledTotal = totalPower / blockSize;
  const overAmount = totalPower - targetPower;
  const showOver = overAmount > 0;

  //console.log("🔢 blockCount:", blockCount);
  //console.log("📈 overAmount:", overAmount);
  //console.log("📦 showOver:", showOver);

  for (let i = 0; i < blockCount; i++) {
  const block = document.createElement("div");
  block.className = "block";

  if (totalPower >= (i + 1) * 100) {
    block.classList.add("full");
    //console.log(`🟩 Block ${i + 1}: full`);
  } else if (totalPower > i * 100) {
    block.classList.add("partial");
    //console.log(`🟨 Block ${i + 1}: partial`);
  } else {
    block.classList.add("goal");
    //console.log(`⬜ Block ${i + 1}: goal`);
  }

  container.appendChild(block);
}

  if (showOver && blockCount > 0) {
    const lastBlock = container.lastElementChild;
    if (lastBlock) {
      lastBlock.className = "block over";
      lastBlock.textContent = overAmount > 2000 ? "!!!" : `+${Math.ceil(overAmount / 100)}`;
    }
  }

  if (label) {
    label.textContent = `${Math.round(totalPower)} / ${targetPower}`;
  }

}

function evaluateScenarioState(scenario, lines) {
  const meetsPower = totalPower >= scenario.target_mw;
  const meetsLines = !lines.some(line => line.flow > line.rate_a);
  const meetsBudget = !scenario.max_cost || totalCost <= scenario.max_cost;

  console.log("🔎 Evaluating scenario state!");
  //console.log("   ⚡ totalPower:", totalPower, "→ meetsPower:", meetsPower);
  //console.log("   🔌 line overload check:", meetsLines ? "✅ OK" : "❌ Overloaded");
  //console.log("   💸 totalCost:", totalCost, "/", scenario.max_cost, "→ meetsBudget:", meetsBudget);

  const powerCheckbox = document.getElementById("check-power");
  const linesCheckbox = document.getElementById("check-lines");
  const budgetCheckbox = document.getElementById("check-budget");

  if (powerCheckbox) {
    powerCheckbox.checked = meetsPower;
    //console.log("   📥 check-power checkbox updated:", meetsPower);
  } else {
    console.warn("⚠️ check-power checkbox not found");
  }

  if (linesCheckbox) {
    linesCheckbox.checked = meetsLines;
    //console.log("   📥 check-lines checkbox updated:", meetsLines);
  } else {
    console.warn("⚠️ check-lines checkbox not found");
  }

  if (budgetCheckbox && scenario.max_cost !== undefined) {
    budgetCheckbox.checked = meetsBudget;
    //console.log("   📥 check-budget checkbox updated:", meetsBudget);
  } else if (scenario.max_cost !== undefined) {
    console.warn("⚠️ check-budget checkbox not found");
  }

  const allMet = meetsPower && meetsLines && (scenario.max_cost ? meetsBudget : true);
  const submitBtn = document.getElementById("submit-button");

    if (allMet) {
    submitBtn.classList.add("active");
    submitBtn.disabled = false;
  } else {
    submitBtn.classList.remove("active");
    submitBtn.disabled = true;
  }
}

function showResultOverlay() {
  const overlay = document.createElement("div");
  overlay.id = "result-overlay";
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100vw";
  overlay.style.height = "100vh";
  overlay.style.background = "rgba(0, 0, 0, 0.6)";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.zIndex = "999";

  const box = document.createElement("div");
  box.className = "results-box";
  box.innerHTML = `
    <h2 class="results-title">✅ Scenario Complete</h2>
    <div class="results-summary">
      <p><strong>⚡ Power:</strong> ${Math.round(totalPower)} MW</p>
      <p><strong>💲 Cost:</strong> $${Math.round(totalCost)}</p>
      <p><strong>🫧 Emissions:</strong> ${Math.round(totalEmissions)} tCO₂</p>
    </div>
    <button class="results-close" id="close-overlay">Close</button>
  `;

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  document.getElementById("close-overlay").addEventListener("click", () => {
    overlay.remove();
  });
}
