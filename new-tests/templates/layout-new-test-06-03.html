<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ListView Layout Mock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    #main-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #listView-container {
      width: 65%;
      display: flex;
      flex-direction: column;
    }

    #map-panel {
      width: 35%;
      background-color: #ffffff; /* red */
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
    }

    #row-1 { background-color: #336699; height: 30%; }  /* dark blue */
    #row-2 { background-color: #4d88cc; height: 10%; }  /* medium blue */
    #row-3 { background-color: #80b3ff; height: 50%; }  /* lighter blue */
    #row-4 { background-color: #99ccff; height: 10%; }  /* lightest blue */
  </style>
</head>
<body>
  <div id="main-layout">
    <div id="listView-container">
      <div class="row" id="row-1">overview: power, cost, emissions, line loading</div>
      <div class="row" id="row-2">scenario</div>
      <div class="row" id="row-3">generators</div>
      <div class="row" id="row-4">admin controls & submit</div>
    </div>
    <div id="map-panel">map</div>
  </div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
  const svgWidth = 600;
  const svgHeight = 600;

  const mapContainer = d3.select("#map-panel")
    .html("") // clear placeholder text
    .append("svg")
    .attr("width", "100%")
    .attr("height", "100%")
    .attr("viewBox", `0 0 ${svgWidth} ${svgHeight}`)
    .attr("preserveAspectRatio", "xMidYMid meet");

  const zoomGroup = mapContainer.append("g").attr("id", "zoom-group");

  // Enable zooming
 const zoomBehavior = d3.zoom()
  .scaleExtent([0.2, 5])
  .on("zoom", (event) => {
    zoomGroup.attr("transform", event.transform);
  });

mapContainer.call(zoomBehavior);

// Set initial zoom OUT
const initialZoom = d3.zoomIdentity
  .translate(svgWidth * 0.2, svgHeight * 0.2)  // shift toward top-left
  .scale(0.4);                                // zoomed way out

mapContainer.call(zoomBehavior.transform, initialZoom);

  Promise.all([
    fetch("/new-tests/full_nodes.json").then(res => res.json()),
    fetch("/new-tests/full_lines.json").then(res => res.json())
  ]).then(([nodes, lines]) => {
    // Draw lines first
    zoomGroup.selectAll("path.line")
      .data(lines)
      .enter()
      .append("path")
      .attr("class", "map-line")
      .attr("id", d => d.id)
      .attr("d", d => d.d)
      .attr("stroke", "#999")
      .attr("stroke-width", 2)
      .attr("fill", "none");

    // Draw nodes
    zoomGroup.selectAll("circle.node")
      .data(nodes)
      .enter()
      .append("circle")
      .attr("class", "map-gen")
      .attr("id", d => d.id)
      .attr("cx", d => d.cx)
      .attr("cy", d => d.cy)
      .attr("r", 5)
      .attr("fill", d => {
        if (d.id.includes("Gen")) return "green";
        if (d.id.includes("Load")) return "blue";
        return "gray";
      })
      .attr("stroke", "black")
      .attr("stroke-width", 0.5);

      zoomGroup.selectAll("text.label")
  .data(nodes)
  .enter()
  .append("text")
  .attr("x", d => d.cx + 7)
  .attr("y", d => d.cy + 3)
  .text(d => d.id.includes("Gen") ? d.id : "")
  .attr("font-size", "6px")
  .attr("fill", "#222");
  });
</script>


</body>
</html>
