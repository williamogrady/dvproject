<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ListView Layout Mock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    .map-gen.selected {
  stroke: #00f;
  stroke-width: 4px;
}

    #main-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #listView-container {
      width: 65%;
      display: flex;
      flex-direction: column;
    }

    #map-panel {
      width: 35%;
      background-color: #ffffff; /* red */
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
    }

    .map-gen.hovered {
  stroke: yellow;
  stroke-width: 4px;
}

.line-load-indicator {
  pointer-events: none;
}

.map-line.hovered {
  stroke: orange;
  stroke-width: 4px;
}

.line-load-indicator.hovered {
  stroke: yellow;
  stroke-width: 2px;
}


    #row-1 { background-color: #336699; height: 10%; }  /* dark blue */
    #row-2 { background-color: #4d88cc; height: 30%; }  /* medium blue */
    #row-3 { background-color: #80b3ff; height: 50%; }  /* lighter blue */
    #row-4 { background-color: #99ccff; height: 10%; }  /* lightest blue */
  </style>
</head>
<body>
  <div id="main-layout">
    <div id="listView-container">
      <div class="row" id="row-1">overview: power, cost, emissions, line loading</div>
      <div class="row" id="row-2" style="flex-direction: column; align-items: stretch;">
      <div class="status-label" id="line-status">Line Loading</div>
      <div class="lines-scroll-card" id="line-scroll" style="flex: 1; overflow-y: auto; padding: 6px;"></div>
    </div>
      <div class="row" id="row-3">
      <div id="inactive-container" style="flex: 1; overflow-y: auto; padding: 8px;">
        <div class="generator-body" id="generator-list"></div>
      </div>
    </div>
      <div class="row" id="row-4">admin controls & submit</div>
    </div>
    <div id="map-panel">map</div>
  </div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
  const svgWidth = 600;
  const svgHeight = 600;
  let selectedGeneratorId = null;
  let selectedLineId = null;

  const mockGenerators = [
  { bus: 24, pg: 0, pmax: 400, cost_per_mw: 3.5, emissions_per_mw: 0.6, fuel_type: "Coal", station_name: "Gen24", index: 0, user_active: false },
  { bus: 72, pg: 0, pmax: 300, cost_per_mw: 2.8, emissions_per_mw: 0.4, fuel_type: "Gas", station_name: "Gen72", index: 1, user_active: false },
  { bus: 73, pg: 0, pmax: 250, cost_per_mw: 3.2, emissions_per_mw: 0.5, fuel_type: "Hydro", station_name: "Gen73", index: 2, user_active: false }
];

function fetchAllScenarios() {
  console.log("Using mock generators for demo");
  currentGenerators = mockGenerators;
  renderGenerators(mockGenerators);
}

function renderInactiveGeneratorCards() {
  const container = document.getElementById("generator-list");
  container.innerHTML = "";
  mockGenerators.forEach(gen => {
    container.appendChild(createGeneratorCard(gen));
  });
}

const mockLines = [
  { from_bus: 38, to_bus: 37, flow: 900, rate_a: 1000 },
  { from_bus: 95, to_bus: 96, flow: 700, rate_a: 1000 },
  { from_bus: 96, to_bus: 97, flow: 500, rate_a: 900 },
  { from_bus: 77, to_bus: 82, flow: 300, rate_a: 700 },
  { from_bus: 82, to_bus: 96, flow: 950, rate_a: 1000 },
  { from_bus: 94, to_bus: 95, flow: 850, rate_a: 950 },
  { from_bus: 93, to_bus: 94, flow: 620, rate_a: 900 },
  { from_bus: 94, to_bus: 100, flow: 880, rate_a: 1000 },
  { from_bus: 92, to_bus: 94, flow: 790, rate_a: 1000 },
  { from_bus: 92, to_bus: 100, flow: 640, rate_a: 1000 },
  { from_bus: 100, to_bus: 104, flow: 540, rate_a: 1000 },
  { from_bus: 104, to_bus: 105, flow: 490, rate_a: 900 },
  { from_bus: 105, to_bus: 106, flow: 520, rate_a: 950 },
  { from_bus: 106, to_bus: 108, flow: 310, rate_a: 800 },
  { from_bus: 108, to_bus: 109, flow: 150, rate_a: 500 },
  { from_bus: 109, to_bus: 110, flow: 450, rate_a: 1000 },
  { from_bus: 110, to_bus: 112, flow: 300, rate_a: 700 },
  { from_bus: 112, to_bus: 113, flow: 250, rate_a: 600 },
  { from_bus: 113, to_bus: 115, flow: 730, rate_a: 900 },
  { from_bus: 115, to_bus: 116, flow: 910, rate_a: 950 }
];

function getLineId(line) {
  const a = Math.min(line.from_bus, line.to_bus);
  const b = Math.max(line.from_bus, line.to_bus);
  return `Line_Bus${a}_Bus${b}`;
}

function getLoadColor(pct) {
  return d3.interpolateYlOrRd(pct);  // 0.0 → yellow, 1.0 → red
}

function renderLineCards(lines) {
  const container = document.getElementById("line-scroll");
  container.innerHTML = "";

  lines.forEach(line => {
    const pct = line.rate_a > 0 ? line.flow / line.rate_a : 0;
    const color = getLoadColor(pct);
    const card = document.createElement("div");

    card.className = "line-card";
    card.style.background = color;
    card.style.margin = "4px";
    card.style.padding = "6px";
    card.style.borderRadius = "6px";
    card.style.color = pct > 0.6 ? "white" : "black";
    card.style.cursor = "pointer";

    card.innerHTML = `Line ${line.from_bus} → ${line.to_bus}<br>${Math.round(pct * 100)}% load`;

    card.addEventListener("mouseenter", () => {
  const id = getLineId(line);
  d3.select(`#${CSS.escape(id)}`).classed("hovered", true);
  d3.select(`#load-${CSS.escape(id)}`).classed("hovered", true);
});

card.addEventListener("mouseleave", () => {
  const id = getLineId(line);
  d3.select(`#${CSS.escape(id)}`).classed("hovered", false);
  d3.select(`#load-${CSS.escape(id)}`).classed("hovered", false);
});


    container.appendChild(card);
  });
}


function createGeneratorCard(gen) {
  const genId = `Gen${gen.bus}`;
  const card = document.createElement("div");
  card.className = "generator-card";
  card.textContent = `${gen.station_name} (Bus ${gen.bus}) — ${gen.pmax} MW`;
  card.style.padding = "6px";
  card.style.margin = "4px";
  card.style.border = "1px solid #ccc";
  card.style.borderRadius = "6px";
  card.style.background = "#fff";
  card.style.color = "#000";
  card.style.cursor = "pointer";

  function updateCardStyle() {
    if (selectedGeneratorId === genId) {
      card.style.border = "2px solid #00f";
      card.style.background = "#ddeeff";
    } else {
      card.style.border = "1px solid #ccc";
      card.style.background = "#fff";
    }
  }

  card.addEventListener("mouseenter", () => {
    d3.selectAll(".map-gen").classed("hovered", d => d.id === genId);
  });

  card.addEventListener("mouseleave", () => {
    d3.selectAll(".map-gen").classed("hovered", false);
  });

  card.addEventListener("click", () => {
    selectedGeneratorId = selectedGeneratorId === genId ? null : genId;
    renderInactiveGeneratorCards(); // re-render to refresh styles
    d3.selectAll(".map-gen").classed("selected", d => d.id === selectedGeneratorId);
  });

  updateCardStyle();
  return card;
}

window.addEventListener("DOMContentLoaded", () => {
  renderInactiveGeneratorCards();
});

function renderInactiveGeneratorCards() {
  const container = document.getElementById("generator-list");
  container.innerHTML = "";
  mockGenerators.forEach(gen => {
    container.appendChild(createGeneratorCard(gen));
  });
}
  const mapContainer = d3.select("#map-panel")
    .html("") // clear placeholder text
    .append("svg")
    .attr("width", "100%")
    .attr("height", "100%")
    .attr("viewBox", `0 0 ${svgWidth} ${svgHeight}`)
    .attr("preserveAspectRatio", "xMidYMid meet");

  const zoomGroup = mapContainer.append("g").attr("id", "zoom-group");

  // Enable zooming
 const zoomBehavior = d3.zoom()
  .scaleExtent([0.2, 5])
  .on("zoom", (event) => {
    zoomGroup.attr("transform", event.transform);
  });

mapContainer.call(zoomBehavior);

// Set initial zoom OUT
const initialZoom = d3.zoomIdentity
  .translate(svgWidth * 0.2, svgHeight * 0.2)  // shift toward top-left
  .scale(0.4);                                // zoomed way out

mapContainer.call(zoomBehavior.transform, initialZoom);

  Promise.all([
    fetch("/new-tests/full_nodes.json").then(res => res.json()),
    fetch("/new-tests/full_lines.json").then(res => res.json())
  ]).then(([nodes, lines]) => {
    
    
    // Draw lines first
   zoomGroup.selectAll("path.line")
  .data(lines)
  .enter()
  .append("path")
  .attr("class", "map-line")
  .attr("id", d => d.id)
  .attr("d", d => d.d)
  .attr("stroke", "black")
  .attr("stroke-width", 2)
  .attr("fill", "none");

  // Overlay load indicators (rectangles)
zoomGroup.selectAll("rect.line-load")
  .data(lines)
  .enter()
  .append("rect")
  .attr("class", "line-load-indicator")
  .attr("id", d => `load-${d.id}`)
  .attr("width", 50)
  .attr("height", 50)
  .attr("fill", d => {
    const match = mockLines.find(l => getLineId(l) === d.id);
    const pct = match ? match.flow / match.rate_a : 0;
    return getLoadColor(pct);
  })
  .attr("x", d => {
    const bbox = document.getElementById(d.id)?.getBBox();
    return bbox ? bbox.x + bbox.width / 2 - 2.5 : 0;
  })
  .attr("y", d => {
    const bbox = document.getElementById(d.id)?.getBBox();
    return bbox ? bbox.y + bbox.height / 2 - 2.5 : 0;
  });

// After drawing paths, add colored loading rectangles at midpoint
setTimeout(() => {
  const lineRects = zoomGroup.selectAll("rect.line-load-indicator")
    .data(lines, d => d.id);  // ensure unique match

  lineRects.enter()
    .append("rect")
    .attr("class", "line-load-indicator")
    .attr("id", d => `load-${d.id}`)
    .attr("width", 6)
    .attr("height", 6)
    .attr("fill", d => {
      const match = currentLines.find(l => getLineId(l) === d.id);
      const pct = match ? match.flow / match.rate_a : 0;
      return getLoadColor(pct);
    })
    .attr("stroke", "black")
    .attr("stroke-width", 0.5)
    .attr("x", d => {
      const path = document.getElementById(d.id);
      return path ? path.getPointAtLength(path.getTotalLength() / 2).x - 3 : 0;
    })
    .attr("y", d => {
      const path = document.getElementById(d.id);
      return path ? path.getPointAtLength(path.getTotalLength() / 2).y - 3 : 0;
    });

  lineRects.exit().remove(); // Just in case
}, 0);

console.group("🧵 Line Matching Debug");
console.log("Map line IDs from full_lines.json:");
lines.slice(0, 10).forEach(l => console.log("→", l.id));

console.log("Mock line IDs:");
mockLines.slice(0, 10).forEach(l => console.log("→", getLineId(l)));

console.groupEnd();



    // Draw nodes
   // ========== Generators (Circles) ==========
zoomGroup.selectAll("circle.generator")
  .data(nodes.filter(d => d.type === "generator"))
  .enter()
  .append("circle")
  .attr("class", "map-gen")
  .attr("id", d => d.id)
  .attr("cx", d => d.x)
  .attr("cy", d => d.y)
  .attr("r", 20)
  .attr("fill", "green")
  .attr("stroke", "black")
  .attr("stroke-width", 0.5);

// ========== Loads (Triangles) ==========
zoomGroup.selectAll("path.load")
  .data(nodes.filter(d => d.type === "load"))
  .enter()
  .append("path")
  .attr("class", "map-load")
  .attr("id", d => d.id)
  .attr("d", d => {
    const size = 10;
    const x = d.x, y = d.y;
    return `M ${x},${y - size} L ${x - size},${y + size} L ${x + size},${y + size} Z`;
  })
  .attr("fill", "blue")
  .attr("stroke", "black")
  .attr("stroke-width", 0.5);

// ========== Buses (Rotated Rectangles) ==========
zoomGroup.selectAll("rect.bus")
  .data(nodes.filter(d => d.type === "bus"))
  .enter()
  .append("rect")
  .attr("class", "map-bus")
  .attr("id", d => d.id)
  .attr("x", d => d.x)
  .attr("y", d => d.y)
  .attr("width", d => d.width)
  .attr("height", d => d.height)
  .attr("fill", "gray")
  .attr("stroke", "black")
  .attr("stroke-width", 0.5)
  .attr("transform", d => {
    // Only apply transform if there's a rotation
    if (typeof d.rotate === "number" && d.rotate !== 0 && d.rotateX !== null && d.rotateY !== null) {
      return `rotate(${d.rotate}, ${d.rotateX}, ${d.rotateY})`;
    }
    return null;
  });





      zoomGroup.selectAll("text.label")
  .data(nodes)
  .enter()
  .append("text")
  .attr("x", d => d.x + 7)
  .attr("y", d => d.y + 3)
  .text(d => d.id.includes("Gen") ? d.id : "")
  .attr("font-size", "6px")
  .attr("fill", "#222");
  });



  
// Call after DOM and map are ready
window.addEventListener("DOMContentLoaded", () => {
  renderInactiveGeneratorCards();
  renderLineCards(mockLines);
});

card.addEventListener("mouseenter", () => {
  const id = `Gen${gen.bus}`;
  d3.selectAll(".map-gen")
    .classed("hovered", d => d.id === id);
});

card.addEventListener("mouseleave", () => {
  d3.selectAll(".map-gen").classed("hovered", false);
});

</script>


</body>
</html>
