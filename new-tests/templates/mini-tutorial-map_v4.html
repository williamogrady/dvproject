<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DV Project – MapView Tutorial (v4)</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg: #f0f4f3;
      --ink: #0f172a;
      --green: #22c55e;
      --accent: #4caf50;
      --map-card: #e8eceb;
      --map-stroke: #cdd5d2;
      --bus-fill: #a3b2ae;
      --bus-stroke: #66736f;
      --line: #9aa7a3;
      --block-off: #e5e7eb;
      --block-on: #22c55e;
    }
    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Figtree', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }
    .wrap{ width: 100%; max-width: 980px; display: grid; gap: 10px; }
    header{ text-align: center; }
    h1{ margin: 0; font-size: 1.2rem; font-weight: 700; opacity: .75; }

    /* Stage = full map */
    .stage{
      background: var(--bg);
      border-radius: 14px;
      overflow: hidden;
      min-height: 520px;
      position: relative;
      border: 1px solid rgba(0,0,0,.06);
    }

    /* Big centered HUD */
    .hud-top{
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      display: grid; gap: 6px;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    .hud-target{ font-size: 1.6rem; font-weight: 900; color: var(--accent); }
    .hud-total{ font-size: 1.3rem; font-weight: 800; color: #111; }

    .map-shell{
      width: 100%; height: 100%;
      background: var(--bg);
      position: relative;
    }

    /* SVG map card */
    .map-card{ fill: var(--map-card); stroke: var(--map-stroke); stroke-width: 2; }

    /* Buses + connections */
    .bus{ fill: var(--bus-fill); stroke: var(--bus-stroke); stroke-width: 1.2; rx: 4; ry: 4; }
    .bus-line{ stroke: var(--line); stroke-width: 2.5; }

    /* Generators (perfect rounded squares) */
    .gen{ }
    .gen-rect{ fill: #fff; stroke: #222; stroke-width: 1.4; rx: 10; ry: 10; }

    /* Internal blocks stacked as rows (vertical stack) */
    .gblock{ stroke: rgba(0,0,0,.12); stroke-width: 1; rx: 4; ry: 4; cursor: pointer; }
    .gblock.off{ fill: var(--block-off); }
    .gblock.on{ fill: var(--block-on); stroke: rgba(34,197,94,.6); }

    .map-hint{
      position: absolute;
      bottom: 10px; left: 12px;
      font-size: 12px; color: #334155;
      background: rgba(0,0,0,.08);
      padding: 4px 8px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>MapView Tutorial – Adjust generator blocks on the map</h1>
    </header>

    <section class="stage">
      <div class="hud-top">
        <div id="hudTarget" class="hud-target">Target: 400 MW</div>
        <div><span class="hud-total">Current: </span><span id="hudTotal" class="hud-total">0 MW</span></div>
      </div>
      <div class="map-shell">
        <svg id="map" width="100%" height="100%" viewBox="0 0 900 600" aria-label="Mini map">
          <defs>
            <clipPath id="mapClip"><rect x="40" y="40" width="820" height="520" rx="12" ry="12"/></clipPath>
          </defs>
          <g id="root">
            <rect class="map-card" x="40" y="40" width="820" height="520" rx="12" ry="12"/>
            <!-- Decorative land islands -->
            <g opacity=".35" clip-path="url(#mapClip)">
              <ellipse cx="260" cy="220" rx="110" ry="70" fill="#dfe6e4"/>
              <ellipse cx="640" cy="360" rx="140" ry="90" fill="#dfe6e4"/>
              <ellipse cx="420" cy="420" rx="90" ry="60" fill="#dfe6e4"/>
            </g>

            <!-- Buses -->
            <g id="buses" clip-path="url(#mapClip)"></g>
            <!-- Lines -->
            <g id="lines" clip-path="url(#mapClip)"></g>
            <!-- Generators -->
            <g id="gens" clip-path="url(#mapClip)"></g>
          </g>
        </svg>
        <div class="map-hint">Scroll to zoom • Drag inside map to pan (bounded)</div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    (function(){
      const targetMW = 400;
      const hudTarget = document.getElementById('hudTarget');
      const hudTotal = document.getElementById('hudTotal');
      if (hudTarget) hudTarget.textContent = "Target: " + targetMW + " MW";

      const svg = d3.select('#map');
      const root = d3.select('#root');
      const gBuses = d3.select('#buses');
      const gLines = d3.select('#lines');
      const gGens  = d3.select('#gens');

      const W = 900, H = 600;
      const inner = {x:40,y:40,w:820,h:520};

      // Mini topology: buses and gens, with explicit connections
      const buses = [
        { id:'Bus-1', x: 240, y: 230, w: 40, h: 10 },
        { id:'Bus-2', x: 620, y: 360, w: 40, h: 10 },
        { id:'Bus-3', x: 420, y: 430, w: 40, h: 10 },
      ];

      const gens = [
        // Each gen has a square side S and 3 internal blocks stacked vertically
        { id:'Gen-A', x: 200, y: 180, S: 56, level: 2, max: 3, bus:'Bus-1' },
        { id:'Gen-B', x: 580, y: 315, S: 56, level: 1, max: 3, bus:'Bus-2' },
        { id:'Gen-C', x: 380, y: 380, S: 56, level: 0, max: 3, bus:'Bus-3' },
      ];

      function totalMW(){
        return gens.reduce((s,g) => s + g.level*100, 0);
      }

      // Draw buses
      gBuses.selectAll('rect.bus')
        .data(buses, d=>d.id)
        .join('rect')
        .attr('class','bus')
        .attr('x', d=>d.x - d.w/2)
        .attr('y', d=>d.y - d.h/2)
        .attr('width', d=>d.w)
        .attr('height', d=>d.h)
        .attr('rx', 4).attr('ry', 4);

      // Draw connection lines (gen center to its bus center)
      gLines.selectAll('line.bus-line')
        .data(gens, d=>d.id)
        .join('line')
        .attr('class','bus-line')
        .attr('x1', d=>d.x)
        .attr('y1', d=>d.y)
        .attr('x2', d=>{
          const b = buses.find(b=>b.id===d.bus); return b ? b.x : d.x;
        })
        .attr('y2', d=>{
          const b = buses.find(b=>b.id===d.bus); return b ? b.y : d.y;
        });

      // Draw generators as perfect rounded squares with internal vertical blocks
      const gSel = gGens.selectAll('g.gen')
        .data(gens, d=>d.id)
        .join(enter => {
          const g = enter.append('g').attr('class','gen').attr('data-id', d=>d.id);

          g.append('rect')
            .attr('class','gen-rect')
            .attr('x', d=>d.x - d.S/2)
            .attr('y', d=>d.y - d.S/2)
            .attr('width', d=>d.S)
            .attr('height', d=>d.S)
            .attr('rx', 10).attr('ry', 10);

          // internal blocks container (3 rows)
          g.each(function(d){
            const pad = 8, gap = 6;
            const cols = 1;           // single column
            const rows = d.max;       // stacked vertically
            const cellW = d.S - pad*2;
            const cellH = (d.S - pad*2 - gap*(rows-1)) / rows;
            for (let r=0; r<rows; r++){
              const cx = d.x - d.S/2 + pad;
              const cy = d.y - d.S/2 + pad + r*(cellH + gap);
              d3.select(this).append('rect')
                .attr('class', 'gblock ' + (r < d.level ? 'on':'off'))
                .attr('x', cx).attr('y', cy)
                .attr('width', cellW).attr('height', cellH)
                .on('click', ()=>{
                  const target = r+1;
                  d.level = (target===1 && d.level===1) ? 0 : target;
                  render();
                });
            }
          });

          return g;
        });

      function render(){
        // update block fills
        gSel.each(function(d){
          let idx = 0;
          d3.select(this).selectAll('rect.gblock')
            .attr('class', function(){
              const cls = 'gblock ' + (idx < d.level ? 'on':'off'); idx++; return cls;
            });
        });
        // totals
        if (hudTotal) hudTotal.textContent = totalMW() + " MW";
      }

      // Zoom/pan with bounds (cannot leave map card)
      const zoom = d3.zoom()
        .extent([[0,0],[W,H]])
        .translateExtent([[inner.x, inner.y],[inner.x+inner.w, inner.y+inner.h]])
        .scaleExtent([0.9, 6])
        .on('zoom', (e)=> root.attr('transform', e.transform));

      svg.call(zoom);

      // initial
      render();
      const init = d3.zoomIdentity.scale(1.1);
      svg.transition().duration(450).call(zoom.transform, init);
    })();
  </script>
</body>
</html>
