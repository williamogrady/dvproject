<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chevron Flow Map (Reset)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    svg {
      width: 100%;
      height: 100%;
      background: #1e1e1e;
    }
    .chevron {
      fill: red;
      opacity: 0.8;
    }
    .line {
      stroke: #888;
      stroke-width: 2;
      fill: none;
    }
    .bus {
      fill: #666;
    }
    .gen {
      fill: #4caf50;
    }
  </style>
</head>
<body>
  <div style="position:absolute; top:10px; left:10px; z-index:10">
    <button onclick="setMode('generator')">Generator Mode</button>
    <button onclick="setMode('flow')">Flow Mode</button>
  </div>
  <svg id="map" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
    <g id="zoom-layer"></g>
  </svg>

  <script>
    const svg = d3.select("#map");
    const zoomLayer = svg.select("#zoom-layer");

    let buses = [], lines = [], generators = [], mode = "generator";

    const zoomBehavior = d3.zoom()
      .scaleExtent([0.2, 2])
      .on("zoom", event => zoomLayer.attr("transform", event.transform));

    svg.call(zoomBehavior);

    function setMode(newMode) {
      mode = newMode;
      draw();
    }

    function chevronPath(scale) {
      return `M 0 ${-scale} L ${scale} 0 L 0 ${scale} L ${-scale} 0 Z`;
    }

    function drawChevrons() {
      lines.forEach(line => {
        const fromType = buses.find(b => b.id === line.from)?.type;
        const toType = buses.find(b => b.id === line.to)?.type;
        if (fromType !== "bus" || toType !== "bus") return;

        const pathEl = document.getElementById(line.id);
        if (!pathEl) return;

        const totalLength = pathEl.getTotalLength();
        const pointA = pathEl.getPointAtLength(totalLength * 0.45);
        const pointB = pathEl.getPointAtLength(totalLength * 0.55);

        const dx = pointB.x - pointA.x;
        const dy = pointB.y - pointA.y;
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;

        const scale = mode === "flow" ? 6 + Math.random() * 4 : 6;
        const opacity = mode === "flow" ? 1 : 0.1;

        zoomLayer.append("path")
          .attr("class", "chevron")
          .attr("d", chevronPath(scale))
          .attr("opacity", opacity)
          .attr("transform", `translate(${(pointA.x + pointB.x)/2}, ${(pointA.y + pointB.y)/2}) rotate(${angle})`);
      });
    }

    function draw() {
      zoomLayer.selectAll("*").remove();

      zoomLayer.selectAll("path.line")
        .data(lines)
        .enter()
        .append("path")
        .attr("class", "line")
        .attr("id", d => d.id)
        .attr("d", d => d.d);

      zoomLayer.selectAll("rect.bus")
        .data(buses.filter(d => d.type === "bus"))
        .enter()
        .append("rect")
        .attr("class", "bus")
        .attr("x", d => d.x - 5)
        .attr("y", d => d.y - 5)
        .attr("width", 10)
        .attr("height", 10);

      zoomLayer.selectAll("circle.gen")
        .data(buses.filter(d => d.type === "generator"))
        .enter()
        .append("circle")
        .attr("class", "gen")
        .attr("cx", d => d.x)
        .attr("cy", d => d.y)
        .attr("r", d => mode === "generator" ? 12 : 6);

      drawChevrons();
    }

    Promise.all([
      fetch("/new-tests/full_nodes.json").then(res => res.json()),
      fetch("/new-tests/full_lines.json").then(res => res.json())
    ]).then(([nodeData, lineData]) => {
      buses = nodeData;
      lines = lineData;
      lines.forEach(line => {
        const match = line.id.match(/^Line_(Bus\d+)_(Bus\d+)$/);
        if (match) {
          line.from = match[1];
          line.to = match[2];
        }
      });
      draw();
    });
  </script>
</body>
</html>
