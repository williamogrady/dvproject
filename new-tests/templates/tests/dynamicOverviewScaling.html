<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Overview Bar with Full Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: sans-serif;
      background: #1e1e1e;
      color: #eee;
      overflow: hidden;
    }

    #map-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    svg#map {
      width: 100%;
      height: 100%;
      background: #dfcfcf;
    }

    #overview {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: #2c2c2c;
      padding: 10px 16px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .overview-card {
      background: #1f1f1f;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      min-width: 100px;
      text-align: center;
    }

    .overview-card:hover {
      background: #3c3c3c;
    }

    .overview-label {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 4px;
    }

    .overview-value {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }

.overview-card.selected {
  border: 2px solid white; /* fallback if no class added */
}

.overview-card.scale-power.selected {
  border-color: #4caf50;
}

.overview-card.scale-cost.selected {
  border-color: #f9a825;
}

.overview-card.scale-emissions.selected {
  border-color: #c62828;
}

  </style>
</head>
<body>
  <div id="map-container">
    <svg id="map">
      <g id="zoom-layer"></g>
    </svg>

<div id="overview">
  <div class="overview-card" id="scale-power">
    <div class="overview-label">Scale</div>
    <div class="overview-value">Power</div>
  </div>
  <div class="overview-card" id="scale-cost">
    <div class="overview-label">Scale</div>
    <div class="overview-value">Cost</div>
  </div>
  <div class="overview-card" id="scale-emissions">
    <div class="overview-label">Scale</div>
    <div class="overview-value">Emissions</div>
  </div>
  <div class="overview-card" id="scale-reset">
    <div class="overview-label">Reset</div>
    <div class="overview-value">Normal</div>
  </div>
</div>

  <script>
    const svg = d3.select("#map");
    const zoomLayer = svg.select("#zoom-layer");
    let currentScaleMode = null;

const zoomBehavior = d3.zoom()
  .scaleExtent([0.2, 5])
  .on("zoom", (event) => {
    zoomGroup.attr("transform", event.transform);
  });

svg.call(zoomBehavior);



const zoomGroup = svg.append("g").attr("id", "zoom-group");

let currentGenerators = [];

   // === Fetch and Draw Map ===
Promise.all([
  fetch("/new-tests/full_nodes.json").then(res => res.json()),
  fetch("/new-tests/full_lines.json").then(res => res.json()),
  fetch("/api/generators").then(res => res.json())  // <-- ✅ Add this
]).then(([nodes, lines, generatorData]) => {
  currentGenerators = generatorData;
  
  zoomGroup.selectAll("path.map-line")
    .data(lines)
    .enter()
    .append("path")
    .attr("class", "map-line")
    .attr("id", d => d.id)
    .attr("d", d => d.d)
    .attr("stroke", "#888")
    .attr("stroke-width", 1.5)
    .attr("fill", "none");

zoomGroup.selectAll("rect.map-bus")
  .data(nodes.filter(d => d.type === "bus"))
  .enter()
  .append("rect")
  .attr("class", "map-bus")
  .attr("id", d => d.id)
  .attr("x", d => d.x - d.width / 2)
  .attr("y", d => d.y - d.height / 2)
  .attr("width", d => d.width)
  .attr("height", d => d.height)
  .attr("fill", "#666")
  .attr("stroke", "#000")
  .attr("stroke-width", 0.8)
  .attr("transform", d => {
    if (d.rotate && d.rotateX !== null && d.rotateY !== null) {
      return `rotate(${d.rotate}, ${d.rotateX}, ${d.rotateY})`;
    }
    return null;
  });

zoomGroup.selectAll("path.map-load")
  .data(nodes.filter(d => d.type === "load"))
  .enter()
  .append("path")
  .attr("class", "map-load")
  .attr("id", d => d.id)
  .attr("d", d => {
    const size = 20;
    const x = d.x;
    const y = d.y;
    return `M ${x},${y - size / 2} L ${x - size / 2},${y + size / 2} L ${x + size / 2},${y + size / 2} Z`;
  })
  .attr("transform", d => {
    if (d.rotate && d.rotateX !== null && d.rotateY !== null) {
      return `rotate(${d.rotate}, ${d.rotateX}, ${d.rotateY})`;
    }
    return null;
  });

    // Generators - drawn last to ensure they are on top
  zoomGroup.selectAll("circle.map-gen")
    .data(nodes.filter(d => d.type === "generator"))
    .enter()
    .append("circle")
    .attr("class", "map-gen")
    .attr("id", d => d.id)
    .attr("cx", d => d.x)
    .attr("cy", d => d.y)
    .attr("r", 30)
      .attr("fill", d => {
  const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
  return match && match.pg > 0 ? "#4caf50" : "#000000";
    console.log("🚀 Drawing generators on startup with conditional fill: green if pg > 0, else white"); 
})


function scaleGeneratorsBy(metric) {
  currentScaleMode = metric;

  const values = currentGenerators.map(g => g[metric]);
  const scale = d3.scaleLinear()
    .domain([0, d3.max(values)])
    .range([5, 50]);

  const color = {
    pmax: "#4caf50",          // green
    cost_per_mw: "#f9a825", // yellow
    emissions_per_mw: "#c62828" // red
  }[metric];

  console.log(`🎯 Drawing generators with fill color: ${color} for metric: ${metric}`);

  d3.selectAll(".map-gen")
    .transition()
    .duration(500)
    .attr("r", d => {
      const gen = currentGenerators.find(g => `Gen${g.bus}` === d.id);
      return gen ? scale(gen[metric]) : 10;
    })
    .attr("fill", color);

  highlightButton(metric);
}




function resetGeneratorSizes() {
  currentScaleMode = null;

  d3.selectAll(".map-gen")
    .transition()
    .duration(500)
    .attr("r", 30)
    .attr("fill", "black");

  highlightButton(null);
}

function highlightButton(mode) {
  const buttons = {
    pmax: "scale-power",
    cost_per_mw: "scale-cost",
    emissions_per_mw: "scale-emissions"
  };

  // Always clear
  document.querySelectorAll(".overview-card").forEach(btn => {
    btn.classList.remove("selected", "scale-power", "scale-cost", "scale-emissions");
  });

  // Re-apply only if mode is defined
  if (mode && buttons[mode]) {
    const id = buttons[mode];
    const btn = document.getElementById(id);
    btn.classList.add("selected");

    if (mode === "pmax") btn.classList.add("scale-power");
    if (mode === "cost_per_mw") btn.classList.add("scale-cost");
    if (mode === "emissions_per_mw") btn.classList.add("scale-emissions");
  }
}




  // === Hover & Selection Sync
  d3.selectAll(".map-gen")
    .on("mouseenter", function (event, d) {
      d3.select(this).classed("hovered", true);
    })
    .on("mouseleave", function () {
      d3.select(this).classed("hovered", false);
    });

  // Optional: add generator label
  /*
  zoomGroup.selectAll("text.map-gen-label")
    .data(nodes.filter(d => d.type === "generator"))
    .enter()
    .append("text")
    .attr("x", d => d.x + 6)
    .attr("y", d => d.y + 3)
    .attr("font-size", "6px")
    .text(d => d.id); */


        document.getElementById("scale-power").onclick = () => scaleGeneratorsBy("pmax");
document.getElementById("scale-cost").onclick = () => scaleGeneratorsBy("cost_per_mw");
document.getElementById("scale-emissions").onclick = () => scaleGeneratorsBy("emissions_per_mw");
document.getElementById("scale-reset").onclick = resetGeneratorSizes;
});

// === Update generator colors on scenario load ===
function updateMapGeneratorsFromScenario() {
  const genNodes = d3.selectAll(".map-gen");

  genNodes.each(function(d) {
    const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
    const isOn = match && match.pg > 0;
    const isSelected = d.id === selectedGeneratorId;

    d3.select(this)
      .attr("fill", isOn ? "#4caf50" : "white")
      .attr("stroke", isSelected ? "blue" : "black")
      .attr("stroke-width", isSelected ? 2.5 : 1.2);
  });

  d3.selectAll(".map-gen-highlight").remove();

  if (selectedGeneratorId) {
    const selected = d3.select(`#${CSS.escape(selectedGeneratorId)}`);
    if (!selected.empty()) {
      const { cx, cy } = selected.node();
      const r = +selected.attr("r");

      d3.select("#zoom-group")
        .append("circle")
        .attr("class", "map-gen-highlight")
        .attr("cx", cx.baseVal.value)
        .attr("cy", cy.baseVal.value)
        .attr("r", r + 6)
        .attr("fill", "none")
        .attr("stroke", "#00f")
        .attr("stroke-width", 3)
        .attr("pointer-events", "none");
    }
  }
  
}


  </script>
</body>
</html>
