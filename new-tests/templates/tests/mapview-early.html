<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MapView Prototype (9/6)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/new-tests/circle.ico">
  <link rel="stylesheet" href="/css/listview-core.css" /> <!-- Reuse listView styling -->
  <link rel="stylesheet" href="/css/mapview-core.css" /> 
 <style>
.overview-bar {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  background: var(--bg-card);
  padding: 10px 16px;
  border-radius: 16px;
  z-index: 10;
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}
.overview-card {
  background: var(--bg-gencard);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  min-width: 100px;
  text-align: center;
  transition: all 0.2s ease;
}
.overview-card:hover {
  background: #3c3c3c;
}
.overview-card.selected {
  border: 2px solid white;
}
.overview-card.scale-power.selected { border-color: #4caf50; }
.overview-card.scale-cost.selected { border-color: #f9a825; }
.overview-card.scale-emissions.selected { border-color: #c62828; }

    #admin-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 15;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #theme-toggle {
      margin-top: 5px;
    }

  </style>
</head>

<body class="dark-theme">
  <div id="map-container">
    <svg id="map">
      <g id="zoom-layer"></g>
    </svg>

    <div class="overview-card" id="overview">
      <div class="label">Power</div>
      <div id="overview-power">–</div>
      <div class="label">Emissions</div>
      <div id="overview-emissions">–</div>
      <div class="label">Cost</div>
      <div id="overview-cost">–</div>
      <div class="label">Scenario</div>
        <div id="overview-scenario">–</div>
      <button onclick="window.location.href='/list'">Switch to List View</button>
    </div>

    <div class="bubble" id="bubble"></div>

    <div id="admin-controls">
  <div class="label">Admin Controls</div>

  <label for="scenario-select" style="font-size: 0.8rem;">Load Scenario:</label>
  <select id="scenario-select" style="margin-bottom: 6px; width: 100%;"></select>
  <button id="reset-button">🔁 Reset</button>

  <button id="theme-toggle" class="theme-button" style="margin-top: 8px;">🌙 Dark Mode</button>
</div>
  <script>
  const svg = d3.select("#map");
const zoomLayer = svg.select("#zoom-layer");
const bubble = d3.select("#bubble");
let selectedGen = null;
let selectedGenData = null;

let currentGenerators = [];
let currentScenarioId = "";
let availableScenarios = [];
let currentScaleMode = null;

function scaleGeneratorsBy(metric) {
  currentScaleMode = metric;

  const values = currentGenerators.map(g => g[metric]);
  const scale = d3.scaleLinear()
    .domain([0, d3.max(values)])
    .range([10, 100]);

  const color = {
    pmax: "#4caf50", // green
    cost_per_mw: "#f9a825", // yellow
    emissions_per_mw: "#c62828" // red
  }[metric];

  console.log(`🎯 Drawing generators with fill color: ${color} for metric: ${metric}`);

  d3.selectAll(".map-gen")
    .transition()
    .duration(500)
    .attr("r", d => {
      const gen = currentGenerators.find(g => `Gen${g.bus}` === d.id);
      return gen ? scale(gen[metric]) : 10;
    })
    .attr("fill", color);

  highlightButton(metric);
}

function resetGeneratorSizes() {
  currentScaleMode = null;

  d3.selectAll(".map-gen")
    .transition()
    .duration(500)
    .attr("r", d => {
      const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
      const sizeScale = d3.scaleSqrt()
        .domain(d3.extent(currentGenerators, g => g.pmax))
        .range([10, 100]);
      return match ? sizeScale(match.pmax) : 10;
    })
    .attr("fill", d => {
      const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
      return match && match.pg > 0 ? "#4caf50" : "white";
    });

  highlightButton(null);
}

function highlightButton(mode) {
  const buttons = {
    pmax: "scale-power",
    cost_per_mw: "scale-cost",
    emissions_per_mw: "scale-emissions"
  };

  document.querySelectorAll(".overview-card").forEach(btn => {
    btn.classList.remove("selected", "scale-power", "scale-cost", "scale-emissions");
  });

  if (mode && buttons[mode]) {
    const id = buttons[mode];
    const btn = document.getElementById(id);
    btn.classList.add("selected");

    if (mode === "pmax") btn.classList.add("scale-power");
    if (mode === "cost_per_mw") btn.classList.add("scale-cost");
    if (mode === "emissions_per_mw") btn.classList.add("scale-emissions");
  }
}


async function fetchAllScenarios() {
  const res = await fetch("/api/scenarios");
  const data = await res.json();

  availableScenarios = data;

  // Pick default
  const defaultScenario = data.find(s => s.scenario_id === "E_final") || data[0];

  if (defaultScenario) {
    currentScenarioId = defaultScenario.scenario_id;
    populateScenarioDropdown(data, currentScenarioId);
    await loadScenario(currentScenarioId);
  }
}

function populateScenarioDropdown(scenarios, selectedId) {
  const select = document.getElementById("scenario-select");
  select.innerHTML = "";

  scenarios.forEach(s => {
    const option = document.createElement("option");
    option.value = s.scenario_id;
    option.textContent = s.title || s.scenario_id;
    if (s.scenario_id === selectedId) option.selected = true;
    select.appendChild(option);
  });
}

async function loadScenario(scenarioId) {
  const res = await fetch(`/api/scenario/${scenarioId}`);
  const data = await res.json();
  currentScenarioId = scenarioId;
  currentScenarioData = data;
  currentGenerators = data.generators;

  renderOverview(currentGenerators);
  updateMapGeneratorsFromScenario();

  // Update scenario title in overview
  document.getElementById("overview-scenario").textContent = currentScenarioData?.title || currentScenarioId;

  if (selectedGenData) {
    const updated = currentGenerators.find(g => g.index === selectedGenData.index);
    const newCard = createGeneratorCard(updated, updated.pmax);
    bubble.html("").node().appendChild(newCard);
  }
}

let selectedGeneratorId = null;

const connectorLine = svg.append("line")
  .attr("class", "connector-line")
  .style("display", "none");

const zoom = d3.zoom()
  .scaleExtent([0.3, 5])
  .on("zoom", (event) => {
    zoomLayer.attr("transform", event.transform);
    updateConnector();  // <- redraw line during zoom/pan
  });

svg.call(zoom);

// Initial zoom transform
const centerX = window.innerWidth / 2;
const centerY = window.innerHeight / 2;
const mapCenterX = 1400;
const mapCenterY = 1100;

Promise.all([
  fetch("/api/scenario/E_final").then(res => res.json()),
  fetch("/new-tests/full_nodes.json").then(res => res.json())
]).then(([scenarioData, nodeData]) => {
  currentGenerators = scenarioData.generators;
  currentScenarioId = "E_final";

  const gens = nodeData.filter(d => d.type === "generator");

  // ✅ Recalculate sizeScale now that currentGenerators is ready
  const sizeScale = d3.scaleSqrt()
    .domain(d3.extent(currentGenerators, g => g.pmax))
    .range([10, 100]);

  console.log("🧪 currentGenerators sample:", currentGenerators.slice(0, 3));
  const extent = d3.extent(currentGenerators, g => g.pmax);
  console.log("🧪 size extent:", extent);

  currentGenerators.forEach(g => {
    if (g.pmax == null || isNaN(g.pmax)) {
      console.warn("⚠️ Bad pmax value for:", g);
    }
  });

  zoomLayer.selectAll("circle.generator")
    .data(gens)
    .enter()
    .append("circle")
    .attr("class", "generator map-gen")
    .attr("cx", d => d.x)
    .attr("cy", d => d.y)
    .attr("r", d => {
      const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
      if (!match) return 10;
      console.log("🔍 Gen", match.name, "pmax =", match.pmax, "size =", sizeScale(match.pmax));
      return sizeScale(match.pmax);
    })
    .attr("fill", d => {
      const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
      return match && match.pg > 0 ? "#4caf50" : "white";
    })
    .attr("stroke", "white")
    .attr("stroke-width", 2)
    .on("click", function(event, d) {
      event.stopPropagation();

      d3.selectAll(".generator").attr("stroke", "white").attr("stroke-width", 2);
      d3.select(this).attr("stroke", "#42a5f5").attr("stroke-width", 4);

      selectedGen = d;
      selectedGenData = d;

      const match = currentGenerators.find(g => `Gen${g.bus}` === d.id);
      if (!match) return;

      const card = createGeneratorCard(match, match.pmax);
      const bubbleX = event.pageX + 10;
      const bubbleY = event.pageY - 20;

      bubble
        .style("display", "block")
        .style("left", `${bubbleX}px`)
        .style("top", `${bubbleY}px`)
        .html("")
        .node().appendChild(card);

      document.getElementById("scale-power").onclick = () => scaleGeneratorsBy("pmax");
      document.getElementById("scale-cost").onclick = () => scaleGeneratorsBy("cost_per_mw");
      document.getElementById("scale-emissions").onclick = () => scaleGeneratorsBy("emissions_per_mw");
      document.getElementById("scale-reset").onclick = resetGeneratorSizes;
      updateConnector();
    });
});


// ✅ Outside the generator .on("click")
svg.on("click", function(event) {
  if (event.target.tagName === "svg") {
    d3.selectAll(".generator").attr("stroke", "white").attr("stroke-width", 2);
    bubble.style("display", "none").html("");
    connectorLine.style("display", "none");
    selectedGen = null;
  }
});


  function renderOverview(gens) {
  const totalPower = gens.reduce((sum, g) => sum + g.pg, 0);
  const totalCost = gens.reduce((sum, g) => sum + g.pg * g.cost_per_mw, 0);
  const totalEmissions = gens.reduce((sum, g) => sum + g.pg * g.emissions_per_mw, 0);

  document.getElementById("overview-power").textContent = `${totalPower.toFixed(0)} MW`;
  document.getElementById("overview-cost").textContent = `$${totalCost.toFixed(2)}`;
  document.getElementById("overview-emissions").textContent = `${totalEmissions.toFixed(0)} CO₂`;
}

function createGeneratorCard(gen, maxPmax) {
  const genId = `Gen${gen.bus}`;
  const locked = currentScenarioData?.locked_generators?.includes(genId);
  const disabled = currentScenarioData?.disabled_generators?.includes(genId);

  const card = document.createElement("div");
  card.className = `generator-card ${locked ? "locked" : ""} ${disabled ? "disabled" : ""}`.trim();


    function getCostColor(cost) {
  if (cost < 2) return 'green';
  if (cost < 5) return 'yellow';
  if (cost < 7) return 'orange';
  return 'red';
}

function getEmissionColor(emissions) {
  if (emissions < 0.5) return 'green';
  if (emissions < 1.0) return '#88cc88';
  if (emissions < 1.5) return '#bbbb88';
  return 'gray';
}

  // LEFT SECTION
  const left = document.createElement("div");
  const fuelColors = {
    coal: '#614732', gas: '#4a7838', hydro: '#4faad1', combined: '#ad7a37',
  };
  left.style.backgroundColor = fuelColors[gen.fuel_type.toLowerCase()] || 'var(--bg-soft)';
  left.className = "gen-section left";
  left.innerHTML = `
    <div class="gen-name">${gen.station_name}</div>
    <div class="gen-number">Bus ${gen.bus}</div>
    <div class="gen-type">${gen.fuel_type}</div>`;

  // CENTER SECTION
  const center = document.createElement("div");
  center.className = "gen-section center";
  center.innerHTML = `
    <div class="gen-power"><div class="power-label">Power</div></div>
    <div class="gen-impact-row">
      <div class="gen-cost impact-wrapper">
        <div class="impact-box" style="background:${getCostColor(gen.cost_per_mw)};">💲</div>
        <div class="impact-label">${gen.cost_per_mw.toFixed(1)} / MW</div>
      </div>
      <div class="gen-emissions impact-wrapper">
        <div class="impact-box" style="background:${getEmissionColor(gen.emissions_per_mw)};">☁️</div>
        <div class="impact-label">${gen.emissions_per_mw.toFixed(1)} / MW</div>
      </div>
    </div>`;

  const powerContainer = center.querySelector(".gen-power");
  const blockRow = document.createElement("div");
  blockRow.className = "power-block-row";
  powerContainer.appendChild(blockRow);

  // BUILD BLOCKS
  let levels = [];
  let current = 0;
  while (current + 100 <= gen.pmax) {
    current += 100;
    levels.push(current);
  }
  if (current < gen.pmax) levels.push(gen.pmax);

  function createBlock(level, isHalf = false) {
    const block = document.createElement("div");
    block.className = "power-block";
    block.style.width = isHalf ? `10px` : `20px`;
    block.style.height = "20px";
    block.style.borderRadius = "4px";
    block.style.background = gen.pg >= level - 50 ? "var(--gen-on)" : "var(--gen-off)";
    block.style.border = "1px solid rgba(0, 0, 0, 0.2)";
    block.title = `${level} MW`;

    if (!locked && !disabled) {
      block.style.cursor = "pointer";
      block.addEventListener("mousedown", () => {
        const percent = Math.min(100, Math.round((level / gen.pmax) * 100));
        fetch(`/api/set_generation/${gen.index}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ percent, user_active: true })
        })
          .then(res => res.json())
          .then(data => {
            currentGenerators = data.generators;
            renderOverview(currentGenerators);
            updateMapGeneratorsFromScenario();
          });
      });
    }

    return block;
  }

  levels.forEach((level, i) => {
    const isRemainder = (i === levels.length - 1 && level !== 100 * levels.length);
    const isHalf = isRemainder && (gen.pmax % 100 <= 50);
    blockRow.appendChild(createBlock(level, isHalf));
  });

  const maxLabel = document.createElement("span");
  maxLabel.style.marginLeft = "8px";
  maxLabel.style.fontSize = "0.75rem";
  maxLabel.style.color = "var(--text-light)";
  maxLabel.textContent = `${gen.pmax.toFixed(0)} MW max`;
  blockRow.appendChild(maxLabel);

  // RIGHT SECTION (empty — no + / - buttons)
  const right = document.createElement("div");
  right.className = "gen-section right";
  card.appendChild(left);
  card.appendChild(center);
  card.appendChild(right);

  return card;
}
function updateMapGeneratorsFromScenario() {
  // If a scale mode is active, use it
  if (currentScaleMode) {
    scaleGeneratorsBy(currentScaleMode);
  } else {
    resetGeneratorSizes();
  }

  // Also reapply stroke and highlight logic
  const genNodes = d3.selectAll(".map-gen");

  genNodes.each(function(d) {
    const isSelected = d.id === selectedGeneratorId;
    d3.select(this)
      .attr("stroke", isSelected ? "blue" : "black")
      .attr("stroke-width", isSelected ? 2.5 : 1.2);
  });

  d3.selectAll(".map-gen-highlight").remove();

  if (selectedGeneratorId) {
    const selected = d3.select(`#${CSS.escape(selectedGeneratorId)}`);
    if (!selected.empty()) {
      const { cx, cy } = selected.node();
      const r = +selected.attr("r");

      d3.select("#zoom-layer")
        .append("circle")
        .attr("class", "map-gen-highlight")
        .attr("cx", cx.baseVal.value)
        .attr("cy", cy.baseVal.value)
        .attr("r", r + 6)
        .attr("fill", "none")
        .attr("stroke", "#00f")
        .attr("stroke-width", 3)
        .attr("pointer-events", "none");
    }
  }
}



function updateConnector() {
  if (!selectedGen || !selectedGenData) return;

  const transform = d3.zoomTransform(svg.node());
  const bubbleRect = bubble.node().getBoundingClientRect();

  const genX = transform.applyX(selectedGenData.x);
  const genY = transform.applyY(selectedGenData.y);
  const bubbleX = bubbleRect.left + bubbleRect.width / 2;
  const bubbleY = bubbleRect.top + bubbleRect.height / 2;

  connectorLine
    .attr("x1", genX)
    .attr("y1", genY)
    .attr("x2", bubbleX)
    .attr("y2", bubbleY)
    .style("display", "block");
}

document.getElementById("scenario-select").addEventListener("change", (e) => {
  loadScenario(e.target.value);
});

document.getElementById("reset-button").addEventListener("click", () => {
  loadScenario(currentScenarioId);
});

window.addEventListener("DOMContentLoaded", () => {
  fetchAllScenarios();
});

  </script>
</body>
</html>
