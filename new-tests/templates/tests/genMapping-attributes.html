<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>genMapping attributes</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    svg {
      border: 1px solid #ccc;
      background: #f8f8f8;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<h2>genMapping attributes test</h2>

<div class="controls">
  <div>
    <label>Size represents:</label>
    <select id="map-size">
      <option value="maxPW">Max Power</option>
      <option value="currentPW">Current Power</option>
      <option value="cost">Cost</option>
      <option value="emissions">Emissions</option>
    </select>
  </div>
  <div>
    <label>Hue represents:</label>
    <select id="map-hue">
      <option value="cost">Cost</option>
      <option value="maxPW">Max Power</option>
      <option value="currentPW">Current Power</option>
      <option value="emissions">Emissions</option>
    </select>
  </div>
  <div>
    <label>Saturation represents:</label>
    <select id="map-saturation">
      <option value="emissions">Emissions</option>
      <option value="cost">Cost</option>
      <option value="maxPW">Max Power</option>
      <option value="currentPW">Current Power</option>
    </select>
  </div>
  <div>
    <label>Stroke width represents:</label>
    <select id="map-stroke">
      <option value="currentPW">Current Power</option>
      <option value="emissions">Emissions</option>
      <option value="cost">Cost</option>
      <option value="maxPW">Max Power</option>
    </select>
  </div>
</div>

<svg id="viz" width="900" height="300"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
  const generators = [
    { id: "Gen1", x: 115, y: 143, maxPW: 360, currentPW: 317, cost: 90.39, emissions: 1.69, fillLevel: 0.5 },
    { id: "Gen2", x: 184, y: 150, maxPW: 325, currentPW: 96, cost: 42.53, emissions: 1.93, fillLevel: 0.5 },
    { id: "Gen3", x: 234, y: 110, maxPW: 279, currentPW: 244, cost: 96.02, emissions: 1.59, fillLevel: 0.5 },
    { id: "Gen4", x: 296, y: 103, maxPW: 420, currentPW: 43, cost: 35.97, emissions: 0.82, fillLevel: 0.5 },
    { id: "Gen5", x: 384, y: 67, maxPW: 460, currentPW: 391, cost: 16.22, emissions: 0.75, fillLevel: 0.5 },
    { id: "Gen6", x: 466, y: 70, maxPW: 197, currentPW: 14, cost: 12.94, emissions: 1.25, fillLevel: 0.5 },
    { id: "Gen7", x: 509, y: 70, maxPW: 315, currentPW: 205, cost: 46.29, emissions: 0.57, fillLevel: 0.5 },
    { id: "Gen8", x: 576, y: 130, maxPW: 482, currentPW: 343, cost: 49.78, emissions: 1.51, fillLevel: 0.5 },
    { id: "Gen9", x: 673, y: 96, maxPW: 493, currentPW: 198, cost: 48.56, emissions: 1.9, fillLevel: 0.5 },
    { id: "Gen10", x: 734, y: 77, maxPW: 102, currentPW: 43, cost: 99.63, emissions: 0.76, fillLevel: 0.5 }
  ];

  const svg = d3.select("#viz");
  const defs = svg.append("defs");

  const group = svg.selectAll("g")
    .data(generators)
    .enter()
    .append("g")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .style("cursor", "ns-resize")
    .call(d3.drag()
      .on("drag", function (event, d) {
        d.fillLevel -= event.dy / 60;
        d.fillLevel = Math.max(0, Math.min(1, d.fillLevel));
        updateFill(d);
      }));

  defs.selectAll("clipPath")
    .data(generators)
    .enter()
    .append("clipPath")
    .attr("id", d => `clip-${d.id}`)
    .append("circle")
    .attr("cx", 0)
    .attr("cy", d => 30 - 30 * d.fillLevel)
    .attr("r", d => 30 * d.fillLevel);

  group.append("circle")
    .attr("class", "outer-ring")
    .attr("r", 30)
    .attr("fill", "none")
    .attr("stroke", "#000");

  group.append("circle")
    .attr("class", "fill-circle")
    .attr("clip-path", d => `url(#clip-${d.id})`);

  function updateFill(d) {
    defs.select(`#clip-${d.id} circle`)
      .attr("cy", 30 - 30 * d.fillLevel)
      .attr("r", 30 * d.fillLevel);
  }

  function updateVisuals() {
    const sizeAttr = document.getElementById("map-size").value;
    const hueAttr = document.getElementById("map-hue").value;
    const satAttr = document.getElementById("map-saturation").value;
    const strokeAttr = document.getElementById("map-stroke").value;

    const sizeScale = d3.scaleLinear()
      .domain(d3.extent(generators, d => d[sizeAttr]))
      .range([15, 40]);

    const hueScale = d3.scaleLinear()
      .domain(d3.extent(generators, d => d[hueAttr]))
      .range([0, 360]);

    const satScale = d3.scaleLinear()
      .domain(d3.extent(generators, d => d[satAttr]))
      .range([40, 100]);

    const strokeScale = d3.scaleLinear()
      .domain(d3.extent(generators, d => d[strokeAttr]))
      .range([1, 8]);

    group.selectAll(".fill-circle")
      .data(generators)
      .attr("r", d => sizeScale(d[sizeAttr]))
      .attr("fill", d => `hsl(${hueScale(d[hueAttr])}, ${satScale(d[satAttr])}%, 50%)`);

    group.selectAll(".outer-ring")
      .data(generators)
      .attr("r", d => sizeScale(d[sizeAttr]))
      .attr("stroke-width", d => strokeScale(d[strokeAttr]));

    defs.selectAll("clipPath circle")
      .data(generators)
      .attr("r", d => sizeScale(d[sizeAttr]) * d.fillLevel)
      .attr("cy", d => sizeScale(d[sizeAttr]) - sizeScale(d[sizeAttr]) * d.fillLevel);
  }

  updateVisuals();
  d3.selectAll("select").on("change", updateVisuals);
</script>

</body>
</html>
