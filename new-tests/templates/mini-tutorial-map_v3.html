<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DV Project – MapView Tutorial (All-in-Map)</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg: #f0f4f3;
      --ink: #0f172a;
      --faint: #6b7280;
      --green: #22c55e;
      --accent: #4caf50;
      --panel-border: rgba(0,0,0,.08);
      --map-card: #e8eceb;
      --map-stroke: #cdd5d2;
    }
    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Figtree', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    .wrap{ width: 100%; max-width: 980px; display: grid; gap: 16px; }
    header{ padding: 0 2px; }
    h1{ margin: 0; font-size: 1.8rem; font-weight: 700; }
    p.lead{ margin: 8px 0 0; color: var(--faint); }
    .target{ margin-top: 8px; font-size: 1.2rem; font-weight: 800; color: var(--accent); }

    /* Stage = map only */
    .stage{
      background: var(--bg);
      border: none;
      border-radius: 16px;
      padding: 0;
      min-height: 460px;
    }
    .map-shell{
      background: var(--bg);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      min-height: 460px;
    }
    .overlay-hud{
      position: absolute;
      top: 10px; left: 12px;
      display: grid; gap: 6px;
      z-index: 2;
    }
    .pill{
      display: inline-grid;
      grid-auto-flow: column;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 12px;
      color: #111;
    }
    .pill .dot{ width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
    .map-hint{
      position: absolute;
      bottom: 10px; left: 12px;
      color: #334155;
      background: rgba(0,0,0,.08);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      z-index: 2;
    }

    /* Map visuals */
    .gen-rect{ stroke: #222; stroke-width: 1.4; fill: #ffffff; }
    .gen-label{ fill: #111; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
    .focus-ring{ fill: none; stroke: #42a5f5; stroke-width: 2; stroke-dasharray: 3 3; opacity: .85; }
    .block-cell{ stroke: rgba(0,0,0,.12); stroke-width: 1; rx: 3; ry: 3; }
    .block-off{ fill: #e5e7eb; }
    .block-on{ fill: var(--green); stroke: rgba(34,197,94,.6); }

  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>MapView Tutorial</h1>
      <p class="lead">All info is contained in the map. Zoom, pan, and adjust generator blocks directly.</p>
      <div class="target">Goal: Match the target by toggling blocks (each block = 100 MW).</div>
    </header>

    <section class="stage">
      <div class="map-shell">
        <!-- HUD inside the map -->
        <div class="overlay-hud">
          <div class="pill"><span class="dot"></span><span id="targetText">Target: 400 MW total</span></div>
          <div class="pill"><span>Total:</span><span id="totalMW">0 MW</span></div>
        </div>

        <svg id="map" width="100%" height="100%" viewBox="0 0 900 600" aria-label="Miniature map">
          <defs>
            <clipPath id="mapClip"><rect x="40" y="40" width="820" height="520" rx="12" ry="12"/></clipPath>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.25"/>
            </filter>
          </defs>
          <g id="zoomRoot">
            <!-- map card -->
            <rect x="40" y="40" width="820" height="520" fill="#e8eceb" stroke="#cdd5d2" stroke-width="2" rx="12"/>
            <g id="islands" opacity=".35" clip-path="url(#mapClip)">
              <ellipse cx="250" cy="220" rx="110" ry="70" fill="#dfe6e4"/>
              <ellipse cx="640" cy="360" rx="140" ry="90" fill="#dfe6e4"/>
              <ellipse cx="420" cy="420" rx="90" ry="60" fill="#dfe6e4"/>
            </g>

            <!-- lines -->
            <g id="lines" stroke="#aab4b1" stroke-width="3" opacity=".8" clip-path="url(#mapClip)">
              <line x1="250" y1="220" x2="420" y2="420" />
              <line x1="420" y1="420" x2="640" y2="360" />
              <line x1="250" y1="220" x2="640" y2="360" />
            </g>

            <!-- generators -->
            <g id="generators" clip-path="url(#mapClip)"></g>
          </g>
        </svg>
        <div class="map-hint">Scroll to zoom • Drag inside map to pan</div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    (function(){
      const targetMW = 400;
      const targetText = document.getElementById('targetText');
      const totalMWEl  = document.getElementById('totalMW');
      if (targetText) targetText.textContent = "Target: " + targetMW + " MW total";

      const svg = d3.select('#map');
      const root = d3.select('#zoomRoot');
      const gLayer = d3.select('#generators');

      const W = 900, H = 600;
      const inner = {x:40,y:40,w:820,h:520};

      // dataset
      const gens = [
        { id:'GEN-A', x: 220, y: 190, w: 54, h: 42, level: 2, max: 3, name:'GEN-A' },
        { id:'GEN-B', x: 600, y: 330, w: 54, h: 42, level: 1, max: 3, name:'GEN-B' },
        { id:'GEN-C', x: 410, y: 420, w: 54, h: 42, level: 0, max: 3, name:'GEN-C' },
      ];

      // zoom with bounds (can't pan outside inner map card)
      const zoom = d3.zoom()
        .extent([[0,0],[W,H]])
        .translateExtent([[inner.x, inner.y],[inner.x+inner.w, inner.y+inner.h]])
        .scaleExtent([0.9, 6])
        .on('zoom', (e)=>{
          const {x,y,k} = e.transform;
          root.attr('transform', `translate(${x},${y}) scale(${k})`);
        });
      svg.call(zoom);

      // generator draw
      const gSel = gLayer.selectAll('g.gen')
        .data(gens, d => d.id)
        .join(enter => {
          const g = enter.append('g').attr('class','gen').attr('data-id', d=>d.id);

          // base rect
          g.append('rect')
            .attr('class','gen-rect')
            .attr('x', d=>d.x).attr('y', d=>d.y)
            .attr('width', d=>d.w).attr('height', d=>d.h)
            .attr('rx', 8).attr('ry', 8)
            .attr('filter', 'url(#shadow)');

          // blocks (3)
          const pad = 6, gap = 6;
          g.each(function(d){
            const cellW = (d.w - pad*2 - gap*2)/3;
            const cellH = d.h - pad*2;
            const y = d.y + pad;
            for (let i=0;i<d.max;i++){
              const x = d.x + pad + i*(cellW + gap);
              d3.select(this).append('rect')
                .attr('class', 'block-cell ' + (i<d.level ? 'block-on':'block-off'))
                .attr('x', x).attr('y', y).attr('width', cellW).attr('height', cellH)
                .attr('rx', 4).attr('ry', 4)
                .on('click', ()=>{
                  const target = i+1;
                  d.level = (target===1 && d.level===1) ? 0 : target;
                  render();
                });
            }
          });

          // label (optional, above)
          g.append('text')
            .attr('class','gen-label')
            .attr('x', d=>d.x + d.w/2)
            .attr('y', d=>d.y - 8)
            .attr('text-anchor','middle')
            .text(d=>d.name);

          // focus ring (optional visual when hovering)
          g.append('rect')
            .attr('class','focus-ring')
            .attr('x', d=>d.x-6).attr('y', d=>d.y-6)
            .attr('width', d=>d.w+12).attr('height', d=>d.h+12)
            .attr('rx', 10).attr('ry', 10)
            .attr('opacity', 0);

          g.on('mouseenter', function(){ d3.select(this).select('.focus-ring').attr('opacity', 1); })
           .on('mouseleave', function(){ d3.select(this).select('.focus-ring').attr('opacity', 0); });

          return g;
        });

      function render(){
        // update block fills
        gSel.each(function(d){
          const pad = 6, gap = 6;
          const cellW = (d.w - pad*2 - gap*2)/3;
          const cellH = d.h - pad*2;
          let idx = 0;
          d3.select(this).selectAll('rect.block-cell')
            .attr('class', function(){ 
              const c = 'block-cell ' + (idx<d.level ? 'block-on' : 'block-off');
              idx++; return c;
            })
            .attr('width', cellW).attr('height', cellH);
        });

        // total MW HUD
        const total = gens.reduce((sum,g)=> sum + g.level*100, 0);
        totalMWEl.textContent = total + " MW";
      }

      // initial states
      render();

      // initial transform: slight zoom to fit region
      const init = d3.zoomIdentity.scale(1.1).translate(0,0);
      svg.transition().duration(500).call(zoom.transform, init);
    })();
  </script>
</body>
</html>
