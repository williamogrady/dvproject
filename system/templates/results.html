<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>User Test Runner</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b1220; color: #eef2ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      #runner-root { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
      .top { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.08); }
      .title { font-weight: 800; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
      .progress { font-size: 12px; opacity: .8; background: #1f2937; padding: 6px 10px; border-radius: 999px; }
      #timer { font-variant-numeric: tabular-nums; font-weight: 900; }
      .stage { position: relative; overflow: hidden; background: #0f172a; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .3s ease; background: #0b1220; }
      #stage.visible { opacity: 1; }
      .veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,12,22,0.9); z-index: 3; }
      .panel { max-width: 720px; text-align: center; }
      .panel h1 { margin: 0 0 8px; font-size: 28px; }
      .panel p { margin: 0 0 16px; opacity: .9; }
      .panel button { background: #22c55e; color: #052e16; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 900; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="runner-root">
      <div class="top">
        <div class="title">
          User Test
          <span class="progress" id="progress">Complete</span>
        </div>
        <div id="timer">--:--</div>
      </div>
      <div class="stage">
        <iframe id="stage" referrerpolicy="no-referrer"></iframe>
        <div class="veil" id="veil">
          <div class="panel">
            <h1>Results</h1>
            <p>You have reached the results.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Minimal runner (your /static/js/testRunner.js) -->
    <script type="module" src="/static/js/results.js"></script>
  </body>
</html>
