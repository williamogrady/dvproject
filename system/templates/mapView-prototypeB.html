:root {

#constraint-lines { color: #b00; }


    body {

#overview {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 20;

#overview-top {

}

}


#overview-status-section {
  display: grid;
  grid-template-columns: 3fr 2fr 2fr;

}

#overview-task-section, 
#overview-task-section * {

}

/* ----------------------------------------
   GENERAL CARD STRUCTURE + TYPOGRAPHY
---------------------------------------- */

.overview-card {
  font-family: "Figtree", sans-serif;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0.6rem 0.75rem;
  box-sizing: border-box;
  cursor: pointer;
  height: 100%;
  transition: background 0.2s ease, transform 0.2s ease;
}

.overview-card:hover {
  background: #f5f5f5;
  transform: translateY(-1px);
}

.overview-label {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 0.25rem;
  color: #333;
}

.overview-value {
  font-size: 1.1rem;
  font-weight: bold;
  color: #000;
}

.overview-status {
  font-size: 0.7rem;
  text-align: center;
  color: #666;
  margin-top: auto;
}


/* ----------------------------------------
   SPECIFIC CARD LAYOUTS (CLEANED)
---------------------------------------- */

/* Column placement + vertical spacing model */
#scale-power {
  grid-column: 1 / 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

#scale-lines {
  grid-column: 2 / 3;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

#scale-cost,
#scale-emissions {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: calc(50% - 0.25rem);
}

#right-column {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  height: 100%;
  grid-column: 3 / 4;
}

/* ----------------------------------------
   LINES CARD (Rows 3 & 4)
---------------------------------------- */

/* Horizontal rows (single line); no visible scrollbars/gray boxes */
#scale-lines .row-rich,
#scale-lines .row-top {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 6px 2px;
  background: transparent;
  /* Hide scrollbars cross-browser */
  scrollbar-width: none;              /* Firefox */
  -ms-overflow-style: none;           /* IE/Edge legacy */
}


#scale-lines .row-rich { margin-bottom: 8px; }  /* tweak 6–12px to taste */
#scale-lines .row-top  { margin-top: 8px; }

#scale-lines .row-rich::-webkit-scrollbar,
#scale-lines .row-top::-webkit-scrollbar {
  width: 0 !important;
  height: 0 !important;               /* Chrome/Safari */
}
#scale-lines .row-rich::-webkit-scrollbar-thumb,
#scale-lines .row-top::-webkit-scrollbar-thumb,
#scale-lines .row-rich::-webkit-scrollbar-track,
#scale-lines .row-top::-webkit-scrollbar-track,
#scale-lines .row-rich::-webkit-scrollbar-corner,
#scale-lines .row-top::-webkit-scrollbar-corner {
  background: transparent !important;
}

/* Optional tiny title when overloaded == 0 */
#scale-lines .row-top-title {
  font-size: 0.72rem;
  color: #64748b;
  font-weight: 700;
  margin-right: 8px;
  white-space: nowrap;
}

/* Cards — shared base */
#scale-lines .line-card {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 22px 1fr;   /* left icon + right text */
  align-items: center;
  background: #fff;
  border-radius: 10px;
  padding: 4px 6px;
  border: 1.5px solid var(--accent, #e5e7eb); /* JS sets --accent/borderColor */
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  position: relative;
}

/* Row 3 cards 20% smaller */
#scale-lines .row-rich .line-card {
  width: 88px;          /* was ~110px */
  height: 26px;         /* was ~32px */
  padding: 3px 5px;     /* slightly tighter */
  grid-template-columns: 18px 1fr; /* shrink left icon column */
}

/* Slightly smaller type only for Row 3 */
#scale-lines .row-rich .line-card .load  { font-size: 0.74rem; }
#scale-lines .row-rich .line-card .delta { font-size: 0.60rem; }


#scale-lines .row-top .line-card {   /* Row 4 */
  width: 80px;
  height: 24px;
  border-radius: 8px;
  padding: 3px 5px;
  grid-template-columns: 18px 1fr;
  box-shadow: 0 1px 2px rgba(0,0,0,.05);
}

/* Inner layout + type */
#scale-lines .line-card .left  { display:flex; align-items:center; justify-content:center; }
#scale-lines .line-card .right { display:grid; grid-template-rows: 1fr auto; padding-left: 4px; }
#scale-lines .line-card .load  { font-weight: 800; color: #111; font-size: 0.82rem; line-height: 1; }
#scale-lines .row-top .line-card .load { font-size: 0.78rem; }
#scale-lines .line-card .delta { font-weight: 700; line-height: 1; font-size: .68rem; }
.delta.up { color:#c62828; }
.delta.down { color:#2e7d32; }
.delta.neutral { color:#64748b; }

/* Hover: subtle only, no layout shift */
#scale-lines .line-card:hover { background: #f7f9fb; }

/* Remove the old left accent bar entirely */
#scale-lines .line-card::before { content: none !important; }

/* Selection state (keep, but no colored borders) */
.overview-card.selected { border: none; box-shadow: 0 0 0 2px rgba(66,165,245,.18) inset; }
.overview-card.scale-power.selected,
.overview-card.scale-cost.selected,
.overview-card.scale-emissions.selected,
.overview-card.scale-lines.selected { border: none; }




/* ----------------------------------------

---------------------------------------- */

.task-left,

 }

/* ----------------------------------------
   VISUAL FEEDBACK (SELECTED STATES)
---------------------------------------- */

.overview-card.selected {
  border: 2px solid #42a5f5;
}

.overview-card.scale-lines.selected {

}

}

/* ----------------------------------------
   BLOCKS — Power card (responsive)
---------------------------------------- */

/* Space between blocks and fraction text; keep content inside card */
#scale-power .overview-value {
  display: flex;
  flex-direction: column;
  gap: 10px;         /* margin between blocks and the text */
  width: 100%;
  overflow: hidden;  /* prevent any overflow peeking out */
}

/* Power blocks become a responsive grid that auto-wraps */
#overview-power .blocks {
  --cell-min: 22px;  /* JS will tune for huge goals */
  --gap: 6px;
  --block-h: 26px;

  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--cell-min), 1fr));
  gap: var(--gap);
  width: 100%;
  max-width: 100%;   /* remove old 200px clamp */
  height: auto;      /* remove fixed heights */
  align-content: start;
  box-sizing: border-box;
}

/* Each block fills its grid cell */
#overview-power .block {
  width: 100%;
  height: var(--block-h);
  border-radius: 6px;
}

/* Keep your color semantics */
#overview-power .block.full   { background-color: #4caf50; }
#overview-power .block.partial{ background-color: #a5d6a7; }
#overview-power .block.goal   { background-color: #e0e0e0; }
#overview-power .block.over   {
  background-color: #ef5350;
  color: white;
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}

/* ----------------------------------------
   BLOCKS — Legacy styles (scoped AWAY from power)
   (prevents them from overriding the grid above)
---------------------------------------- */
.overview-card:not(#scale-power) .blocks {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  width: 100%;
  max-width: 200px;
}

.overview-card:not(#scale-power) .block {
  width: 18px;
  height: 20px;
  background: #ccc;
  border-radius: 2px;
}

/* --- tokens --- */
:root{
  --card-bg: #fff;
  --card-stroke: #cdd5df;
  --on-stroke: #2e7d32;

  --gen-on: #4caf50;
  --gen-on-dark: #1b5e20;

  --dice-off-stroke: #222;
  --pip-off: #111;
  --pip-on: #fff;

  --emi-ring-w: 10px;          /* ← adjust ring thickness here */
}

/* emissions indicators */
.gen-emi-strip { fill: var(--emi, #4caf50); pointer-events:none; }
.gen-emi-ring  { fill: none; stroke: var(--emi, #4caf50); stroke-width: var(--emi-ring-w); pointer-events:none; }

/* interaction */
.clickable { cursor: pointer; }

/* base card (expanded defaults) */
.gen-card{
  fill: var(--card-bg);
  stroke: var(--card-stroke);
  stroke-width: 1.2;
  shape-rendering: geometricPrecision;
}
.gen-card--on { stroke: var(--on-stroke); stroke-width: 1.6; }

/* dice-mode overrides (declared AFTER .gen-card so they win) */
.gen-card--dice-on  { fill: var(--gen-on) !important;  stroke: var(--gen-on-dark) !important; }
.gen-card--dice-off { fill: #fff !important;           stroke: var(--dice-off-stroke) !important; }

/* dice pips */
.pip-dot { stroke: none; }
.pip-dot.off { fill: var(--pip-off); }
.pip-dot.on  { fill: var(--pip-on); }

/* soft shadow */
.with-soft-shadow { filter: url(#softShadow); }

  /* On/off halo (green when ON) */
.gen-halo-on  { stroke: #2e7d32; stroke-width: 3; fill: none; opacity: 0.95; }
.gen-halo-off { stroke: none; fill: none; opacity: 0; }

/* Locked/disabled overlays */
.gen-locked   { pointer-events: none; }            /* still clickable via icon layer if you want */
.gen-disabled { opacity: 0.35; pointer-events: none; filter: grayscale(0.2); }

.gen-disabled-icon,
.gen-locked-icon {
  font: 700 14px/1.0 system-ui, sans-serif;
  fill: #111;
  paint-order: stroke;
  stroke: rgba(255,255,255,0.8);
  stroke-width: 2px;
}

/* Power card: fraction + "All good!" pill inline */
#overview-power .fraction-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Reuse the same pill styling */
#power-ok-pill.pill-ok {
  background: #4caf50;
  color: #fff;
  font-weight: 700;
  border-radius: 9999px;
  padding: 2px 8px;
  display: none; /* toggled by JS */
  font-size: 0.75rem;
}

/* Legend button + box (copied from ListView) */
.legend-btn{
  background:#fff; color:#111; border:1px solid #d9dee8; border-radius:999px;
  padding:6px 12px; font:600 14px/1 'Figtree', system-ui, sans-serif;
  box-shadow:0 2px 8px rgba(0,0,0,.08); cursor:pointer;
  transition: filter .15s ease, transform .1s ease;
  z-index: 30; /* make sure above map and overlays */
}
.legend-btn:hover{ filter: brightness(.95); }
.legend-btn:active{ transform: translateY(1px); }

.legend-box{
  background:#fff; border:1px solid #d9dee8; border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.16);
  padding:10px; cursor:pointer; user-select:none; z-index:31;
  transform: scale(0.6);
  transform-origin: bottom left;
}
.legend-box img{
  display:block; max-width:min(520px, 70vw); max-height:min(62vh, 640px);
  width:auto; height:auto; border-radius:8px;
}

/* MapView placement: same bottom-left corner the admin bar used */
.mv-corner.legend-btn {
  position: fixed;
  left: 12px;
  bottom: 12px;
}
#mv-legend-panel.legend-box {
  position: fixed;
  left: 12px;
  bottom: 12px;
}

/* === Results overlay (light theme) === */
.results-box {
  min-width: 480px;
  max-width: 640px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);

}

.results-title {

}

.results-table {

}

const FOCUS_FADE_MS   = 320;
const FOCUS_EASE      = d3.easeCubicInOut;

function smoothFade(sel, to, ms = FOCUS_FADE_MS){
  const S = d3.selectAll(sel).interrupt();
  // Animate using inline style so it wins during the transition…
  const t = S.transition().duration(ms).ease(FOCUS_EASE).style("opacity", to);
  // …but when restoring to base, clear inline opacity so CSS (e.g., .gen-disabled) applies again.
  if (to === 1) {
    t.on("end", function(){
      d3.select(this).style("opacity", null).attr("opacity", null);
    });
  }
  return t;
}


// Scale elements while preserving their original transform (no compounding)
function smoothScale(sel, toScale, ms = FOCUS_FADE_MS){
  d3.selectAll(sel).each(function(){
    const node = d3.select(this);
    const baseT = node.attr("data-base-transform")
                || (node.attr("transform") || "").replace(/\s*scale\([^)]+\)/g, "");
    node.attr("data-base-transform", baseT);
    node.interrupt()
        .transition().duration(ms).ease(FOCUS_EASE)
        .attr("transform", `${baseT} scale(${toScale})`);
  });
}

function drawDicePipsCollapsed(containerSel, size, currentMW, maxMW, isOn){
  const grid = 3;
  const cell = size / grid;
  const r = Math.max(4.2, cell * 0.34);

  // Round to your 50 MW half-step logic
  const capMW = roundCapToHalf(maxMW || 0);
  const curMW = Math.min(roundToHalf(currentMW || 0), capMW);

  const capDots = Math.floor(Math.min(9, capMW / 100));  // 100 MW per dot
  const curDots = Math.floor(Math.min(9, curMW / 100));

  const g = containerSel.append("g").attr("class", "dice-pips");

  for (let i = 0; i < capDots; i++) {
    const row = Math.floor(i / grid), col = i % grid;
    const cx = 0 - size/2 + cell*(col + 0.5);
    const cy = 0 - size/2 + cell*(row + 0.5);

    // Decide color by state:
    // - if ON: first curDots are white ("on"), rest black ("off")
    // - if OFF: all black ("off")
    const isFilledNow = isOn && (i < curDots);
    const cls = isFilledNow ? "pip-dot on" : "pip-dot off";

    g.append("circle")
      .attr("class", cls)
      .attr("cx", cx).attr("cy", cy).attr("r", r);
  }
}

// Utilization color for chevrons/circles with real nuance from 10–50%,
// gentle warm-up <60%, orange ~60–85%, red ~85–100%, bright (not maroon) >100%.
function getChevronColor(pct) {
  const p = Math.max(0, +pct || 0);

  // 0–10%: very pale yellow → visibly pale yellow
  if (p <= 0.10) {
    const t = p / 0.10;
    return d3.interpolateRgb("#FFFDE7", "#FFF9C4")(t); // almost white → pale yellow
  }
  // 10–30%: pale yellow → mellow yellow (visible difference vs 10%)
  if (p <= 0.30) {
    const t = (p - 0.10) / 0.20;
    return d3.interpolateRgb("#FFF9C4", "#FFF59D")(t);
  }
  // 30–50%: mellow yellow → warm yellow (clearly deeper than 30%)
  if (p <= 0.50) {
    const t = (p - 0.30) / 0.20;
    return d3.interpolateRgb("#FFF59D", "#FFE082")(t);
  }
  // 50–70%: warm yellow → light orange (begins feeling "active" near 60%)
  if (p <= 0.70) {
    const t = (p - 0.50) / 0.20;
    return d3.interpolateRgb("#FFE082", "#FFB74D")(t);
  }
  // 70–85%: light orange → orange
  if (p <= 0.85) {
    const t = (p - 0.70) / 0.15;
    return d3.interpolateRgb("#FFB74D", "#FF9800")(t);
  }
  // 85–100%: orange → bright red
  if (p <= 1.00) {
    const t = (p - 0.85) / 0.15;
    return d3.interpolateRgb("#FF9800", "#EF5350")(t);
  }
  // >100%: keep bright, pleasant red (no dark maroon)
  const t = Math.min(1, (p - 1) / 0.50); // by 150% we reach slightly lighter bright red
  return d3.interpolateRgb("#EF5350", "#FF6E6E")(t);
}

function formatDuration(ms){

// Normalize to the canonical lo→hi id used by disabledLineSet
function _lineId(L){
  if (L?.id != null) return String(L.id);
  const a = Number(L.from_bus ?? L.from ?? L.i ?? L.bus1 ?? NaN);
  const b = Number(L.to_bus   ?? L.to   ?? L.j ?? L.bus2 ?? NaN);
  if (Number.isFinite(a) && Number.isFinite(b)) {
    const lo = Math.min(a,b), hi = Math.max(a,b);
    return `Line_Bus${lo}_Bus${hi}`;
  }
  return `${a}-${b}`;
}

function getHighestLoadPctAtSubmit(lines = [], scen = window.currentScenarioData){
  const S = (window.disabledLineSet instanceof Set)
    ? window.disabledLineSet
    : (typeof buildDisabledLineSetFromScenario === 'function'
        ? buildDisabledLineSetFromScenario(scen || {})
        : new Set());

  let max = 0;
  for (const L of (lines || [])){
    if (!L) continue;
    // force normalized id so it matches how S is built
    const id = _lineId(L);
    if (S.has(id)) continue;
    const rate = +(L.rate_a ?? L.rateA ?? 0);
    const flow = Math.abs(+(L.flow ?? 0));
    const pct  = rate > 0 ? (flow / rate) * 100 : 0;
    if (Number.isFinite(pct) && pct > max) max = pct;
  }
  return max;
}

// Draws a fresh chevron layer from enriched line data
function drawChevrons(lines, nodes, mode) {
  // --- remove & recreate layer (kept only here to avoid flicker) ---
  d3.select("#chevron-layer").remove();
  const chevronGroup = d3.select("#zoom-group")
    .insert("g", ".map-gen-group") // keep chevrons *below* generators
    .attr("id", "chevron-layer")
    .style("opacity", isPowerFocus() ? 0.2 : 1);

  const isLinesMode = (mode === "lines");

  // --- local fallbacks so this is paste-safe -----------------------
  const ZERO = (window.ZERO_MW ?? 0.1); // treat near-zero as zero (MW)
  const circlePathFn = (typeof circlePath === "function")
    ? circlePath
    : (r) => {
        const rr = Math.max(2, r);
        return `
          M ${-rr},0
          a ${rr},${rr} 0 1,0 ${rr*2},0
          a ${rr},${rr} 0 1,0 ${-rr*2},0
          Z
        `;
      };

  // --- helpers -----------------------------------------------------
  function fallbackMidAndAngle(line) {
    const from = nodes.find(n => n.id === line.source && n.type === "bus");
    const to   = nodes.find(n => n.id === line.target && n.type === "bus");
    if (!from || !to) return { midX: 0, midY: 0, angleDeg: 0, ok: false };
    let angleDeg = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI;
    if ((line.flow_signed ?? 0) < 0) angleDeg += 180; // flip on negative flow
    return { midX: (from.x + to.x) / 2, midY: (from.y + to.y) / 2, angleDeg, ok: true };
  }

  function pathMidAndAngle(line) {
    const pathEl = document.getElementById(line.id);
    if (!pathEl || typeof pathEl.getTotalLength !== "function") {
      return fallbackMidAndAngle(line);
    }
    const L  = pathEl.getTotalLength();
    const A  = pathEl.getPointAtLength(Math.max(0, L * 0.45));
    const B  = pathEl.getPointAtLength(Math.min(L, L * 0.55));
    const mid= pathEl.getPointAtLength(L * 0.50);
    let angleDeg = Math.atan2(B.y - A.y, B.x - A.x) * 180 / Math.PI;
    if ((line.flow_signed ?? 0) < 0) angleDeg += 180; // flip on negative flow
    return { midX: mid.x, midY: mid.y, angleDeg, ok: true };
  }

  function getMidAndAngle(line) {
    const r = pathMidAndAngle(line);
    return r.ok ? r : fallbackMidAndAngle(line);
  }

  function defaultChevronPath(size) {
    // simple triangle; 'size' roughly equals width
    const h = Math.max(6, size * 0.6);
    const w = Math.max(8, size);
    return `M0,${-h/2} L${w},0 L0,${h/2} Z`;
  }

  // --- data join (Bus↔Bus only) -----------------------------------
  const sel = chevronGroup.selectAll("path.chevron")
    .data(lines.filter(isBusBusLine), d => d.id);

  // ENTER
  const enter = sel.enter().append("path")
    .attr("class", "chevron")
    .attr("id", d => `chev-${d.id}`)
    .attr("stroke", "#111")
    .attr("stroke-width", 0.4)
    .style("pointer-events", "auto")
    .on("mouseenter", (event, d) => showChevronTooltip(event, d))
    .on("mousemove",  (event, d) => showChevronTooltip(event, d))
    .on("mouseleave", hideChevronTooltip);

  // UPDATE + ENTER
  enter.merge(sel)
    .each(function(line) {
      // utilization based on magnitude only
      const flowSigned = +((line.flow ?? line.flow_signed) || 0);
      const loadPct = (line.rate_a > 0) ? (Math.abs(flowSigned) / line.rate_a) : 0;
      const color   = getChevronColor(loadPct);

      // size: slightly larger in "lines" mode
      const base  = 10;
      const scale = isLinesMode ? (1 + 0.6 * Math.max(0, loadPct)) : 1;
      const size  = Math.max(8, base * scale);

      // --- Direction + placement (robust) ---
      const g = getMidAndAngle(line); // uses line.id → midX, midY, angleDeg (already flips on negative flow)
      if (!g || !Number.isFinite(g.midX) || !Number.isFinite(g.midY)) return;

      let { midX, midY, angleDeg } = g;

      // Static correction for visually reversed SVG paths
      if (line.flipped) angleDeg += 180;

      // Final transform
      const _T = `translate(${midX}, ${midY}) rotate(${angleDeg})`;
      console.log("[chev]", line.id,
      "flipped=", !!line.flipped,
      "angle=", ((angleDeg % 360)+360)%360  // normalize to [0,360)
    );



      // zero-flow → draw a circle; otherwise a chevron
      const isZero = (Math.abs(flowSigned) < ZERO) || (loadPct === 0);
      const pathD = isZero
        ? circlePathFn(size * 0.45)
        : (typeof chevronPath === "function") ? chevronPath(size) : defaultChevronPath(size);

      // subtle opacity for tiny flows (optional)
      const op = loadPct < 0.05 ? 0.2 : loadPct < 0.15 ? 0.6 : 1.0;

      d3.select(this)
      .datum(line)
      .attr("d", pathD)
      .attr("fill", color)
      .attr("opacity", 1) // ← constant; no more low-load fading
      .attr("data-x", midX)
      .attr("data-y", midY)
      .attr("data-shape", isZero ? "circle" : "chevron")
      .attr("transform", _T)
      .attr("data-base-transform", _T);

      // optional: store pct for debugging
      this.setAttribute("data-pct", loadPct.toFixed(3));
    });

  // EXIT
  sel.exit().remove();
}

// Centered chevron path (fallback if map's chevronPath isn't available)
function miniChevronPathCentered(s) {
  const L = s * 2, W = s * 1.2;           // fuller shoulders
  const hL = L / 2, hW = W / 2;
  return `M ${-hL},${-hW}
          L ${ hL},0
          L ${-hL},${ hW}
          L ${-hL*0.5},0
          Z`;
}

// Mini chevron SVG — centered, sign-aware, visibly wider, 0-flow = circle
function miniChevron(color, sizePx, dirSign = 1, flowAbs = 1, zeroThresh = 0.1) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", sizePx);
  svg.setAttribute("height", sizePx);
  svg.setAttribute("viewBox", "-12 -12 24 24");
  svg.style.display = "block";

  // Outer group handles direction (rotate keeps center stable)
  const gRot = document.createElementNS(NS, "g");
  const angle = dirSign < 0 ? 270 : 90; // vertical arrow
  gRot.setAttribute("transform", `rotate(${angle})`);

  // Inner group recenters & widens the glyph
  const gCtr = document.createElementNS(NS, "g");

  // WIDEN factor — 1.5x width (this guarantees a visible change)
  const WIDEN = 1.5;

  // Build path: prefer map's chevronPath so shape matches map chevrons
  const s = 6; // base scale for mini
  const d = (typeof chevronPath === "function")
    ? chevronPath(s)                 // same geometry as map chevrons
    : miniChevronPathCentered(s);    // fallback centered shape

  const path = document.createElementNS(NS, "path");

  if (Math.abs(flowAbs) < (zeroThresh || 0.1)) {
    // Zero-load: draw centered circle
    path.setAttribute("d", "M -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0 Z");
  } else {
    path.setAttribute("d", d);
  }

  path.setAttribute("fill", color);
  path.setAttribute("stroke", "#111");
  path.setAttribute("stroke-width", "0.6"); // a tad bolder for mini size

  // Center the glyph around (0,0) and widen it:
  // Translate left by half its length (assume path runs left→right from 0),
  // then scale X to widen visually.
  //
  // For map chevrons produced by chevronPath(s), the tip is to the right.
  // We normalize by shifting -s (approx half-length) then widen.
  gCtr.setAttribute("transform", `translate(${-s}, 0) scale(${WIDEN}, 1)`);

  gCtr.appendChild(path);
  gRot.appendChild(gCtr);
  svg.appendChild(gRot);
  return svg;
}

function angleFromCanonAndFlow(line) {
  const a0 = +line.from_bus, b0 = +line.to_bus;
  const lo = Math.min(a0, b0), hi = Math.max(a0, b0);
  const canon = (window.__canonDir && window.__canonDir.get(`${lo}|${hi}`)) || [a0, b0];
  const [A, B] = canon; // electrical AB = fbus→tbus

  const base = baseAngleAB(A, B);
  if (!base) return null;

  const signed = +(line.flow_signed ?? line.flow ?? 0);
  const angle = base.deg + (signed < 0 ? 180 : 0);

  return { angle, midX: base.midX, midY: base.midY };
}

// In your refreshChevrons loop, for each line object `L`:
function applyChevronForLine(selection, L) {
  const info = angleFromCanonAndFlow(L);
  if (!info) return;

  const t = `translate(${info.midX}, ${info.midY}) rotate(${info.angle})`;
  selection
    .attr("transform", t)
    .attr("data-base-transform", t);
}


function pingChevron(lineId){
  const chev = d3.select(`#chev-${CSS.escape(lineId)}`);
  if (chev.empty()) return;

  chev.raise();  // ← bring above peers

  const baseT = chev.attr("data-base-transform")
             || (chev.attr("transform") || "").replace(/\s*scale\([^)]+\)/g, "");
  chev.attr("data-base-transform", baseT);

  if (chev.attr("data-animating") === "1") return;
  chev.attr("data-animating", "1");

  // Add/position a one-shot halo
  const layer = d3.select("#chevron-layer");
  const [x, y] = [ +chev.attr("data-x") || 0, +chev.attr("data-y") || 0 ];
  const halo = layer.append("circle")
    .attr("cx", x).attr("cy", y)
    .attr("r", 0)
    .attr("fill", "none")
    .attr("stroke", "#ffd166")
    .attr("stroke-width", 2)
    .attr("opacity", 0.9)
    .lower();

  halo.transition().duration(450).ease(d3.easeCubicOut)
      .attr("r", 34)
      .attr("opacity", 0)
      .remove();

  const MAX_SCALE = 3.0;
  chev.interrupt()
      .attr("transform", `${baseT} scale(1)`)
      .transition().duration(250).ease(d3.easeCubicOut)
        .attr("transform", `${baseT} scale(${MAX_SCALE})`)
      .transition().duration(350).ease(d3.easeCubicIn)
        .attr("transform", `${baseT} scale(1)`)
        .on("end", () => chev.attr("data-animating", null));
}

// === Canonical case118 directions + geometry base ===
async function loadCanonicalDirections(){
  if (window.__canonDir) return window.__canonDir;
  try {
    const r = await fetch('/api/branch-directions');
    const { branches = [] } = await r.json();
    const m = new Map();
    for (const { fbus, tbus } of branches) {
      const lo = Math.min(fbus, tbus), hi = Math.max(fbus, tbus);
      m.set(`${lo}|${hi}`, [fbus, tbus]); // electrical AB = fbus→tbus
    }
    window.__canonDir = m;
    return m;
  } catch (e){
    console.warn('Failed to load canonical directions', e);
    window.__canonDir = new Map();
    return window.__canonDir;
  }
}

function baseAngleAB(A, B){
  const idAB = `Line_Bus${A}_Bus${B}`;
  const idBA = `Line_Bus${B}_Bus${A}`;
  const path = document.getElementById(idAB) || document.getElementById(idBA);
  if (!path || !path.getTotalLength) return null;

  const L   = path.getTotalLength();
  const P1  = path.getPointAtLength(L * 0.45);
  const P2  = path.getPointAtLength(L * 0.55);
  const mid = path.getPointAtLength(L * 0.50);

  let deg = Math.atan2(P2.y - P1.y, P2.x - P1.x) * 180 / Math.PI;
  if (!document.getElementById(idAB)) deg += 180; // only BA path? invert once to represent AB
  return { midX: mid.x, midY: mid.y, deg };
}

function refreshChevrons(liveLines, currentMapMode){
  // Only Bus↔Bus lines from full_lines.json
  const busBusStatic = staticLines.filter(isBusBusLine);

  // 1) sign-aware live index (same as before)
  const liveIdx = new Map();
  for (const l of (liveLines || [])) {
    const signed = +l.flow_signed || 0;
    const rate   = +l.rate_a || 1;
    // forward and reverse keys
    liveIdx.set(`Bus${l.from_bus}|Bus${l.to_bus}`, { flow_signed: signed,  rate_a: rate });
    liveIdx.set(`Bus${l.to_bus}|Bus${l.from_bus}`, { flow_signed: -signed, rate_a: rate });
  }

  // 2) enrich ONLY Bus↔Bus lines
  const enriched = busBusStatic.map(s => {
  const a = +s.source.replace('Bus','');
  const b = +s.target.replace('Bus','');
  const key   = `${Math.min(a,b)}|${Math.max(a,b)}`;
  const canon = (window.__canonDir && window.__canonDir.get(key)) || [a,b];
  const [A,B] = canon;

  // Live flow SIGNED in the AB frame (fbus→tbus)
  const live = liveIdx.get(`Bus${A}|Bus${B}`) || { flow_signed: 0, rate_a: (+s.rate_a || 1) };
  const fs   = +live.flow_signed || 0;
  const rate = +live.rate_a || (+s.rate_a || 1);
  const pct  = rate > 0 ? Math.abs(fs) / rate : 0;

  return { ...s, flow: fs, flow_signed: fs, rate_a: rate, _pct: pct, _AB: [A,B] };
});

  // 3) metrics + redraw (unchanged)
  lineMetrics.clear();
  for (const L of enriched) lineMetrics.set(L.id, { pct: L._pct, flow: L.flow, rate_a: L.rate_a });

  const S = window.disabledLineSet || new Set();
  const enabled  = enriched.filter(L => !S.has(L.id));
  const disabled = enriched.filter(L =>  S.has(L.id));

  // let drawChevrons own layer creation; just call it
  drawChevrons(enabled, staticNodes, currentMapMode);
  drawDisabledMarkersMap(disabled);
}

// === Rect Generators: settings (tune freely) ================================
const DICE = 54;        // collapsed square side (px)
const BLOCK_UNIT       = 100;      // MW per block
const HALF_STEP        = BLOCK_UNIT / 2;
const BASE_BLOCK_H     = 28;       // px (upper bound; will scale down to fit MAX_GEN_H)
const BLOCK_GAP        = 4;        // px vertical gap
const PAD_INNER        = 10;       // px inner padding
const HALO_PAD         = 8;        // px halo padding
const MIN_GEN_W        = 50;       // px minimum width (clickable)
const WIDTH_VARIATION  = 80;       // px subtle width variation by cost
const MAX_GEN_W        = MIN_GEN_W + WIDTH_VARIATION;
const MAX_GEN_H        = 220;      // px tallest generator on screen
const BASE_S = 64;  // default dice size when Power scaling is OFF


// Round capacity to nearest half-block (capacity shown is full/half only)
const roundCapToHalf = pmax => Math.ceil((pmax || 0) / HALF_STEP) * HALF_STEP;

// Compute number of visual blocks (top can be half)
function capBlocks(p){
  const cap = roundCapToHalf(p);
  const full = Math.floor(cap / BLOCK_UNIT);
  const hasHalfTop = (cap % BLOCK_UNIT) === HALF_STEP;
  return full + (hasHalfTop ? 1 : 0);
}

// Compute global block height so the tallest gen fits MAX_GEN_H
function computeBlockH(gens){
  const pmaxExtent = d3.extent(gens, g => g.pmax || 0);
  const maxBlocks  = capBlocks(pmaxExtent[1] || 0);
  const available  = MAX_GEN_H - PAD_INNER*2 - (maxBlocks - 1) * BLOCK_GAP;
  return Math.min(BASE_BLOCK_H, available / Math.max(1, maxBlocks));
}

// Build capacity blocks (TOP → DOWN). Top block may be HALF_STEP wide (half capacity).
function capacityBoundsTopDown(pmax){
  const cap = roundCapToHalf(pmax);
  const fullBlocks = Math.floor(cap / BLOCK_UNIT);
  const hasHalfTop = (cap % BLOCK_UNIT) === HALF_STEP;
  const out = [];
  let rem = cap;

  if (hasHalfTop){
    out.push({ size: HALF_STEP, upper: rem, lower: rem - HALF_STEP }); // TOP = half
    rem -= HALF_STEP;
  }
  for (let i=0; i<fullBlocks; i++){
    out.push({ size: BLOCK_UNIT, upper: rem, lower: rem - BLOCK_UNIT });
    rem -= BLOCK_UNIT;
  }
  return out; // index 0 is TOP
}

// Draw pips by capacity (max) and fill by current (pg).
// Binary-only rendering for dice: NO half dots (capacity or current).
function drawPipsByMaxD3(containerSel, cx, cy, size, currentMW, maxMW){
  const grid = 3;
  const cell = size / grid;
  const r = Math.max(4.2, cell * 0.34);

  const capMW = roundCapToHalf(maxMW);
  const curMW = Math.min(roundToHalf(currentMW), capMW);

  const maxBlocks = capMW / 100;   // 100 MW per dot
  const curBlocks = Math.min(maxBlocks, curMW / 100);

  const capDots = Math.floor(Math.min(9, maxBlocks));
  const curDots = Math.floor(Math.min(9, curBlocks));

  const g = containerSel.append("g").attr("class", "dice-pips");

  for (let i = 0; i < capDots; i++) {
    const row = Math.floor(i / grid), col = i % grid;
    const px = cx - size/2 + cell*(col + 0.5);
    const py = cy - size/2 + cell*(row + 0.5);

    // capacity outline (always)
    g.append("circle")
      .attr("class", "pip-capacity")
      .attr("cx", px).attr("cy", py).attr("r", r);

    // current fill (overlay)
    if (i < curDots) {
      g.append("circle")
        .attr("class", "pip-current")
        .attr("cx", px).attr("cy", py).attr("r", r - 0.6);
    }
  }
}

function onBlockClick(ev, b, node) {
  const gen = currentGenerators.find(x => `Gen${x.bus}` === node.id);
  if (!gen) return;

  // Logical bounds for this block against gen.pmax
  const upper = Math.min(b.upper, gen.pmax || 0);
  const lower = Math.min(b.lower, gen.pmax || 0);

  // Toggle: clicking a filled block drops to its lower edge, else raise to upper edge
  let targetMW = ((gen.pg || 0) >= upper) ? lower : upper;

  // Quantize to 50 MW steps and clamp
  const HALF_STEP = BLOCK_UNIT / 2;
  targetMW = Math.round(targetMW / HALF_STEP) * HALF_STEP;
  targetMW = Math.max(0, Math.min(targetMW, gen.pmax || 0));

  // Optimistic UI
  gen.pg = targetMW;
  updateMapGeneratorsFromScenario();

  // Persist to backend
  const percent = Math.min(100, Math.round((targetMW / (gen.pmax || 1)) * 100));
  fetch(`/api/set_generation/${gen.index}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ percent, user_active: true })
  })
  .then(r => r.json())
  .then(data => {
    currentGenerators = data.generators;
    currentLines = data.lines;
    renderOverview(currentGenerators, currentScenarioData, currentLines);
    updateMapGeneratorsFromScenario();

    // Re-open the selected generator’s UI if needed
    if (selectedGeneratorId) {
      const selected = d3.select(`#${CSS.escape(selectedGeneratorId)}`);
      if (!selected.empty()) selected.dispatch("click");
    }
  })
  .catch(console.error);

  ev.stopPropagation();
}

    // ensure a chevron-like group exists
    let g = layer.select(`#${CSS.escape(`chev-${d.id}`)}`);
    if (g.empty()){
      g = layer.append('g')
        .attr('id', `chev-${d.id}`)
        .attr('class', 'chevron chevron-x') // ← participates in focus scaling
        .style('pointer-events', 'none');
    }

    const path = document.getElementById(d.id);
    if (!path || !path.getTotalLength) return;

    const L = path.getTotalLength();
    const mid = path.getPointAtLength(L/2);
    const delta = Math.max(1, L/500);
    const p1 = path.getPointAtLength(Math.max(0, L/2 - delta));
    const p2 = path.getPointAtLength(Math.min(L, L/2 + delta));
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180/Math.PI;

    const baseT = `translate(${mid.x}, ${mid.y}) rotate(${angle})`;
    g.attr('data-base-transform', baseT)
     .attr('transform', `${baseT} scale(1)`);

    // text ❌ (swap to SVG path X if you prefer)
    const t = g.selectAll('text').data([d]);
    t.enter().append('text')
      .attr('text-anchor','middle')
      .attr('dominant-baseline','central')
      .text('❌')
      .merge(t)
      .style('font-size', `${fontSize}px`);
  });
}


// Draw a 3×3 grid of pips and wire clicks.
// If the first (lowest) pip is already filled and you click it → set to zero.
function drawDicePipsScaled(g, W, H, maxPips, curPips, lockedOrDisabled, onSetPips){
  const pipG = g.selectAll("g.dice-pips").data([0]).join(enter => enter.append("g").attr("class","dice-pips"));
  pipG.selectAll("*").remove();

  const cx = 0, cy = 0;
  const grid = 3;
  const pad  = Math.max(6, Math.min(W,H) * 0.10);
  const boxW = W - pad*2, boxH = H - pad*2;
  const cellW = boxW / grid, cellH = boxH / grid;
  const r = Math.max(3, Math.min(cellW, cellH) * 0.22);

  // positions left-to-right, bottom-to-top (so "lowest" pip = first)
  const positions = [];
  for (let gy = grid-1; gy >= 0; gy--){
    for (let gx = 0; gx < grid; gx++){
      positions.push({
        x: -boxW/2 + gx*cellW + cellW/2,
        y: -boxH/2 + gy*cellH + cellH/2
      });
    }
  }

  const pipCount = Math.min(9, Math.max(1, maxPips));
  const data = positions.slice(0, pipCount).map((p, i) => ({...p, i}));

  const pips = pipG.selectAll("circle.pip").data(data, d => d.i);
  pips.enter().append("circle")
    .attr("class", "pip")
    .attr("cx", d => d.x)
    .attr("cy", d => d.y)
    .attr("r", r)
    .attr("stroke", "#111")
    .attr("stroke-width", 1)
    .attr('fill', d => d.i < curBlocks ? '#22c55e' : '#374151') // green on, dark gray off
    .style("cursor", lockedOrDisabled ? "default" : "pointer")
    .on("click", function (ev, d) {
      if (lockedOrDisabled) return;
      // clicking first (lowest) when filled -> set to 0
      if (curPips > 0 && d.i === 0 && d.i < curPips) {
        onSetPips(0);
        return;
      }
      // clicking pip k sets to k+1, and fills all below
      onSetPips(d.i + 1);
    });
}

// ---- SCALES & PATTERNS ------------------------------------------------------

function makeCostColorScale(gens = currentGenerators) {
  const vals = (Array.isArray(gens) ? gens : [])
    .map(g => g?.cost_per_mw)
    .filter(v => Number.isFinite(v));

  let minC = Math.min(...vals), maxC = Math.max(...vals);
  if (!Number.isFinite(minC) || !Number.isFinite(maxC)) { minC = 0; maxC = 1; }
  if (minC === maxC) { const pad = Math.max(1, Math.abs(minC)*0.1); minC -= pad; maxC += pad; }

  const d0 = minC, d3max = maxC;
  const d1 = d0 + (d3max - d0) * 0.33;
  const d2 = d0 + (d3max - d0) * 0.66;

  return window.d3.scaleLinear()
    .domain([d0, d1, d2, d3max])
    .range(["#2e7d32", "#f9a825", "#fb8c00", "#c62828"]) // green→yellow→orange→red
    .clamp(true);
}

function makeEmiStrokeScale(gens = currentGenerators) {
  const [minE, maxE] = window.d3.extent(gens, g => g.emissions_per_mw || 0);
  return window.d3.scaleLinear().domain([minE||0, maxE||1]).range([0.6, 4.5]).clamp(true);
}

function makeEmiSpacingScale(gens = currentGenerators) {
  const [minE, maxE] = window.d3.extent(gens, g => g.emissions_per_mw || 0);
  return window.d3.scaleLinear().domain([minE||0, maxE||1]).range([12, 6]).clamp(true);
}

function ensureHatch(defsSel, genId, strokeW, step) {
  const pid = `hatch-${genId}`;
  let pat = defsSel.select(`#${CSS.escape(pid)}`);
  if (pat.empty()) {
    pat = defsSel.append("pattern")
      .attr("id", pid).attr("patternUnits", "userSpaceOnUse")
      .attr("width", step).attr("height", step)
      .attr("patternTransform", "rotate(45)");
    pat.append("line")
      .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", step)
      .attr("stroke", "#000").attr("stroke-linecap", "butt");
  }
  pat.attr("width", step).attr("height", step);
  pat.select("line").attr("y2", step).attr("stroke-width", strokeW);
  return `url(#${pid})`;
}

const BLOCK_GREEN = "#4caf50";  // match overview card green
const BLOCK_MW    = 100;

function drawPowerBlocks(g, W, H, pmax, pg, lockedOrDisabled, onSetPg) {
  const grid = 3;
  const pad  = Math.max(4, Math.min(W, H) * 0.10);
  const boxW = W - pad*2, boxH = H - pad*2;
  const cellW = boxW / grid, cellH = boxH / grid;

  const maxBlocks = Math.max(1, Math.min(9, Math.round((pmax || 0) / BLOCK_MW)));
  const curBlocks = Math.max(0, Math.min(maxBlocks, Math.round((pg   || 0) / BLOCK_MW)));

  // positions left→right, bottom→top
  const positions = [];
  for (let gy = grid - 1; gy >= 0; gy--) {
    for (let gx = 0; gx < grid; gx++) {
      positions.push({
        x: -boxW/2 + gx*cellW,
        y: -boxH/2 + gy*cellH,
        w:  cellW,
        h:  cellH
      });
    }
  }
  const data = positions.slice(0, maxBlocks).map((p, i) => ({ ...p, i })); // ← fixed

  const sel = g.selectAll("rect.gen-block").data(data, d => d.i);
  sel.join(
    e => e.append("rect").attr("class","gen-block"),
    u => u,
    x => x.remove()
  )
  .attr("x", d => d.x + 1).attr("y", d => d.y + 1)
  .attr("width", d => d.w - 2).attr("height", d => d.h - 2)
  .attr("rx", 4).attr("ry", 4)
  .attr("fill", d => (d.i < curBlocks ? BLOCK_GREEN : "#757575"))
  .style("cursor", lockedOrDisabled ? "default" : "pointer")
  .on("click", function(ev, d) {
    if (lockedOrDisabled) return;
    // first filled toggles to 0
    let newBlocks = (d.i === 0 && curBlocks > 0) ? 0 : (d.i + 1);
    newBlocks = Math.max(0, Math.min(maxBlocks, newBlocks));
    onSetPg(newBlocks * BLOCK_MW);
  });
}

function includesGen(arr, gen){

  const id = gen.id, index = gen.index, bus = gen.bus;

}

// MapView-identical blocks, with inline fills so "goal" always shows.
function updatePowerBlocks(totalPower, targetPower) {
  const container =
    document.querySelector("#overview-power .blocks") ||
    document.querySelector("#scale-power .blocks");
  const valueWrap = document.getElementById("overview-power");
  const label =
    document.querySelector("#overview-power .fraction") ||
    document.querySelector("#scale-power .fraction");
  if (!container || !valueWrap) return;

  totalPower  = +totalPower  || 0;
  targetPower = +targetPower || 0;

  // --- Ensure fraction-row and the pill exist (once) ---
  let row = valueWrap.querySelector(".fraction-row");
  if (!row) {
    row = document.createElement("div");
    row.className = "fraction-row";

    // Insert row right after the blocks container
    const blocksEl = valueWrap.querySelector(".blocks");
    if (blocksEl && blocksEl.nextSibling) {
      valueWrap.insertBefore(row, blocksEl.nextSibling);
    } else {
      valueWrap.appendChild(row);
    }

    if (label) row.appendChild(label);
  } else {
    if (label && label.parentElement !== row) row.appendChild(label);
  }

  let pill = document.getElementById("power-ok-pill");
  if (!pill) {
    pill = document.createElement("div");
    pill.id = "power-ok-pill";
    pill.className = "pill-ok";
    pill.textContent = "All good!";
    // default style; CSS controls final look
    pill.style.display = "none";
    row.appendChild(pill);
  }

  // --- Update fraction text ---
  if (label && targetPower > 0) {
    label.textContent = `${Math.round(totalPower)} / ${Math.round(targetPower)} MW`;
  } else if (label) {
    label.textContent = `${Math.round(totalPower)} MW`;
  }

  // --- Toggle pill visibility when within ±5% of target ---
  const meets = targetPower > 0 &&
                totalPower >= targetPower * 0.95 &&
                totalPower <= targetPower * 1.05;
  pill.style.display = meets ? "inline-block" : "none";

  // --- Rebuild blocks (unchanged) ---
  container.innerHTML = "";
  if (!(targetPower > 0)) return;

  const MW_PER_BLOCK = 100;
  const count   = Math.ceil(targetPower / MW_PER_BLOCK);
  const overAmt = totalPower - targetPower;

  // Density thresholds
  let cellMin = 22, blockH = 26, gap = 6;
  if (count > 120)      { cellMin = 12; blockH = 14; gap = 4; }
  else if (count > 80)  { cellMin = 14; blockH = 16; gap = 5; }
  else if (count > 40)  { cellMin = 18; blockH = 20; gap = 6; }

  container.style.setProperty("--cell-min", `${cellMin}px`);
  container.style.setProperty("--block-h",  `${blockH}px`);
  container.style.setProperty("--gap",      `${gap}px`);

  for (let i = 0; i < count; i++) {
    const startMW = i * MW_PER_BLOCK;
    const endMW   = (i + 1) * MW_PER_BLOCK;
    const el = document.createElement("div");
    el.className = "block";

    if (totalPower >= endMW) {
      el.classList.add("full");
      el.style.background = "#4caf50";
    } else if (totalPower <= startMW) {
      el.classList.add("goal");
      el.style.background = "#e0e0e0";
    } else {
      el.classList.add("partial");
      const pct = Math.max(1, Math.min(99, Math.round(((totalPower - startMW) / MW_PER_BLOCK) * 100)));
      el.style.background = `linear-gradient(90deg, #4caf50 ${pct}%, #e0e0e0 ${pct}%)`;
    }

    container.appendChild(el);
  }

  // Overshoot badge
  if (overAmt > 0 && count > 0) {
    const last = container.lastElementChild;
    if (last) {
      last.className = "block over";
      last.style.background = "#ef5350";
      last.style.color = "#fff";
      last.style.display = "flex";
      last.style.alignItems = "center";
      last.style.justifyContent = "center";
      last.style.fontSize = "12px";
      last.textContent = overAmt > 2000 ? "!!!" : `+${Math.ceil(overAmt / MW_PER_BLOCK)}`;
    }
  }
}

  // Power window (±5%)
  const meetsPower = !Number.isFinite(Number(scen.target_mw)) ? true :
    (totalP >= scen.target_mw * 0.95 && totalP <= scen.target_mw * 1.05);

  // ------------------ BLACKOUT + OVERLOADS (INLINE) ------------------
  const disabledSet = (window.disabledLineSet instanceof Set) ? window.disabledLineSet : new Set();
  const gensArr  = Array.isArray(window.currentGenerators) ? window.currentGenerators : [];
  const linesArr = Array.isArray(lines) ? lines : (lines ? Object.values(lines) : []);

  const hasAnyGeneration = gensArr.some(g => (Number(g?.pg) || 0) > 0);

  // Enabled lines only
  const enabled = linesArr.filter(li => {
    const id = String(li?.id ?? `Line_Bus${li?.from_bus}_Bus${li?.to_bus}`);
    return !disabledSet.has(id);
  });

  let enabledCount = 0, zeroPctCount = 0, overloads = 0;
  for (const li of enabled) {
    const rate = Number(li?.rate_a ?? li?.rateA ?? 0);
    const flow = Math.abs(Number(li?.flow ?? 0));
    if (rate <= 0) continue;
    enabledCount++;
    const pct = flow / rate;     // 0..∞
    if (pct === 0) zeroPctCount++;
    if (pct > 1)  overloads++;
  }

  // Blackout = no gens on OR all enabled lines exactly 0%
  const blackout = (!hasAnyGeneration) || (enabledCount > 0 && zeroPctCount === enabledCount);

  const allowedOverloads = Number(scen.allowed_overloads ?? 0);
  const meetsLines = !blackout && (overloads <= allowedOverloads);
  // -------------------------------------------------------------------

  // --- Score (never negative). Only defined if a cost cap exists.
  const hasCostCap = Number.isFinite(Number(costCap));
  const hasEmiCap  = Number.isFinite(Number(emiCap));

  let baseScore = null;
  if (hasCostCap) {
    baseScore = (totalC <= costCap) ? (costCap - totalC) : 0;
  }

  const emiOk   = hasEmiCap && (totalE <= emiCap);
  const doubled = !!(emiOk && baseScore != null && baseScore > 0);
  const score   = (baseScore == null) ? null : (doubled ? baseScore * 2 : baseScore);

  // --- Update checkboxes
  const cPower = document.getElementById("check-power");
  const cLines = document.getElementById("check-lines");
  if (cPower) cPower.checked = meetsPower;
  if (cLines) cLines.checked = meetsLines;

  // --- Enable/disable Submit based on ALL requirements
  const allMet = meetsPower && meetsLines;
  const btn = document.getElementById("submit-button");
  if (btn) { btn.classList.toggle("active", allMet); btn.disabled = !allMet; }

  // --- Score counter UI
  const scEl = document.getElementById("score-counter");
  if (scEl) {
    if (baseScore == null) {
      scEl.innerHTML = `<div class="score-main">Score: —</div>`;
    } else if (doubled) {
      scEl.innerHTML = `
        <div class="score-main">Score: ${Math.round(score).toLocaleString()}</div>
        <div class="score-sub">(${Math.round(baseScore).toLocaleString()} ×2)</div>
      `;
    } else {
      scEl.innerHTML = `<div class="score-main">Score: ${Math.round(score).toLocaleString()}</div>`;
    }
    scEl.classList.toggle("ready", allMet);
  }
}


function computeSubmitStats() {
  const startedAt = window.lvScenarioStartedAt || performance.now();
  const now = performance.now();
  const elapsedMs = Math.max(0, now - startedAt);

  const timeFormatted = typeof formatDuration === "function"
    ? formatDuration(elapsedMs)
    : `${Math.floor(elapsedMs/60000)}:${String(Math.floor((elapsedMs/1000)%60)).padStart(2,'0')}`;

  const highestLoadPct = (typeof getHighestLoadPctAtSubmit === "function")
    ? getHighestLoadPctAtSubmit(window.currentLines || [], window.currentScenarioData || {})
    : 0;

  // DEBUG — show the top-5 line loads at submit (MapView)
try {
  const tops = (window.currentLines || [])
    .map(L => ({
      id: (L?.id) ? String(L.id)
                  : (typeof _lineId === 'function' ? _lineId(L) : `Line_Bus${L.from_bus}_Bus${L.to_bus}`),
      pct: (() => {
        const rate = +(L?.rate_a ?? L?.rateA ?? 0);
        const flow = Math.abs(+(L?.flow ?? 0));
        return rate > 0 ? (flow / rate) * 100 : 0;
      })()
    }))
    .sort((a,b) => b.pct - a.pct)
    .slice(0, 5);

  console.log('[submit][map] highestLoadPct =', highestLoadPct);
  console.table(tops);
} catch (e) {}

  const scen = window.currentScenarioData || {};
  const totals = {
    cost:      Number(window.totalCost || 0),
    emissions: Number(window.totalEmissions || 0)
  };
  const caps = {
    cost:      (scen.cost_limit != null) ? Number(scen.cost_limit) : null,
    emissions: (scen.emissions_limit != null) ? Number(scen.emissions_limit) : null
  };

  // Score rules: if no cost cap → score = null (not applicable)
  // else base = max(costCap - cost, 0); doubled iff emissions cap exists AND emissions <= cap AND base > 0
  let baseScore = null, doubled = false, finalScore = null;
  if (Number.isFinite(caps.cost)) {
    baseScore = (totals.cost <= caps.cost) ? (caps.cost - totals.cost) : 0;
    const emiOk = Number.isFinite(caps.emissions) && (totals.emissions <= caps.emissions);
    doubled = !!(emiOk && baseScore > 0);
    finalScore = doubled ? baseScore * 2 : baseScore;
  }

  return {
    timeFormatted, elapsedMs, highestLoadPct,
    totalCost: totals.cost, totalEmissions: totals.emissions,
    costCap: caps.cost, emisCap: caps.emissions,
    baseScore, doubled, finalScore
  };
}

  // Compute midpoint + tangent angle for an existing <path id="...">
  function midAndAngleByPathId(pathId){
    const el = document.getElementById(pathId);

  baseScore: Number.isFinite(+S?.baseScore) ? +S.baseScore : null,
  doubled: !!S?.doubled
});

      console.log('[mapView]: Submit button CLICKED', { disabled: !!btn.disabled });
      try { window.parent.postMessage({ type: 'runner:submitClicked' }, '*'); } catch {}
      window.addEventListener('message', (ev) => {
  const msg = ev?.data || {};
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'runner:timeUp') {
    // Your overlay function should accept a mode that switches time label to "Time out"
    showResultsOverlay({ mode: 'timeout' });
  }
});

    }, { passive: true });
  }
})();
</script>
<script>
  // Lightweight legend toggle for MapView (no deps)
  (function () {
    const btn   = document.getElementById('mv-legend-toggle');
    const panel = document.getElementById('mv-legend-panel');
    if (!btn || !panel) return;

    // Open/close with the button
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (panel.hasAttribute('hidden')) {
        panel.removeAttribute('hidden');
      } else {
        panel.setAttribute('hidden', '');
      }
    });

    // Clicking the panel itself closes it (per caption)
    panel.addEventListener('click', () => panel.setAttribute('hidden', ''));

    // Click-away to close
    document.addEventListener('click', (e) => {
      const inside = panel.contains(e.target) || btn.contains(e.target);
      if (!inside) panel.setAttribute('hidden', '');
    });

    // Escape key closes
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') panel.setAttribute('hidden', '');
    });
  })();
</script>
<script>
/**
 * Unified Runner Bridge — single dv:state payload (always includes meets + goals)
 * Exposes:
 *   - window.postToRunner(snapshot?)        → sends unified dv:state
 *   - window.computeEvalStateSafe()         → returns normalized snapshot
 */
(() => {
  const RUNNER_MODE = new URLSearchParams(location.search).get('runner') === '1';

  const nz = v => Number(v || 0);

  function gens()  { return Array.isArray(window.currentGenerators) ? window.currentGenerators : []; }
  function lines() {
    const L = window.currentLines;
    if (Array.isArray(L)) return L;
    if (!L) return [];
    return (typeof L === 'object' && !('length' in L)) ? Object.values(L) : Array.from(L);
  }
  function scen() { return window.currentScenarioData || {}; }

  function computeFallback() {
    const G = gens(), L = lines(), S = scen();

    const totals = {
      power:     G.reduce((s,g)=>s + nz(g.pg), 0),
      cost:      G.reduce((s,g)=>s + nz(g.pg)*nz(g.cost_per_mw), 0),
      emissions: G.reduce((s,g)=>s + nz(g.pg)*nz(g.emissions_per_mw), 0)
    };

    const overloaded_count = L.filter(el => {
      const rate = nz(el.rate_a ?? el.rateA);
      const flow = Math.abs(nz(el.flow));
      return rate > 0 && flow > rate;
    }).length;

    const tol = Number.isFinite(nz(S.target_tolerance)) ? nz(S.target_tolerance) : 0.05;
    const maxOver = (S.allowed_overloads != null) ? nz(S.allowed_overloads)
                   : (S.max_overloads    != null) ? nz(S.max_overloads) : 0;

    const goals = {
      target_mw:        (S.target_mw != null)        ? nz(S.target_mw)        : null,
      max_cost:         (S.cost_limit != null)       ? nz(S.cost_limit)       : null,
      max_emissions:    (S.emissions_limit != null)  ? nz(S.emissions_limit)  : null,
      max_overloads:    maxOver,
      target_tolerance: tol
    };

    const meets = {
      power:     goals.target_mw == null ? true
                  : (totals.power >= goals.target_mw*(1 - tol) &&
                     totals.power <= goals.target_mw*(1 + tol)),
      cost:      goals.max_cost == null      ? true : (totals.cost      <= goals.max_cost),
      emissions: goals.max_emissions == null ? true : (totals.emissions <= goals.max_emissions),
      overloads: overloaded_count <= goals.max_overloads
    };
    meets.overall = !!(meets.power && meets.overloads && meets.cost && meets.emissions);

    return {
      scenarioId: (S.scenario_id || S.id || null),
      totals,
      state: { overloaded_count },
      goals,
      meets,
      meta: { gens: G.length, lines: L.length, ts: Date.now() }
    };
  }

  function computeState() {
    const S = scen();
    try {
      if (typeof window.evaluateScenarioState === 'function') {
        const r  = window.evaluateScenarioState(S, lines()); // map signature
        const fb = computeFallback();
        return {
          scenarioId: (S.scenario_id || S.id || null),
          totals: r?.totals ?? fb.totals,
          state:  r?.state  ?? fb.state,
          meets:  r?.meets  ?? fb.meets,
          goals:  r?.goals  ?? fb.goals,
          meta:   { gens: gens().length, lines: lines().length, ts: Date.now() }
        };
      }
    } catch (e) {
      console.warn('[RunnerBridge] evaluateScenarioState error — using fallback', e);
    }
    return computeFallback();
  }

 function postSnapshot(snapshot) {
  const snap = snapshot || computeState();
  // pull common aliases so we can see if views are actually producing them
  const hiLoad =
    snap?.highestLoadAtSubmit ?? snap?.highestLoadPct ??
    snap?.maxLinePct ?? snap?.maxLoadPct ?? snap?.highestLoad ?? null;

  const score =
    snap?.finalScore ?? snap?.score ??
    (Number.isFinite(snap?.baseScore) ? (snap?.doubled ? snap.baseScore * 2 : snap.baseScore) : null);

  const payload = {
    type: 'dv:state',
    view: 'map',
    scenarioId: snap.scenarioId ?? null,
    totals: snap.totals ?? null,
    state:  snap.state  ?? null,
    meets:  snap.meets  ?? null,
    goals:  snap.goals  ?? null,
    meta:   snap.meta   ?? { ts: Date.now() }
  };

  console.log('[View→Runner][MAP] posting dv:state', {
    scenarioId: payload.scenarioId,
    hasMeets: !!payload.meets,
    totalsKeys: payload.totals ? Object.keys(payload.totals) : 'null',
    stateKeys:  payload.state  ? Object.keys(payload.state)  : 'null',
    aliases: { highestLoadPct: hiLoad, score }
  });

  try { window.parent.postMessage(payload, '*'); }
  catch (e) { console.warn('[RunnerBridge] postMessage failed:', e); }
}


  // --- Export globals so legacy calls like postToRunner() keep working ---
  window.computeEvalStateSafe = computeState;
  window.postToRunner = (snap) => { try { postSnapshot(snap); } catch(e) { console.warn(e); } };

  // If not in runner mode, keep the API present as no-ops and exit early
  if (!RUNNER_MODE) {
    window.postToRunner = () => {};
    return;
  }

  // Beacon after each recompute
  if (typeof window.evaluateScenarioState === 'function' && !window.__origEvaluateScenarioState) {
    window.__origEvaluateScenarioState = window.evaluateScenarioState;
    window.evaluateScenarioState = function patchedEvaluateScenarioState(...args) {
      const result = window.__origEvaluateScenarioState.apply(this, args);
      postSnapshot();
      return result;
    };
  }

  // Respond to Runner pulls
  window.addEventListener('message', (e) => {
    const msg = e?.data || {};
    if (msg.type === 'runner:requestState') postSnapshot();
    if (msg.type === 'runner:timeUp') {
      // Optional: if you show a timeout overlay, do it here
      if (typeof window.showResultOverlay === 'function') {
        window.showResultOverlay({ mode: 'timeout' });
      }
    }
  });

  // Initial beacon when ready
  window.addEventListener('load', () => postSnapshot());
})();
</script>
<script>
(() => {
  function logChevronDirections(label = 'mapView chevrons') {
    const lines = window.currentLines || [];
    if (!Array.isArray(lines) || !lines.length) {
      console.warn('[chevrons]', label, 'no currentLines found');
      return;
    }

    const rows = lines.map(L => {
      const id   = L.id || `Line_Bus${L.from_bus}_Bus${L.to_bus}`;
      const fbus = L.from_bus ?? L.fbus ?? '(?)';
      const tbus = L.to_bus   ?? L.tbus ?? '(?)';
      const flow = +(L.flow_signed ?? L.flow ?? 0);
      const rate = +(L.rate_a ?? 1);
      const pct  = rate > 0 ? (Math.abs(flow) / rate) : 0;
      const expected = flow > 0 ? 'from→to' : flow < 0 ? 'to→from' : 'zero';

      const chev = document.querySelector(`.chevron[data-line-id="${CSS.escape(id)}"]`);
      const drawn = chev?.dataset?.dir
        ? chev.dataset.dir.replace(/^(fwd|forward).*$/i, 'from→to')
                           .replace(/^(rev|reverse).*$/i, 'to→from')
                           .replace(/^(zero|none).*$/i, 'zero')
        : '(n/a)';
      const mismatch = drawn !== '(n/a)' && drawn !== expected ? '❌' : '';

      return {
        id,
        from_bus: fbus,
        to_bus: tbus,
        flow_MW: flow.toFixed(2),
        rate_MW: rate,
        pct_load: (pct*100).toFixed(1) + '%',
        expected_dir: expected,
        drawn_dir: drawn,
        mismatch
      };
    });

    const mismatches = rows.filter(r => r.mismatch).length;
    console.groupCollapsed(`[chevrons] ${label} — ${rows.length} lines (${mismatches} mismatched)`);
    console.table(rows);
    console.groupEnd();
  }

  window.debugLogChevronDirections = logChevronDirections;
  window.addEventListener('load', () => logChevronDirections('initial load'));
  window.addEventListener('keydown', e => {
    if (e.shiftKey && (e.key === 'd' || e.key === 'D'))
      logChevronDirections('manual dump');
  });
})();
</script>
