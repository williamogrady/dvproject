<!DOCTYPE html>
<html>
<head>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <meta charset="UTF-8">
  <title>Grid Simulator</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: sans-serif;
      padding: 2em;
      background-color: #f8f9fa;
    }
    #dashboard {
      display: flex;
      gap: 2em;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-family: monospace;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.4em;
      text-align: center;
    }
    th {
      background-color: #333;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .status-cell {
      font-weight: bold;
      cursor: pointer;
    }
    .on {
      background-color: green;
      color: white;
    }
    .off {
      background-color: red;
      color: white;
    }
    .overloaded {
      background-color: red;
      color: white;
    }
    .generator-unavailable rect {
    fill: gray !important;
    stroke: black !important;
    opacity: 0.3;
    pointer-events: none;
  }
  .line-unavailable {
    background-color: #ddd !important;
    opacity: 0.5;
  }
  </style>
</head>
<body>
  <div id="scenario-menu">
  <label for="scenario-select">Scenario:</label>
  <select id="scenario-select">
    <option value="default">Default</option>
    <option value="E_final" selected>Clean North Power</option>
  </select>
  <button id="reset-button">🔁 Reset Scenario</button>
  <div id="scenario-legend" style="font-size:0.9em; border:1px solid #ccc; padding:1em; max-width:300px; background:#f1f1f1;">
  <strong>Scenario Goals</strong>
  <div id="goal-details"></div>
</div>
</div>
  <h1>Virtual Power Grid Simulator</h1>
  <!-- Overview stays at the top -->
<div id="overview" style="margin-bottom: 1em; font-size: 1.2em; font-weight: bold;"></div>

<!-- New layout: stacked containers -->
<table style="width: 100%; font-family: monospace;">
  <h2>Generators</h2>
  <thead>
    <tr id="genSortBar" style="cursor: pointer;"></tr>
  </thead>
</table>
<div id="genTable"></div>
<h2>Transmission Lines</h2>
<div id="lineTable">Loading...</div>
  </div>

<script>
  
  let genSortKey = null;
  let genSortDir = 'desc';
  let lineSortCol = null;
  let lineSortDir = 'desc';

  let currentGenerators = [];
  let currentLines = [];
  let currentScenarioId = ''; // default scenario
  
/* EVENT LISTENERS */
document.getElementById('scenario-select').addEventListener('change', async (e) => {
  const id = e.target.value;
  const res = await fetch(`/api/scenario/${id}`);
  const data = await res.json();
  renderGenerators(data.generators);
  renderLines(data.lines);
  renderOverview(data.generators, data.lines);
});

document.getElementById('reset-button').addEventListener('click', async () => {
  await loadDashboard(currentScenarioId);       // reloads scenario
  window.scenarioAlreadyWon = false;            // reset win alert guard
});
  
function renderOverview(generators, lines, totalCost = null, solved = true) {
  const overviewDiv = document.getElementById('overview');

  const totalOnline = generators
  .filter(g => g.pg > 0)
  .reduce((sum, g) => sum + g.pg, 0);

  const overloadedCount = lines.filter(l => l.overloaded).length;

  let statusMsg = solved
    ? ''
    : `<div style="color:red; font-weight:bold;">⚠️ Power flow could not be solved</div>`;

  const costDisplay = solved && totalCost !== null
    ? `$${totalCost.toFixed(2)}`
    : `–`;

  overviewDiv.innerHTML = `
    ${statusMsg}
    🟩 Total Generation Online: <span style="color:green">${totalOnline.toFixed(1)} MW</span><br>
    🟥 Overloaded Lines: <span style="color:${overloadedCount > 0 ? 'red' : 'green'}">${overloadedCount}</span><br>
    💸 Total Cost: <span style="color:blue">${costDisplay}</span>
  `;
}

    async function loadDashboard(scenarioId) {
    const res = await fetch(`/api/scenario/${scenarioId}`);
    const data = await res.json();

    currentGenerators = data.generators;
    currentLines = data.lines;
    currentScenarioId = scenarioId; // update current scenario ID

    renderGenerators(currentGenerators);
    renderLines(currentLines);
    renderOverview(currentGenerators, currentLines, data.total_cost, data.solved);
     renderScenarioStatus();  // ✅ add this here
  }


function renderGenSortBar() {
  const bar = d3.select("#genSortBar");
  bar.selectAll("*").remove();

  const headers = [
    { key: "bus", label: "Bus" },
    { key: "pmax", label: "Pmax" },
    { key: "pg", label: "Pg" }
  ];

  headers.forEach(({ key, label }) => {
  bar.append("th")
    .text(label + (genSortKey === key ? (genSortDir === "asc" ? " ▲" : " ▼") : ""))
    .style("background-color", "#333")
    .style("color", "white")
    .style("padding", "0.4em")
    .style("font-weight", "bold")
    .style("border", "1px solid #ccc")
    .on("click", () => {
      if (genSortKey === key) {
        genSortDir = genSortDir === "asc" ? "desc" : "asc";
      } else {
        genSortKey = key;
        genSortDir = "asc";
      }
      renderGenerators(currentGenerators); // ✅ use in-memory data
    });
});
}


  
function renderGenerators(gens) {

    renderGenSortBar(); // draw the sort bar

  if (genSortKey) {
    gens.sort((a, b) => {
      const va = a[genSortKey];
      const vb = b[genSortKey];
      return genSortDir === "asc" ? va - vb : vb - va;
    });
  }

  const container = d3.select("#genTable");
  container.selectAll("*").remove();

  //const color = d3.scaleOrdinal(d3.schemeSet3); // Or schemeTableau10, schemePaired, etc.

      function getBlockBackground(d) {
      return d.data.pg > 0 ? "#ffffff" : "#ffffff"; // light green vs dark gray
    }

    function getFillColor(d) {
      return d.data.pg > 0 ? "#006400" : "none"; // dark green or none
    }

  const width = 1400;
  const height = 800;
  const marginTop = 30;
  const padding = 0;
  const numRows = 4;

  // Group into 4 fake rows for treemap structure
  const grouped = Array.from({ length: numRows }, () => []);
  gens.forEach((g, i) => grouped[i % numRows].push(g));
  const nested = grouped.map((group, i) => ({ name: `row${i}`, children: group }));

  const root = d3.hierarchy({ children: nested }).sum(d => d.pmax || 1);
  d3.treemap()
    .tile(d3.treemapSliceDice)
    .size([width, height - marginTop])
    .paddingInner(padding)
    .paddingOuter(padding)
    (root);

  const svg = container.append("svg")
  .attr("viewBox", [0, 0, width, height])
  .attr("width", width)
  .attr("height", height)
  .style("font", "10px sans-serif");

  const blocks = svg.selectAll("g")
    .data(root.leaves())
    .join("g")
    .attr("transform", d => `translate(${d.x0},${d.y0 + marginTop})`);

  // Background
  blocks.append("rect")
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => getBlockBackground(d))
  .attr("stroke", "#444")
  .attr("stroke-width", 1.5);

  // Add a class for unavailable generators
  blocks.classed("generator-unavailable", d => d.data.unavailable);



  // Green fill layer
  const fills = blocks.append("rect")
  .attr("x", 0)
  .attr("y", d => (d.y1 - d.y0) * (1 - d.data.pg / d.data.pmax))
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => (d.y1 - d.y0) * (d.data.pg / d.data.pmax))
  .attr("fill", d => getFillColor(d));


  // Labels
  blocks.append("text")
  .attr("x", 6)
  .attr("y", 14)
  .attr("fill", d => d.data.pg > 0 ? "black" : "white")
  .text(d => `Bus: ${d.data.bus}`);


  blocks.append("text")
    .attr("x", 6)
    .attr("y", 28)
    .attr("fill", "black")
    .text(d => `Pmax: ${d.data.pmax}`);

  const pgLabels = blocks.append("text")
    .attr("x", 6)
    .attr("y", 42)
    .attr("fill", "black")
    .text(d => `Pg: ${d.data.pg} (${Math.round((d.data.pg / d.data.pmax) * 100) || 0}%)`);

  // Interaction logic
  blocks.on("mousedown", function (event, d) {
    const [x0, y0] = d3.pointer(event, this);
    const blockHeight = d.y1 - d.y0;

    const onMove = (event) => {
      const [_, y] = d3.pointer(event, this);
      const clamped = Math.max(0, Math.min(y, blockHeight));
      const percent = 1 - clamped / blockHeight;
      const newPg = Math.round(percent * d.data.pmax);

      d.data.pg = newPg;

      fills
        .filter(dd => dd === d)
        .attr("y", blockHeight * (1 - percent))
        .attr("height", blockHeight * percent);

      pgLabels
        .filter(dd => dd === d)
        .text(`Pg: ${newPg} (${Math.round((newPg / d.data.pmax) * 100) || 0}%)`);
    };

    const onUp = () => {
      svg.on("mousemove", null).on("mouseup", null);
      const percent = Math.round((d.data.pg / d.data.pmax) * 100);

      fetch(`/api/set_generation/${d.data.index}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ percent })
      })
        .then(res => res.json())
        .then(data => {
          renderGenerators(data.generators);
          renderLines(data.lines);
          renderOverview(data.generators, data.lines, data.total_cost, data.solved);
          renderScenarioStatus();
        });
    };

    svg.on("mousemove", onMove).on("mouseup", onUp);
  });
}



function renderLines(lines) {
  if (lineSortCol !== null) {
    lines.sort((a, b) => {
      const values = [a.from_bus, a.to_bus, a.flow, a.rate_a, (a.flow / a.rate_a)];
      const va = values[lineSortCol];
      const vb = [b.from_bus, b.to_bus, b.flow, b.rate_a, (b.flow / b.rate_a)][lineSortCol];
      return lineSortDir === 'asc' ? va - vb : vb - va;
    });
  }

  const container = document.getElementById('lineTable');
  container.innerHTML = '';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');

  const headers = ['From', 'To', 'Flow', 'Limit', 'Status'];
  headers.forEach((label, i) => {
    const th = document.createElement('th');
    th.textContent = label;
    th.style.cursor = 'pointer';
    th.onclick = () => {
      if (lineSortCol === i) {
        lineSortDir = lineSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        lineSortCol = i;
        lineSortDir = 'desc';
      }
      renderLines(lines); // reapply sort
    };
    headRow.appendChild(th);
  });

  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  lines.forEach(line => {
    const row = document.createElement('tr');
      if (line.unavailable) {
      row.classList.add('line-unavailable');
    }
    const percent = (line.flow / line.rate_a) * 100;

    row.innerHTML = `
      <td>${line.from_bus}</td>
      <td>${line.to_bus}</td>
      <td>${line.flow.toFixed(2)}</td>
      <td>${line.rate_a}</td>
    `;

    const statusCell = document.createElement('td');
    statusCell.textContent = line.overloaded
      ? `OVERLOADED (${percent.toFixed(0)}%)`
      : `OK (${percent.toFixed(0)}%)`;

    if (percent < 50) {
      statusCell.className = 'load-low';
    } else if (percent < 90) {
      statusCell.className = 'load-med';
    } else {
      statusCell.className = 'load-high';
    }

    row.appendChild(statusCell);
    tbody.appendChild(row);
  });

  table.appendChild(tbody);
  container.appendChild(table);

}

async function renderScenarioStatus() {
  const res = await fetch('/api/status');
  const { current, target, scenario_met } = await res.json(); // ✅ now target is defined

  const legend = document.getElementById('goal-details');
  legend.innerHTML = `
    <div><strong>Target:</strong> ${target.pg || '–'} MW</div>
    <div><strong>Max Cost:</strong> ${target.cost || '–'}</div>
    <div><strong>Max Emissions:</strong> ${target.emissions || '–'}</div>
    <div><strong>No Overloads Allowed</strong></div>
  `;

  function line(label, value, limit, unit, invert = false) {
    if (limit == null) return '';
    const met = invert ? value <= limit : value >= limit;
    const color = met ? 'green' : 'red';
    return `<div>${label}: <span style="color:${color}">${value.toFixed(1)} / ${limit} ${unit}</span></div>`;
  }

  const output = [
    line("Power Output", current.pg, target.pg, "MW"),
    line("Cost", current.cost, target.cost, "$", true),
    line("Emissions", current.emissions, target.emissions, "CO₂", true),
    line("Overloaded Lines", current.overloads, 0, "", true)
  ].join('');

  legend.innerHTML = output;

  // Optionally show alert
  if (scenario_met) {
    alert("🎉 Scenario completed!");
  }
}




  loadDashboard('E_final');  // loads Clean North Power on start
</script>

</body>
</html>
