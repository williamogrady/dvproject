<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gen Mapping Test 2</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }
    .column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      min-width: 400px;
    }
    #showcase-grid {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    svg {
      border: 1px solid #ccc;
      background: #fafafa;
    }
    h2 {
      margin: 0.8em 0 0.3em;
    }
  </style>
</head>
<body>

<h1>Gen Mapping Test 2</h1>

<div class="controls">
  <div><label>Size:</label>
    <select id="map-size">
      <option value="maxPW">Max Power</option>
      <option value="currentPW">Current Power</option>
      <option value="cost">Cost</option>
      <option value="emissions">Emissions</option>
    </select>
  </div>
  <div><label>Saturation:</label>
    <select id="map-saturation">
      <option value="emissions">Emissions</option>
      <option value="cost">Cost</option>
      <option value="maxPW">Max Power</option>
      <option value="currentPW">Current Power</option>
    </select>
  </div>
  <div>
  <label>Stroke Width:</label>
  <select id="map-stroke">
    <option value="cost">Cost</option>
    <option value="emissions">Emissions</option>
    <option value="maxPW">Max Power</option>
    <option value="currentPW">Current Power</option>
  </select>
</div>
  <div><label>Fuel Color: Coal</label>
    <input type="color" id="color-coal" value="#444444">
  </div>
  <div><label>Fuel Color: Gas</label>
    <input type="color" id="color-gas" value="#cc5500">
  </div>
  <div><label>Fuel Color: Combined</label>
    <input type="color" id="color-combined" value="#999900">
  </div>
  <div><label>Fuel Color: Hydro</label>
    <input type="color" id="color-hydro" value="#3399ff">
  </div>
</div>

<div id="showcase-grid">
  <div class="column">
    <h2>Cost (Low, Medium, High)</h2>
    <svg id="cost-showcase" width="400" height="100"></svg>

    <h2>Max Power (Small, Medium, Large)</h2>
    <svg id="maxpw-showcase" width="400" height="100"></svg>

    <h2>Current Power (Low, Medium, High)</h2>
    <svg id="currentpw-showcase" width="400" height="100"></svg>
  </div>

  <div class="column">
    <h2>Emissions (Low, Medium, High)</h2>
    <svg id="emissions-showcase" width="400" height="100"></svg>

    <h2>Fuel Type (Coal, Gas, Combined, Hydro)</h2>
    <svg id="fueltype-showcase" width="400" height="100"></svg>
  </div>

  <div>
  <label><input type="checkbox" id="reverse-size"> Reverse Size</label>
</div>
<div>
  <label><input type="checkbox" id="reverse-sat"> Reverse Saturation</label>
</div>
<div>
  <label><input type="checkbox" id="reverse-stroke"> Reverse Stroke</label>
</div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

const baseGen = {
  cost: 100,
  maxPW: 500,
  currentPW: 250,
  emissions: 4.0,
  fuel: "hydro"
};

const costData = [
  { ...baseGen, cost: 20 },
  { ...baseGen, cost: 100 },
  { ...baseGen, cost: 200 }
];

const maxPWData = [
  { ...baseGen, maxPW: 100 },
  { ...baseGen, maxPW: 500 },
  { ...baseGen, maxPW: 1000 }
];

const currentPWData = [
  { ...baseGen, currentPW: 50 },
  { ...baseGen, currentPW: 250 },
  { ...baseGen, currentPW: 500 }
];

const emissionsData = [
  { ...baseGen, emissions: 0.5 },
  { ...baseGen, emissions: 4.0 },
  { ...baseGen, emissions: 8.0 }
];

const fuelTypeData = [
  { ...baseGen, fuel: "coal" },
  { ...baseGen, fuel: "gas" },
  { ...baseGen, fuel: "combined" },
  { ...baseGen, fuel: "hydro" }
];

const allSections = {
  "#cost-showcase": costData,
  "#maxpw-showcase": maxPWData,
  "#currentpw-showcase": currentPWData,
  "#emissions-showcase": emissionsData,
  "#fueltype-showcase": fuelTypeData
};

function drawCircles(svgId, data) {
  const svg = d3.select(svgId);
  const spacing = 400 / (data.length + 1);
  const group = svg.selectAll("g")
    .data(data)
    .enter()
    .append("g")
    .attr("transform", (_, i) => `translate(${spacing * (i + 1)}, 50)`);

  group.append("circle").attr("class", "gen-circle");
}

for (let id in allSections) drawCircles(id, allSections[id]);

function updateVisuals() {
  const sizeAttr = document.getElementById("map-size").value;
  const satAttr = document.getElementById("map-saturation").value;
  const strokeAttr = document.getElementById("map-stroke").value;
  const reverseSize = document.getElementById("reverse-size").checked;
  const reverseSat = document.getElementById("reverse-sat").checked;
  const reverseStroke = document.getElementById("reverse-stroke").checked;

  const fuelColors = {
    coal: document.getElementById("color-coal").value,
    gas: document.getElementById("color-gas").value,
    combined: document.getElementById("color-combined").value,
    hydro: document.getElementById("color-hydro").value
  };

  const allData = Object.values(allSections).flat();

  // Size Scale
  let sizeScale = d => 15;
  if (sizeAttr) {
    let extent = d3.extent(allData, d => d[sizeAttr]);
    if (reverseSize) extent.reverse();
    sizeScale = d3.scaleLinear().domain(extent).range([10, 30]);
  }

  // Saturation Scale
  let satScale = d => 70;
  if (satAttr) {
    let extent = d3.extent(allData, d => d[satAttr]);
    if (reverseSat) extent.reverse();
    satScale = d3.scaleLinear().domain(extent).range([10, 100]);
  }

  // Stroke Width Scale
  let strokeScale = d => 0;
  if (strokeAttr) {
    let extent = d3.extent(allData, d => d[strokeAttr]);
    if (reverseStroke) extent.reverse();
    strokeScale = d3.scaleLinear().domain(extent).range([2, 20]);
  }

  for (let id in allSections) {
    d3.select(id)
      .selectAll(".gen-circle")
      .data(allSections[id])
      .attr("r", d => sizeAttr ? sizeScale(d[sizeAttr]) : 15)

.attr("fill", d => {
  const base = d3.color(fuelColors[d.fuel]);
  const s = satAttr ? satScale(d[satAttr]) : 70;
  const hsl = d3.hsl(base);
  hsl.s = s / 100;
  hsl.l = 0.5;
  const fillColor = hsl.formatHex();
  d._fill = fillColor;
  return fillColor;
})

.attr("stroke", d => {
  const base = d3.color(fuelColors[d.fuel]);
  const s = satAttr ? satScale(d[satAttr]) : 70;
  const hsl = d3.hsl(base);
  hsl.s = s / 100;
  hsl.l = 0.3;
  return hsl.formatHex();
})

.attr("stroke-width", d => strokeAttr ? strokeScale(d[strokeAttr]) : 0);

  }
}

updateVisuals();
d3.selectAll("select, input[type=color], input[type=checkbox]").on("input", updateVisuals);
</script>

</body>
</html>
