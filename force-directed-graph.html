<!DOCTYPE html>
<meta charset="utf-8" />
<title>Force-Directed Graph</title>
<svg width="960" height="600"></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

var svg = d3.select("svg"),
    width = svg.attr("width"),
    height = svg.attr("height");

var graph = 
    {
        nodes: [
            { id: "A" },
            { id: "B" },
            { id: "C" },
            { id: "D" },
            { id: "E" },
            { id: "F" },
            { id: "G" },
            { id: "H" },
            { id: "I" },
            { id: "J" }
        ],

        links: [
            {source: "A", target: "B"},
            {source: "A", target: "C"},
            {source: "B", target: "C"},
            {source: "C", target: "D"},
            {source: "D", target: "E"},
            {source: "F", target: "G"},
            {source: "F", target: "H"},
            {source: "G", target: "H"},
            {source: "H", target: "I"},
            {source: "F", target: "J"},

        ]
    };

var simulation = d3
    .forceSimulation(graph.nodes)
    .force("link", d3.forceLink(graph.links).id(d => d.id))
    .force("charge", d3.forceManyBody().strength(-100))
    .force("collide", d3.forceCollide(20))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .on("tick", ticked);


var nodes = svg
    .append("g")
    .selectAll("circle")
    .data(graph.nodes)
    .enter()
    .append("circle")
    .attr("r", 10)
    .attr("fill", "steelblue");

var links = svg
    .append("g")
    .selectAll("line")
    .data(graph.links)
    .enter()
    .append("line")
    .attr("stroke-width", 3)
    .style("stroke", "orange");


var texts = svg
.append("g")
.selectAll("text")
.data(graph.nodes)
.enter()
.append("text").text(d => d.id);


var textsAndNodes = svg
    .append("g")
    .selectAll("g")
    .data(graph.nodes)
    .enter()
    .append("g");

var texts = textsAndNodes
    .append("text")
    .text(function(d) 
        {return d.id}
    )
    .attr("font-size", 10)
    .attr("fill", "black")
    .attr("text-anchor", "middle")
    .attr("dy", "-1em");

var circles = textsAndNodes
    .append("circle")
    .attr("r", 10)
    .attr("fill", "red");




var drag = d3
    .drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended);

textsAndNodes.call(drag);

function ticked() {
    textsAndNodes
    .attr("transform", function(d) {
        return "translate(" + d.x + "," + d.y + ")";
    });
    /*nodes
    .attr("cx", d => d.x = Math.max(10, Math.min(width - 10, d.x)))
    .attr("cy", d => d.y = Math.max(10, Math.min(height - 10, d.y)));
    */
    links
    .attr("x1", function(d) {
        return d.source.x;
    })
    .attr("y1", function(d) {
        return d.source.y;
    })
    .attr("x2", function(d) {
        return d.target.x;
    })
    .attr("y2", function(d) {
        return d.target.y;
    });
    
    console.log(simulation.alpha());
}

function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
}

function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
}

function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
}



</script>
